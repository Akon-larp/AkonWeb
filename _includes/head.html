var za="<h3 onclick=\"document.getElementById('za').innerHTML=zaa\">Zákony Akonu</h3><h4>ZÁKONY AKONU</h4><p><br />1. ZÁKONY AKONU PLATIA PRE VŠETKÝCH BEZ VÝNIMKY, AJ PRE CUDZINCOV, KTORÝ O NICH EŠTE NEPOČULI A V PRÍPADE PORUŠENIA BUDÚ VŠETCI POTRESTANÝ V PLNOM ROZSAHU,<br /><br />2. TREST VYKONÁVA VŽDY OSOBNE SPRÁVCA AKONU, ALEBO OSOBA NÍM PRE TOTO URČENÁ,<br /><br />3. KTO URAZÍ ČESŤ SPRÁVCU AKONU BUDE ZBIČOVANÝ,<br /><br />4. KAŽDÝ MÁ PRÁVO NA SPRAVODLIVÝ SÚD,<br /><br />5. NÁJDENÉ PREDMETY PATRIA NÁLEZCOVI, ALE JE ZAKÁZANÉ PRIVLASTŇOVAŤ SI PREDMETY PATRIACE INÉMU TO JEST, ŽE ZA KRADNUTIE  SA UTÍNA RUKA,<br /><br />6. NIKTO NESMIE NIKOHO NAPADNÚŤ BEZ UPOZORNENIA VOPRED ( SPOR SA MUSÍ VYRIADIŤ V ČESTNOM SÚBOJI), INAK BUDE UVÄZNENÝ,<br /><br />7. KTO BUDE MRZAČIŤ ALEBO ZABÍJAŤ, S VÝNIMKOU PRESADZOVANIA TRESTU ZA PORUŠENIE ZÁKONA, BUDE ZMRZAČENÝ ALEBO ZABITÝ,<br /><br />8. KTO POUŽIJE MÁGIU NA OVLÁDANIE, ALEBO OVPLYVŇOVANIE NIEKOHO INÉHO BUDE UVÄZNENÝ. TO PLATÍ AJ PRE PRÍPAD, ŽE BY SVOJE MAGICKÉ SCHOPNOSTI NA ZLÉ OBRÁTIL A ĽUDU, MAJETKU ČI DOBYTKU BY ÚMYSELNE ŠKODIL,<br /><br />9. KTO POUŽIJE MÁGIU NA POVOLANIE ALEBO VYVOLANIE NIEČOHO ALEBO NIEKOHO, OBZVLÁŠŤ ZO SVETA MŔTVYCH, BUDE UPÁLENÝ,<br /><br />10. V PRÍPADE, ŽE BY SPRÁVCA AKONU NEDOBRE SPRAVOVAL SVOJU FUNCIU, ĽUD MÁ PRÁVO ZVOLIŤ SI NOVÉHO SPRÁVU, AVŠAK MUSÍ BYŤ KRÁĽOM SCHVÁLENÝ.<br /><br /><h4>Vnútorný poriadok Akonu!</p></h4><p>1. Vo vnútri mesta Akon je zakázané čarovať útočnú mágiu!<br /><br />2. Vo vnútri mesta musia byť zbrane schované v púzdrach, nesmú byť vytiahnuté, potom je postava považovaná za agresívnu! Ten kto bojuje na ulici, či sa pobije, je považovaný za výtržníka a bude zatknutý!<br /><br />3. Krádež je trestná!<br /><br />4. Každý je povinný pri vstupe do mesta, alebo kedykoľvek ho o to stráže požiadajú podriadiť sa kontrole!<br /><br />5. Každý kto chce postaviť v kraji dom, alebo si chce založiť nejaký cech musí to oznámiť! správcovi a ten mu podľa svojho rozhodnutia vydá alebo nevydá povolenie!<br /><br />6. Správca má právo, kohokoľvek vyhnať z mesta a takáto osoba má zákaz vstupu! Správca tiež môže udeľovať tituly ale môže ich aj odňať!<br /><br />7. Každý kto bude uctievať zlých bohov, najmä však Gilonela Krutého, Darnona Čierny Hák alebo Draga bude kruto potrestaný!<br /><br />8. V meste Akon je vyhlásené voľné náboženstvo, čo znamená že občania a ostatný si môžu uctievať akéhokoľvek boha, pokiaľ sa však jedná o dobrého boha!<br /><br />9. Zlý bohovia nemajú právo mať v Akone svoje chrámy a nesmejú byť uctievaní!<br /><br />10. Paladinovia majú právo žiť v meste bez daní a majú titul rytierov Akonu!<br /><br />11. V prípade, že sa stanoví vyberanie daní, je každý v meste povinný tieto dane platiť, avšak pokiaľ od nich nieje oslobodený!<br /><br />12. Večer sú brány zatvorené a každý kto chce vstúpiť dnu, musí zaplatiť nočné mýto, a v prípade zvýšenej ostrahy nemusí byť do mesta vpustený alebo naopak vypustený!<br /><br />13. Žoldnieri nemajú nárok na plat, ak nesplnili podmienky zmluvy a zadané úlohy, to platí aj pre vojakov v službách Akonu!<br /><br />„Kto nevinného, bezbranného alebo vzdávajúceho sa o život ukráti, zmrzačí alebo čo i len o kvapku krvi pripraví, pred spravodlivý súd sa postaví, a trestom najvyšším sa odsúdi!“</p>";

var ks="<h3 onclick=\"document.getElementById('ks').innerHTML=ksa\">Kráľove Slová</h3><h4>Výzva a prehlásenie kráľa Valeron</h4><p>Ja, kráľ Agnus Valeron som jediným a právoplatným panovníkom kráľovstva Tahou. Ako sa donieslo až k mojim ušiam, začali sa šíriť klamlivé zvesti o mojej údajnej smrti. A preto týmto vyhlasujem, že som živý a zdravý. Každý kto by také klamstvá aj naďalej šíril, bude spravodlivo súdený a riadne potrestaný! Aby som však vyvrátil pochybnosti všetkých mojich poddaných, rozhodol som sa osobne navštíviť novozískanú provinciu a múry pevnosti Akon.<br />Už pred nejakým časom na moju žiadosť odišli do Akonu 2 skupiny. Skupina paladinov pod vedením paladina Terrodauna, a skupina žoldnierov pod vedením kniežaťa van Hesselinga. Obe skupiny mali pomáhať domobrane v boji proti neľútostným a krvilačným barbarom Po dlhých a urputných bojoch sa nám podarilo s barbarmi podpísať prímerie. Za to, že na nás nebudú útočiť môžu s nami slobodne obchodovať a usadiť sa v okolí pevnosti Akon. A čo sa týka tých dvoch skupín, paladinovia vykonali v našom záujme veľa dobrého, a knieža van Hesseling bude postavený za svoje skutky pred súd a bude musieť toho veľa vysvetľovať.<br />Avšak v okolí sa stále pohybuje veľa podivných bytostí a desivých beštii a v pevnosti Akon sa nachádza len vysvätený oltár boha K`rulla – boha Osudu a Času, a vyhňa kováča Hansa. Preto pozývam všetkých dobrodruhov, obchodníkov, remeselníkov aj prostý ľud aby osídlili pevnosť Akon a v jej pevných múroch našli nový domov.<br /><br />Toto sú slová kráľa Agnusa Valerona, jediného vládcu Tahou!</p>";

var zm="<h3 onclick=\"document.getElementById('zm').innerHTML=zma\">Zánik Makenu - Vznik Akonu</h3><h4>Zánik Makenu, vznik Akonu.</h4><p>Bolo to už dosť dávno čo kráľ Agnus Valeron jediný právoplatný vládca Tahou, poslal do divokej a nepreskúmanej zeme plnej barbarov mierových vyslancov ktorý mali za úlohu nadviazať priateľské v sťahy s týmito divochmi. Vyslanci prijali svoju úlohu len s veľkou nevôľou lebo sa báli o svoje životy a nevedeli čo majú od týchto barbarov čakať. Ich strach bol o to väčší, keď im kráľ prikázal aby na cestu vyrazili neozbrojený a bez vojenského doprovodu, ako sa na mierových vyslancov patrí. Aby aspoň trochu zmiernil ich obavy poslal s nimi aj svojho najstaršieho syna Deldegara. Predpokladal že keď títo divosi uvidia medzi vyslancami aj jeho syna dá to ich vyjednávaniu vážnosť a vzbudí u nich rešpekt. Navyše chcel kráľ svojmu synovi zraziť hrebienok z hlavy lebo bol veľmi arogantný a namyslený. Deldegar túto správu niesol len veľmi ťažko, ale nedokázal otcovi odporovať. Bál sa totiž, aby sa nedostal do jeho nevôle a tým nestratil aj právo zasadnúť na kráľovský trón po otcovej smrti. Vedel totiž, že ak by sa otcovi vzoprel, mohol za následníka trónu na miesto neho vybrať svojho mladšieho syna Ulrika. Takže mu nič iné neostávalo len sa otcovi podriadiť. A tak sa aj stalo. Po krátkych prípravách sa na cestu vydala malá skupinka zložená z troch kráľovských vyslancov, kráľovho najvernejšieho paladina Kalmerona,  kráľovho syna Deldegara, jedného dôstojníka, klerika, dvoch kňazov a niekoľkých sluhov. Ich kroky viedli na sever k jednej z najbližších osád barbarov, ktorá sa volala Maken. Cesta bola dlhá a namáhavá. Keď konečne dorazili k cieľu čakalo ich nemilé privítanie. Akonáhle ich obyvatelia Makenu zazreli, pobrali zbrane a vo veľkej presile ich napadli napriek tomu že zďaleka museli vidieť viať bielu zástavu ktorú niesol vysoko nad hlavou dôstojník na znamenie mieru. Nezastavili sa do konca ani pred tým keď zistili že poslovia nie sú ozbrojený a do jedného ich brutálne pozabíjali. Telá potom povešali na hradby a ich hlavy poslali späť kráľovi ako odpoveď. Avšak dve hlavy chýbali, hlava paladina a hlava kráľovho syna.<br />Keď kráľ zistil čo sa stalo, dal okamžite vyslať do Makenu svoju elitnú jednotku, prezývanú aj ako „oddiel smrti“. Boli to tí najlepšie vycvičený vojaci z celej kráľovskej armády. Každý obyvateľ Tahou mal pred nimi veľký rešpekt a radšej sa im zďaleka vyhýbal. Tejto jednotke udatných velil najskúsenejší vojvodca kráľovstva, samotný Polus Tarnak, ktorý svoju statočnosť a oddanosť kráľovi preukázal už v mnohých bojoch. Kráľov rozkaz bol krátky a jednoznačný: „Každý kto si neváži mierového posla pod bielou vlajkou a navyše neozbrojeného a svoju zbraň poškvrní jeho krvou, nezaslúži si nič iné len SMRŤ!!“ A tak sa Tarnak aj so svojou jednotkou vybral pomstiť svojich druhov. Neúnavne hnali svoje kone až kým nepricválali k Makenu, kde zastihli jeho obyvateľov nepripravených. V tom okamihu sa strhol strašný masaker. Rad za radom sa bezvládne telá mužov, žien a detí klátili k zemi pod neľútostnými ranami svojich útočníkov. Všade po okolí sa rozliehal len plač detí, žalostné výkriky matiek, rinčanie zbraní a praskanie kostí. Behom chvíle padli všetci do jedného. Konečne nastalo ticho, len sem tam ešte zaznel z hromady mŕtvol nejaký bolestný výkrik. Vojaci zosadli s koňov a chodili medzi mŕtvolami, pokiaľ sa ešte nikto hýbal ukončili jeho trápenie raz a navždy. Nakoniec pozvešali mŕtve telá svojich druhov, pozapaľovali domy a vybrali sa na cestu späť. Nezostalo po nich nič len desivý  pohľad na spálenisko pokryté desiatkami znetvorených mŕtvych tiel, z ktorých sa valilo toľko krvi že potok ktorý v blízkosti tiekol zmenil svoju farbu na červenú a od tých čias sa mu vraví aj „krvaví potok“.<br />Okamžite po návrate podával Tarnak kráľovi hlásenie: „Pane, Tvoj rozkaz som splnil, tak ako si si žiadal. V Makene nezostal kameň na kameni a všetci obyvatelia padli do jedného pod spravodlivým rozsudkom našich zbraní. Taktiež sa nám podarilo naspäť získať telá našich bratov, avšak telo Tvojho syna a telo paladina Kalmerona sme nenašli.....“<br />Hneť na to dal kráľ vystrojiť bohatý pohreb, a všetky telá s veľkou úctou pochovali. A od tej chvíle ustanovil v kráľovstve zákon nad všetky iné zákony: „Kto nevinného, bezbranného alebo vzdávajúceho sa o život ukráti, zmrzačí alebo čo i len o kvapku krvi pripraví, pred spravodlivý súd sa postaví, a trestom najvyšším sa odsúdi!“ A tak sa tento zákon v kráľovstve Tahou prísne dodržuje až do dnešných čias! Ubehlo veľa rokov a po dedine Maken nezostalo nič, len prázdna planina plná rozkvitnutých kvetov, a blízky potok pamätajúci si jeho strašné dejiny. V dnešnej dobe sa už nad týmto krvavím potokom týči mohutná pevnosť Akon, ktorú tu dal zámerne vystavať kráľ ako nehynúci pamätník na počesť mŕtvym, ktorí tu za neho a svoju ríšu položili životy.<br />A čo sa vlastne stalo s paladinom Kalmeronom a kráľovým synom Deldegarom? Po posledných správach z Akonu už z určitosťou môžeme povedať že obaja sú mŕtvi. Paladin je pochovaný priamo v pevnosti, v útrobách chrámu boha K`rulla - boha osudu a času. Povráva sa, že keď mu chceli barbari uťať po smrti hlavu, hlava sa nedala žiadnym spôsobom odtrhnúť od tela. To sa údajne boh svojmu vernému služobníkovi chcel aspoň takto po smrti odvďačiť a nedovolil zmrzačiť jeho telo. Keď to barbari zistili v obavách ho radšej zakopali niekam do lesa. Jeho telo našli paladinovia za pomoci Lešija a následne ho pochovali v Akone.<br />A čo sa týka kráľovho syna, o tom sa zase šíria zvesti, že tesne pred smrťou zapredal svoju dušu diablovi, ktorý ho za odmenu spravil temným rytierom až do doby kým nebol tejto kliatby zbavený za pomoci paladinov. Jeho nový život však netrval dlho lebo bol chladnokrvne zavraždený a súd s jeho vrahom bude vykonaný v blízkej dobe.</p>";

var mm="<h3 onclick=\"document.getElementById('mm').innerHTML=mma\">Mŕtvy z Makenu</h3><h4>Mŕtvy z Makenu</h4><p>„.......jedného dňa ráno sa pred našou osadou Maken zjavila akási skupinka úbožiakov. Náš šaman tvrdil, že podľa znakov, ktoré mali na sebe to budú kráľovi vyslanci. Len čo to dopovedal, náčelník dal príkaz zatrúbiť do útoku a behom chvíle sme tých neozbrojených hlupákov pobili. Ich telá sme povešali na hradby a hlavy poslali späť kráľovi, ako varovanie čo spravíme s každým, kto vstúpi na našu zem. Avšak keď sme chceli uťať hlavu jednému členovi z ich skupiny, hlava sa žiadnym spôsobom nedala od tela oddeliť. Šaman povedal že to musia byť nejaké zvláštne čary, a kázal nám ho radšej zakopať ďaleko do lesa. To však nebola jediná divná vec ktorá sa stala. Tesne po tom ako som jednému holobriadkovi z ich skupiny vlastnoručne podrezal hrdlo, zaznel pekelný rehot a telo z ničoho nič zmizlo...... Večer sme usporiadali veľkú hostinu na znak nášho víťazstva. Na ďalší deň sa všetko vrátilo do starých koľají a každý sa venoval svojim povinnostiam ako by sa nič nestalo, akurát mŕtve telá na hradbách v nás vzbudzovali pocit z dobre vykonanej práce. To sme však ešte netušili aká skaza nás v blízkej dobe zasiahne. Už o niekoľko dní spolu so svitaním do našej osady vtrhli kráľovi vojaci a bez výstrahy nás napadli. Nezastavili sa pred ničím, bezcitne zabíjali každého kto im prišiel do cesty, ženy, deti, ba ja novorodencov. Netrvalo dlho a všade vôkol ležali mŕtve telá. Aj ja som pocítil krutosť a silu ich rán. V momente keď som sa snažil utiecť z osady mi prenikla chrbtom obrovská bolesť. Sklátil som sa k zemi a zamdlel som. Keď som sa konečne prebral, vojaci už boli preč. Celá osada bola v plameňoch a všetci jej obyvatelia boli mŕtvi, len ja som ako zázrakom prežil. Bol som ťažko raný a cítil som, ako mi z tela unikajú posledné zvyšky života. V tom som zazrel ako ku mne prichádza nejaká zvláštna postava. Nikoho podobného som v živote ešte nestretol. Podišiel bližšie a povedal: „Azrat, to že si ako jediný prežil nieje náhoda, Tvoj osud sa ešte nenaplnil“. Kto si a odkiaľ poznáš moje meno? „Teraz nieje čas na zbytočné otázky, všetko Ti vysvetlím neskôr. Ak chceš, staň sa mojím služobníkom a ja Ti dám nový, večný, život a možnosť pomstiť svojich bratov“. Popravde, veľa na výber som nemal a navyše, možnosť žiť a pomstiť svojich bratov sa mi zdala byť lákavejšia, ako vykrvácať a zomrieť, najmä ak by som mal žiť večne. A tak som súhlasil. Jediným dotykom palice mi vrátil unikajúci život a vyliečil všetky moje rany. Potom povedal: „rýchlo vstávaj, čaká nás ešte dlhá cesta“......<br />Od tej doby ubehlo už veľa času a ja mu robím spoločníka na cestách. Počas týchto ciest ma zaúčal do tajov nekromancie. Ako mi neskôr o sebe prezradil volá sa Karnax a je jedným z najmocnejších lichov na svete, ba dokonca tvrdí, že je ich kráľom. Za svojho jediného pána pokladá boha Draga, boha všetkých nemŕtvych. Aj mňa zasvätil Dragovi a spravil so mňa nekromanta. Taktiež mi vysvetlil čo to znamená veční život, ktorým ma obdaroval. Vďaka jeho schopnostiam ma zámerne nechal žiť, aby som sa mohol pohybovať medzi ľuďmi. Tak ako elfovia aj ja budem žiť večne a zomriem len v prípade ak by ma niekto zabil, na starobu zomrieť nemôžem. Keďže ja nestarnem a on je nemŕtvy čas nás nesúri. No jedného dňa mi povedal: „Musíš sa vrátiť do Makenu, už nastal čas Tvojej odplaty“. Bol som rád že konečne prišla tá chvíľa a mi sme sa vybrali späť do Makenu. Ešte prv než sme tam prišli sa so mnou rozlúčil a povedal, že keď budem potrebovať pomôcť, sa stretneme na dohodnutom mieste, alebo si ma sám vyhľadá. A tak som sa ja Azrat, služobník Dragov, vrátil späť do Makenu, aby som konečne pomstil smrť svojich druhov!“</p>";

var dpt="<h3 onclick=\"document.getElementById('dpt').innerHTML=dpta\">Denník Paladina Terrodauna</h3><h4>Denník paladina Terrodauna : Akon – posledná bašta odporu</h4><p>Tieto riadky píše Terrodaun,  verný služobník K`rulla a v súčasnosti paladin v exile. Avšak ešte pred pár dňami bolo všetko inak...<br /><br />Na kráľov rozkaz som sa ja - paladin Terrodaun, paladin Steelerth a rytier Stanley vydali do Akonu. Akon je novozískaná provincia, ale ešte ani zďaleka sa nedá považovať za podmanenú. Lesy okolo pevnosti boli plné barbarských kmeňov. Kráľova úloha spočívala v poskytnutí pomoci domobrane pri obrane pevnosti. Ale keďže okrem nás – skupiny paladinov a rytiera, bola do tejto krajiny vyslaná aj družina Kniežaťa a jeho žoldnierov, mali sme priestor na plnenie si našich duchovných povinností...<br /><br /></p><h5>Deň prvý</h5><p><br />Ako prvé bolo treba v tejto pohanskej zemi postaviť oltár K`rulla – boha Osudu a Času. S touto myšlienkou sme sa vydali do okolitých, temných lesov. Les bol hustý, stúpanie prudké, keď sme zrazu začuli podivné zvuky. Priblížili sme sa bližšie a videli sme ako nejaká postava zbiera a rozhadzuje šišky. Slova sa ujal paladin Steelerth a po krátkom rozhovore zistil, že spomínaná osoba je Lešij – Lesovík, ktorý tvrdil že je pán lesa a že dbá na to aby sa les rozširoval a preto rozhadzuje šišky. Okrem toho nám povedal, že po okolí chodí Duch a že v lese sa vyskytuje ešte veľa iných okrem nás. Rozlúčili sme sa s Lešijim a prisľúbili sme mu že tiež budeme rozhadzovať šišky.<br />Putovali sme ďalej a konečne sme našli miesto, kde by sme mohli postaviť oltár nášmu bohu. Dali sme sa do práce a čoskoro bol oltár hotový. Už, už sme sa ho chystali vysvätiť, keď sme uvideli približujúce sa postavy. Prikrčili sme sa a dúfali, že si nás nevšimli. Opak bol však pravdou a ich kroky smerovali priamo k nám a k oltáru. Ich reč bola lámaná, správanie primitívne, cnosti boli pre nich neznámy pojem a pravdepodobne ani inteligenciou príliš neoplývali, čo sme usúdili z ich neustálych rečí o truse, ktorý mimochodom považovali za potravu. Túto trojčlennú skupinu viedol muž, ktorý si hovoril Šakalí Trus a vyzeral z nich najskúsenejší. Práve on prehovoril ako prvý. Tento rozhovor však nikam neviedol a my sme mali veľa povinností... Pred odchodom sme ich požiadali, aby tiež rozhadzovali šišky. Ale oni mali tú drzosť sa opýtať, že čo za to, ak tak urobia a Šakalí Trus žiadal aby sme im pomohli keď ich niekto napadne. Duchaprítomne sme k tomu doplnili, že len v prípade že budú v práve. Po týchto slovách traja divní muži odišli.<br />Prepadli nás obavy z toho že možno videli K`rullov oltár a že by ho znesvätili, preto sme sa ho rozhodli zrušiť ešte skôr ako ho vysvätíme. Vracali sme sa do pevnosti, kde sme chceli zohnať nejaký iný materiál...<br />Už, už sme vychádzali na planinu, kde bola pevnosť keď sa zrazu za nami objavila postava. Keď na otázku kto alebo čo je odpovedala že je Anjel Smrti, hneď som nahliadol do jeho srdca a uvidel som že je fanaticky zlý a že Temnota ním presakovala. Dali sme sa s ním do boja. .... Švih,... sek, prásk,... sekanica, rúbanica.... do boja pribehol ďalší muž. No tento bol v brnení. Na moju otázku kto je odpovedal, že je Temný Rytier. A po nahliadnutí aj do jeho srdca bolo vidieť, že je fanatik Zla a Temnoty. Na kopčeku nad bojovým polom postávala skupinka, ktorá sa len prizerala, zatiaľ čo sa ozývalo rinčanie zbraní... Anjel Smrti náhle, počas bitky, zmizol. Ostal tam len Temný Rytier, ktorý sa ešte chvíľu bránil, ale nakoniec sme ho porazili. Bol mŕtvy. Prehľadali sme ho, no okrem určitého obnosu peňazí mal aj podivný krištáľ.<br />Vyšli sme na kopček pozhovárať sa s tou skupinou čo sa len prizerala. Bolo evidentné že Temný Rytier sa rozprával práve s nimi. Bol to Knieža a jeho žoldnier a žoldnierka. Každý pozná názor rytiera a taktiež paladina na žoldnierov: nedá sa im veriť, nemajú žiadne hodnoty, ideály, cnosti a za peniaze sú schopný urobiť všetko. Je len smutné, že ich viedol šľachtic, ktorý bol rovnakého charakteru. Dodnes nedokážem pochopiť ako je možné že aj takýto muži a ženy slúžia Jeho Veličenstvu. Ja osobne o ich vernosti Korune hlboko pochybujem.<br />Pokračovali sme teda do pevnosti, kde sme stretli kováča. Bol to čestný, pracovitý, prostý muž, s veľkými znalosťami. Svoju zručnosť nám ukázal keď nám opravil brnenia a svoju ochotu keď za to nič nepýtal. Povedal nám aj o relikvii. Vraj sa tu nachádzajú pozostatky jedného paladina, ktorého nedávno vyhlásili za svätého a práve jeho pozostatky by spravili oltár nezničiteľným a neznesvätiteľným. Vydali sme sa teda hľadať spomínanú relikviu.<br />Lešij nám pomôcť nevedel, ale povedal že by o tom mohol niečo vedieť Duch. Hľadali sme Ducha, keď si paladin Steelerth vypýtal peniaze a vykročil k približujúcim sa trom mužom. Boli to tí istí divní, ktorých viedol Šakalí Trus. Boli sme však napadnutí. Barbarský lukostrelec strieľal, druhý barbar bojoval a Šakalí Trus si čosi mrmlal. Zrazu okolo jeho postavy začali poletovať duše alebo duchovia. Zamrazil ma nepríjemný pocit až to zabolelo. Akonáhle sa niekto priblížil k stále sa točiacemu Šakaliemu Trusu duchovia zranili aj jeho. Usúdili sme že bude lepšie pobiť zvyšných dvoch barbarov. Lukostrelca sme zabili a bojovníka vyradili z boja. Obkľúčili sme Šakalí Trus a čakali kým prestanú padlí Duchovia chrániť jeho telo... V tom prišli ďalší zvláštny traja muži. Podľa ich výzoru sme usúdili, že sú to tiež barbari. Obávali sme sa ich úmyslov ale vysvitlo že oni chcú zabiť Šakalieho Trusa. Jeden z nich bol lukostrelec a tak z bezpečnej vzdialenosti ostreľoval Šakalieho Trusa. Keď kúzlo pominulo všetci sme sa vrhli na vyčerpaného kúzelníka. Nie len že tí traja Horali (ako nám povedali že sú, dovtípili sme sa že to pravdepodobne bude nejaká odnož ľudskej rasy ) zabili Šakalieho Trusa ale mu aj nožom vyrezali jeho genitálie, ktoré následne zjedli. Potom odišli. Pochovali sme lukostrelca a kúzelníka. Pomodlili sme sa nad ich hrobmi za ich stratené duše aby moc netrpeli. Ťažko zraneného bojovníka sme z božej moci vyliečili s tým že mu dávame druhú šancu. Pred tým ako odišiel sme od neho zistili že zostal jediný Divoch (príslušník druhej ľudskej barbarskej rasy)<br />Pokračovali sme v hľadaní Ducha, ktorého sme konečne našli. V rukách zvieral obrovský meč a cez jeho priesvitné telo prechádzali vetvičky okolitých stromov (neohýbal ich, prechádzali skrz jeho telo akoby tam ani nebol). Jediné čo bolo na ňom hmotné bol dobre nabrúsený obojručný meč. Dali sme sa s ním do reči. Bol vraj za svojho života vojak, ktorého kvôli jeho láske k žene černokňažníka preklial černokňažník. Blúdi tu po lesoch už dlho, a tak sme sa ho teda popýtali či by nevedel kde sa nachádza relikvia svätca, ktorú hľadáme. Povedal že vie, ale musíme vraj pre neho niečo splniť. Požadoval aby sme mu zohnali určité magické ovocie. On však nevedel kde sa nachádza. Zišlo nám na um, že o tom ovocí bude určite vedieť Lešij, veď je pán lesa. Lešij nás nasmeroval do zákutí tajomného lesa a tvrdil že máme hľadať, že vraj tam určite nejaké magické ovocie bude. Našiel som ho zakliesnené v jednom dutom pni. Bolo výborne maskované pred zrakmi kohokoľvek, ale keďže mojím osudom bolo nájsť ho tak aj napriek tomu som ho našiel.<br />Zaniesli sme ho Duchovi a ten nám povedal kde sa nachádzajú pozostatky svätca. Vykopali sme ich a doniesli do pevnosti. Rozhodli sme sa že oltár spravíme v pevnosti, aby sme mali o dôvod viac ju brániť. Postavili sme oltár. Ozdobili sme ho na vrchol oltáru sme dali strieborný prsteň – symbol K`rulla a do útrob oltára sme vsadili kosti svätého. Modlili sme sa, vysväcovali oltár a ako symbol toho že pohŕdame mamonou sme každý obetovali nemalé peniaze.<br />Začalo sa zvečerievať. Obloha sa zatiahla a netrvalo dlho kým prišla ozrutná búrka. Planina bola úplne premočená. Nedalo by sa po nej chodiť a les bol neprechodný tiež. Do neskorej noci sme strážili pevnosť, ale barbari sa neukázali. Uložili sme sa spať s dobrým pocitom že K` rull má postavený oltár v strede pevnosti. Noc bola pokojná....<br /><br /></p><h5>Deň druhý</h5><p><br /> Z rána si toho veľa nepamätám... Viem, že som brúsil meč, obliekol sa do brnenia a silno som utiahol remienky... Spomínam si aj na nejaké výkriky z druhej strany planiny. Neváhali sme a hneď som ja a paladin Steelerth bežali na to podivné miesto. Rytier Stanley vyrazil o niečo neskôr, lebo nebol ustrojený... Ako som spomínal, ja a paladin Steelerth sme prišli na dolný koniec planiny, kde sme videli ako posledné zbytky žoldnierov Kniežaťa berú nohy na ramená pred skupinou horalských barbarov... Okamžite sme išli brániť nešťastných služobníkov Jeho Veličenstva... avšak jeden z barbarov ovládal zákerné čary, čo spôsobilo že ja a paladin Steelrth sme sa začali nepretržite neprirodzene smiať čo nám jednoznačne znemožňovalo útočiť. Pred barbarskými šípmi a čepeľou nás zachránil rytier Stanley, ktorý síce prišiel neskoro, ale predsa. Bojoval udatne, sám sa bránil proti všetkým trom Horalom. Tým nám získal potrebný čas na zotavenie sa zo čarov. Už, už to vyzeralo veľmi zle s rytierom Stanleym, keď som z kríkov zazrel postavy... Bol to Knieža a jeho žoldnieri. Prevýšili tak počet barbarov, ktorí nelenili a dali sa na útek. Keďže sme už, ja a paladin Steelerth, neboli pod vplyvom čarov dali sme sa taktiež do prenasledovania Horalov. Jedného sa podarilo žoldnierom zabiť, ale ostatný dvaja ušli. Aj napriek tomu, že to bol barbar rozhodli sme sa ho pochovať a pomodliť sa za jeho dušu (teda za to čo mu z nej zostalo). Vrátili sme sa do pevnosti, kde čakal na paladina Steelertha odkaz. Musel náhle odísť plniť osobnú úlohu... po rozlúčke s ním sme sa rozhodli, že sa vydáme do okolitých lesov. Avšak Knieža a jeho žoldnieri nám tvrdili, že Temného Rytiera, ktorého sme zabili videli živého a zdravého... túto záhadu sme chceli vyriešiť (ostal som len ja a rytier Stanley). Vyhľadali sme Ducha, ktorý nám rozpovedal neúplný príbeh a tomto nešťastníkovi. Vraj to bol rytier, ktorý sa nejakým neznámym spôsobom stal posadnutý Temnotou, ktorá mu prepožičala svoju nemalú moc... dá sa to však vyliečiť (ak sa to tak dá nazvať). Potrebovali sme očisťujúcu modlitbu a kňaza ktorý by ju predniesol nad znehybneným telom Temného Rytiera. Zohnali sme oboje, na presné okolnosti si nespomínam aj keď viem že ten kňaz bol určite pod vplyvom silného vína. Koniec koncov podarilo sa. Znehybnili sme ho tak že sme sa ho znova zabili (v skutočnosti nebol mŕtvy) a kňaz ho očistil spomínanou modlitbou. Aké bolo naše prekvapenie, keď sme zistili, že ten zatemnený muž bol Princ, syn Jeho Veličenstva a následník trónu. Zhovárali sme sa a vydali sa do lesov riešiť ďalšie tajomstvá. V Princovej krvi však, dnes to už môžem povedať, bolo príliš veľa sebavedomia a tak sa vrhol na skupiny (dve) barbarov, ktorý sa ho pokúsili zajať. Samozrejme som bojoval aj ja. A bil som sa ako som len vládal ich presila bola neskutočná. Moje prekvapenie bolo o to väčšie, keď som uvidel na kopci stáť Knieža a jeho žoldnierov, ktorí neprišli na pomoc. Pravdepodobne to malo niečo spoločné s finančnými záležitosťami medzi nimi a Princom, ale to je jedno, fakt je že mi sme ešte ráno chránili ich podlé osobnosti a oni nám teraz nepomohli... Švih, sek, rozdával som, ale i prijímal rany, ... švih, brnenie bolo zničené, ... sek, krvácam,.... švih, sek ................... tma, chlad. V tej chvíli som zomrel. To čo som videl sa nedá opísať.... nejestvujú na to slová.... Pravda je že som sa prebral živý a zdravý na mieste kde som skonal. Dostal som za svoje služby K`rullovi druhú šancu? Alebo to bolo za to že sme dali druhú šancu tomu Divochovi (mimochodom nevyužil ju a aj on sám bojoval proti mne a Princovi).... ? Neviem odpovedať, ale jedno viem, určite to musel byť dôležitý dôvod.... Počas môjho spojenia s druhým svetom sa toho veľa udialo. Žoldnieri napokon pomohli Princovi, ale pevnosť obsadili spojené hordy Divochov a Horalov. Princ sa chcel obetovať a vymeniť seba za pevnosť, ale s tým som nemohol súhlasiť, však syna Jeho Veličenstva musím chrániť ako samotného kráľa... Chcel som ísť miesto Princa ale to zas nechcel on. Zhovárali sme sa a vtedy mi povedal niečo čo neviem pochopiť do dnešných dní..... Vraj Kráľ je mŕtvy! Neveril som, ale nemôžem spochybňovať slová Princa.... Dodal, že jeho otec-kráľ bol slaboch a ešte inak ho urážal... nemal som ani potuchy ako sa mám zachovať.... strašnééé.... nakoniec využil moju nesústredenosť, kedy som rozmýšľal nad tými slovami a vkĺzol za hradby so šepotom, že však mi ho zachránime. A že v prípade ak zomrie mám ja, paladin Terrodaun plné právo na trón, toto povedal pred tvárami žoldnierov, Kniežaťa a rytiera Stanleyho. Odmietol som však túto poctu s tým že nie som hoden, načo povedal že tým pádom nástupníctvo predáva rytierovi Stanleymu. Čakal som že aj on odmietne, myslel som že som ho už veľa naučil o hodnotách a cnostiach spolu s paladinom Steelerthom, ale hlboko som sa sklamal. Prijal nástupníctvo a ešte sa radoval. Pohltila ho moc.... moc nad ostatnými.... vládnutie..... mamona...... hriech! Princ dodal, že ako prvé musí rytier-kráľ Stanley vykonať popravu!!! Popravu mňa, paladina Terrodauna!!! Princ zmizol za hradbami. Čakali sme čo sa stane,... nič iného nám nezostávalo. Po nekonečne dlhej chvíle nám otvoril kováč, ktorý sa skryl pred barbarmi a tvrdil že vraj odišli tajným zadným vchodom. Rozbehol som sa k tajnému vchodu,... neďaleko od neho mali horali postavený pohanský oltár... nevšímali si ma a keď som sa ich opýtal, že kde je Princ odvetili že ho uväznili do skaly a že mu niet pomoci... Pomôcť mu mohol snáď len Duch, bol to najmúdrejšie stvorenie v týchto končinách. Vyhľadal som ho, dal mi artefakt - Mocný Kameň ktorým sa dá zlomiť kúzlo uväzňujúce Princa. Pri návrate k pohanskému oltáru ma zastavil Knieža vraj že potrebujú aby muž s čistým srdcom vyrezal Anjelovi Smrti srdce – miesto ktorého mal kryštál (ktorý určite chceli pre svoje účely). Odvetil som že sa hneď vrátim, že len idem oslobodiť Princa. Mojej prítomnosti znova nikto nevenoval pozornosť, až keď sa skala rozletela ma barbari napadli. Pribehol mi na pomoc jeden Žoldnier a Knieža.... Z boja si toho moc nepamätám.... viem že ma cez rozbité brnenie zasiahol šíp, šíp s uspávadlom. Keď som sa prebral nikoho iného som už nevidel. Iba hlas. Nikoho som nevidel, iba som počul hlas, ... hlas ktorý povedal: „To som ja Princ, hrdlo mi podrezal brčkavý veliteľ žoldnierov!“ Keďže Knieža ako jediný mal brčkavú hrivu bolo jasné kto to urobil. Vtedy do mňa vošiel hnev – áno hnev, najhoršie čo ma mohlo postihnúť. Hnev som sa ako paladin učil celý život ovládať, ale v tejto chvíli som bol jednoducho prislabí, možno ešte  účinky uspávadla, neviem, nechcem sa vyhovárať ale fakt je že v tom okamihu som ako paladin zlyhal... Zazrel som jedného zo žoldnierov ako pristupuje ku mne, vraj aby som sa ponáhľal že ma volá Knieža aby som im pomohol s Anjelom Smrti. Hnev bol silnejší ako cnosti, ako viera, ako všetko v čo som celý život veril a o čo som sa opieral. Toho chudáka som rozťal napoly a rozbehol som sa za Kniežaťom. Keď som pribehol k bojisku, boli na ňom: žoldnierka, Knieža a Anjel Smrti. Povedal som len jednu vetu, jednu vetu ktorá mi  asi navždy zostane v pamäti: „Je tu väčšia Temnota, ako Anjel Smrti! Ty Knieža, za to že si zabil Princa zomrieš!“ Švih, sek,... pred istou smrťou ho zachránila krúžková košeľa. Dal sa na útek. Bežal som za ním. Ale predsa v plátovom brnení (aj keď rozbitom ) sa  horšie beží ako v krúžkovej košeli. Celý čas sa mi snažil vysvetliť prečo to spravil, že aby som počkal, aby sme sa porozprávali... ale mňa poháňal hnev, nenávisť a zloba... Až keď už nevládal utekať som pribehol k nemu a povedal : „Spravil som to pre to, že som mal rád Kráľa a nezniesol som aby ho takto urážal!“ Ako tam tak Knieža stál sklonený a ja nad ním s obojručným mečom..... myšlienky..... spomienky...... cnosť.... česť..... sila...... odvaha...... hlavou sa mi preháňali chaotické situácie. ... „Dobre“ odvetil som. Odpustil som mu..... Upokojil som sa... asi to naozaj boli len účinky uspávadla... vyrezal som Anjelovi Smrti srdce – kryštál a dal som ho Kniežaťu. Pristúpil som k novému kráľovi Stanleymu a povedal som mu aby ma popravil, aby bola naplnená vôľa Princa. Kráľ Stanley však nechcel a naopak chcel aby som mu bol radcom. Odmietol som s odôvodnením že aj tak si robí čo chce a že by ma aj tak nepočúval. Všetkým som oznámil, že ráno odchádzam.... odchádzam do exilu.... nie, niekým vyhnaný,.... odišiel som sám.... z vlastnej vôle. Pred nami bola ešte noc a barbarov zostalo stále nemalé množstvo.....<br />Noc bola jasná, bolo vidieť Lunu, práve nastával spln.... zlé znamenie... temnota má vtedy veľkú silu..... a bolo to veru tak... v tú noc sme zabili veľa temných tvorov. Od minotaura, kostlivcov cez besných rysov až po dvoch lykantropov- rysodlaka a vlkodlaka. Striebornou dýkou som osobne obom vyrezal srdcia, aby som ich tak oslobodil od ich prekliatia........<br />Ešte zavčas rána som odišiel...... odišiel do exilu.... ja, Terrodaun, paladin v exile.... uvidím aké plány má so mnou K`rull – Pán Osudu a Času.....<br /></p>";

var pv="<h3 onclick=\"document.getElementById('pv').innerHTML=pva\">Pribeh Vyslanca Akonu</h3><h4>Príbeh vyslanca Akonu a jeho statočnej družiny v krajine Moriel</h4><p>Svoje zážitky spísal barón Arkor<br /><br />Tento príbeh sa začína dávno pred podivnými udalosťami v svete nemŕtvych, nekromantov a vládcov nad životmi a smrťou nás všetkých v krajine Moriel.<br />Pevnosť Akon utopená v hlbokých lesoch, plných divokých a nebezpečných bytostí, ten ostrov smrteľníkov, už dlho zažíva dlhý rad tragických udalostí a krvavých bojov s bytosťami vychádzajúcimi z podsvetia. Boje s nemŕtvymi, vlkolakmi a upírmi vyčerpávajú statočnou posádku pevnosti Akon, ich straty sú čoraz väčšie a hrozia definitívnym zánikom. Najstrašnejšia bitka sa odohrala pred niekoľkými mesiacmi, v tú noc plnú hrôzy a utrpenia, keď stovky nemŕtvych, vlkolakov a upírov zaútočili ako strašlivá čierna smrť na hradby pevnosti Akon, ktorú hrdinsky bránila posádka pod vedením správcu mesta Maximusa a jeho paladínov.<br />V tú noc sa začal príbeh vyslanca Akonu, baróna Arkora, ktorému bola zverená ťažká úloha, doniesť do krajiny Moriel magickú kovovú ružu a požiadať boha Zuula o prepožičanie jej moci, ktorá by mohla ochrániť pevnosť pred príšerami  podsvetia. Spolu s ním sa vydali na ťažkú a nebezpečnú púť statoční a verní bojovníci v čele s Lordom Zemom a Meluzínou.<br />Dlhá bola ich cesta do krajiny Moriel, kde v hlbokých pralesoch našli otvorený magický portál do podsvetia. Keď vstúpili do jeho útrob, ocitli sa v krajine zúfalstva a smútku, v krajine, kde temné mračná stále ronia dážď, kde hmly sa valia z temných zákutí dávno mŕtvych stromov, kde hniloba je kvetom smrti a vietor závanom beznádeje. Ocitli sa na brehu rieky Styx, ktorá svojím čiernym prúdom omýva hranice podsvetia a do nebytia odnáša duše zomretých. Dlho chodili po jej chmúrnych brehoch hľadajúc prechod a druhú stranu. Dlho a márne čakali na prievozníka cez rieku zatratenia -  Chárona. Keď sa už čakanie stávalo neznesiteľným podujal som sa pod nátlakom svojej družiny na zúfalý pokus, pozastaviť čas a tým aj tok rieky a vytvoriť priechod cez jej temný prúd. Bol to veľmi riskantný pokus, ktorý bol už za hranicami  mojich schopností, ale Boh času a osudu K´rul stál pri mne a podarilo sa mi na istý čas vytvoriť úzky prechod cez rieku a tak sme sa mohli bez toho, že by nás uchvátil mocný prúd rieky Styx dostať na druhú stranu a ocitli sme sa v podsvetí. Čas pre nás stratil význam a kúzlo, ktoré som vykonal, ako by predurčilo náš osud. Neviem, ako dlho sme blúdili po temnou brehu podsvetnej rieky, keď sa na nás usmialo šťastie a my konečne našli prievoz. Veľký bol Cháronov úžas, keď zbadal v krajine podsvetia skupinu živých, ktorých tam nedopravil on. „Čo mi fušuješ do remesla, akým právom si priviedol týchto smrteľníkov do krajiny mŕtvych a čo tu pohľadávate!“, boli jeho slová na uvítanie. Vyjadril som ľútosť nad svojím činom a musel mu prisahať, že už nikdy nepoužijem svoju magickú silu na prerazenie hranice podsvetia. Potom sa upokojil a dal sa so mnou do reči: “Hľadáme svätyňu boha Zuula, môžeš nám poradiť?“ Celkom ochotne nám ukázal smer, o ceste sa nedalo hovoriť, v hmlistých močiaroch väčšinou cesty nebývajú, ale aj tak sme mu boli vďační. Budúcnosť nám mala ukázať, že jeho pomoci budeme potrebovať viac, ako sme si vtedy dokázali predstaviť. Vydali sme sa ukázaným smerom a norili sa hlbšie a hlbšie do hmiel plných prízrakov, duchov, nemŕtvych a nekromantov. Veľmi skoro sa ukázalo, že v tejto beznádejou obdarenej krajine nie sme sami, ktorí majú ešte čo stratiť – nič menej ako svoj život. Po krátkom putovaní sa z hmly vynorila postava bojovníka v dosť zlom stave. Zastavil nás podivnou otázkou: „Je medzi vami nejaký šľachtic?“ Po chvíli zaváhania som prisvedčil: „Áno, som barón Arkor čo potrebuješ?“ „Hľadám liek na mor.“ (Zaujímavé ako aj v podsvetí človeka rýchlo nájdu.) „Mám liek, ktorý hľadáš.“ “Potrebujem ho pre nášho nakazeného druha, prosím ponáhľaj sa.“<br />Ten človek vyzeral skutočne úboho, choroba ho takmer strávila a zostávalo mu len niekoľko okamihov života, ale podarilo sa mi ho vytrhnúť z pazúrov smrti. (Asi by sa tá biela čarodejnica moc nepotešila, keby to vedela, musím si dávať pozor, kto mňa vidí, keď robím dobré skutky, pomyslel som si.) „Ja aj môj priateľ je vám dlžníkom, keby sme vám mohli nejako pomôcť povedzte si,“ ďakoval ten dobrý muž. Vysvitlo, že nie sú len dvaja ale bola ich celá skupina. Čo hľadali v tom upršanom kráľovstve smútku a zmaru som nezistil. Niekedy je lepšie nepoznať zámery po zuby ozbrojených bojovníkov, aspoň sa nepýtali na cieľ našej cesty. Spoločne sme prebrodili bahenné polia a zastali pred uzučkým mostom, na ktorého konci stála ďalšia skupinka bojovníkov. (Na to, že sme v ríši mŕtvych je tu nejako živo. Boh Drago asi nie je nadšený takým záujmom.) „Kde idete,“ hneď nás milo privítali, „Vy môžete prejsť, ale títo“, ukázali na nás, “Nie!“ „Tí sú s nami a sú naši priatelia,“ hájili nás naši „ochrancovia“. „Z čoho budeme žiť, nech zaplatia mýto!“ „Nebudú platiť sú s nami a môžeme prejsť bez mýta,“ už tasili meče, ale prv ako sa strhla bitka, som stihol povedať vodcovi našich priateľov koho hľadáme a on mi prisľúbil, pomoc. Poznal posla boha Zuula a verte neverte, do dvoch minút sa ukázal za chrbtom skupinky, ktorá nás nechcela pustiť na druhú stranu jeho temný posol. V tom okamihu bolo po hádke a frfľajúci  ochrancovia mostíka ustúpili tej čiernej postave s obrovským mečom. Vodca našich nových priateľov sa k nej pritočil a pošepol mu pár slov ...: “Som Anjel smrti, posol boha Zuula, donieslo sa mi, že ma hľadáš ....“ S úctivosťou (a veľkou dávkou obáv) som prisvedčil a povedal mu, že hľadáme svätyňu a dokonca samého boha Zuula. „Čo od neho chceš?“, nie veľmi prívetivo sa opýtal posol, v krátkosti som mu vysvetlil naše poslanie a požiadal ho o umožnenie návštevy svätyne, na počudovanie celkom ochotne súhlasil a my sa oddelili od ostatných ozbrojencov a ďalej pokračovali v ceste za Anjelom smrti.<br />Svätyňa boha Zuula bola pochmúrna stavba (no, kto by čakal medovníkovú chalúpku, že) obkolesená močaristou lúkou s pahýľmi mŕtvych stromov, napoly zaborená do okolitého bahna. Posol nás nechal čakať vonku a vstúpil, aby nás uviedol do svätyne. Z neďalekej húštiny zaznel hluk boja a viac nebolo mojím statočným vojakom treba. Hneď ich svrbeli zbrane v rukách, ideme  pomôcť našim priateľom. Vidiac, ako sa trasú na poriadnu bitku, som rezignoval a vybral si ako sprievod statočnú Meluzínu a ich prepustil, nech sa vyšantia. Len čo odišli dvere svätyne sa so škripotom otvorili a na prahu stál Anjel smrti: „Môžete vstúpiť, boh vás očakáva.“ Musím povedať, že v nás bola malá dušička (teda ja som sa tváril, ako že nič, ale ...) „Keď prídeme pred Božiu tvár, pokľakni“, ešte som stačil pošepnúť Meluzíne a už sme boli dnu. Svätyňa bola ponorená v tme, len proti oknu sa rysovala temná postava boha Zuula. “Čo si želáte?“, ozval sa jeho hlas z temnoty. „Prišli sme za Tebou Bože s žiadosťou o pomoc. Maximus, správca pevnosti Akon, posiela po nás tento magický predmet, oceľovú ružu, s prosbou, aby si jej dal silu proti nemŕtvym,“ trasúcimi rukami som otvoril truhlicu s ružou. „Prečo by som to mal urobiť?“ odvetil Boh. Vtedy bola vo mne malá dušička, nestála by ani za reč a určite by si ju ani nevšimol keby vyletela. Zobral som všetku svoju odvahu a odpovedal: „Pevnosť Akon už dlho obliehajú hordy nemŕtvych a hrozí, že obrancovia neprežijú ich ďalšie útoky a budú odsúdení k večnému blúdeniu a šíreniu zla po celej krajine.“ „Vidím, že situácia je horšia ako som si myslel, dobre pomôžem vám. Posilním magickou mocou tento artefakt a dám vám niektoré užitočné informácie o Akone. Ale aj ja po vás niečo chcem.“ „Veľmi radi, ak budeme môcť, ti prinesieme čo žiadaš,“ skromne som súhlasil. „K vykonaniu obradu budem potrebovať Slzu z rieky Styx.“ Trocha ma to zmiatlo, pre boha, ako máme takú vec získať, nikdy som o nej nepočul a tak som sa pre istotu hneď opýtal... „Slza z rieky Styx leží na jej dne a budete k tomu potrebovať Elixír sily, Pľúca beštie a Kúzlo odvahy, okrem toho za svoje informácie budem chcieť ešte Prach z kostí a Vodu zo zeme.“ „Koho sa máme pýtať na tie predmety?“ „Pýtajte sa Stína, Chárona, môjho brata Draga – ten sa s vami asi veľmi rozprávať nebude a Bielej smrti.“ Ďalej som sa už radšej nevypytoval, aj božská trpezlivosť má svoje hranice...: “Ďakujeme Ti. Prosím, dovoľ nám odísť.“ „Choďte s bohom.“ Po tých slovách sme vycúvali zo svätyne a boli radi, že máme ten rozhovor na kolenách už za sebou a sme zasa vonku na „čerstvom“ vzduchu.<br />Moji statoční vojaci sa kdesi stratili a my sa pomali vydali cez bahno okolo svätyne k miestu, kde pred časom bolo počuť zvuk bitky. Teraz tu bolo pusto a prázdno, no ako v hrobe, alebo podsvetí. Na zemi ležali hromádky čudne vyzerajúceho bieleho prachu, ktorý mi pripadal ako veľmi jedovatý. Opatrne sme ho obchádzali, keď sa zrazu ukázal Lord Zemo s rozžiarenou tvárou: „Tak sme to tým nemŕtvym ukázali, rozohnali sme ich a pozabíjali ...“ Taký bol šťastný. „A kde sú ostatní?“, jemne som sa opýtal. „Bežali tam dolu,“ ukázal smerom k blatistým lúkám na hranici hmly. „Výborne, tak teraz ich budeme čakať, alebo nie? Nemáme čas.“ A tak sme zostali traja - naši statoční vojaci si užívali. Ešte sme sa poriadne nestačili rozhodnúť čo ďalej, keď sa z hmiel vynorila čudná postava v oranžovom habite. Moje magické zmysly mi hneď napovedali, že toto stvorenie nie je veľmi naklonené živým bytostiam, ale utekajte keď vás už niečo také zbadalo. Treba sa tváriť, ako že ste na prechádzke. „Kto ste a čo tu hľadáte?“ Teraz mi už bolo jasné, že aj Boh sa môže mýliť a Drago sa s nami DAL do reči. Len mu za nič na svete neprezradiť, že sme boli pred chvíľou na posedení (pokľačaní) u jeho brata Zuula. Náš život by sa skončil veľmi rýchlo. „Hľadáme...“, trocha zamyslenia a diplomacie, nepovedal som mu, že Slzu, ale len tie tri artefakty, ktoré sme pre Zuula potrebovali. Evidentne tomu nerozumel a tak nepochopil, čo s tým budeme robiť. „Neviem, kde to môžete nájsť. Opýtajte sa Bielej čarodejnice, snáď vám poradí.“ No výborne, keď prežijeme Draga, tak Bielu určite nie... a ako pekne ju nazval. Každý vie, že ona šíri mor, choleru, lepru a iné radosti. Celkom pokojne sa s nami rozlúčil a odkráčal za svojimi čiernymi záležitosťami plnými mŕtvol. Bolo nám, ako by králikovi práve povedali, že tento had ho ešte nezje, ale potešilo nás to. Darmo, diplomacia niekedy zmôže viac ako obojručák.<br />Na chvíľu prestalo mrholiť, za to sa však z neďalekých húštin začala ťahať nepríjemná hmla, ktorá všetko skrývala a tlmila, tým však dala okoliu krajší ráz. Čo teraz? Koho sa opýtať, ako začať ďalšiu časť nášho putovania, aby hneď neskončilo v pazúroch niektorého miestneho obyvateľa alebo na ostrí meča ľudských vrahov. Po krátkom hlasitom rozmýšľaní sme sa dohodli, že jediná nám sympatická  bytosť je prievozník Cháron. Čo nám ostávalo, vydali sme sa na spiatočnú cestu k rieke Styx. Vošli sme opäť do mŕtveho lesa. „Pozrite tam niekto stojí“, upozornil nás Lord Zemo. Naozaj a nebol sám, bolo ich dokonca podstatne viac ako nás. Nie, že by v nás nebol dostatok odvahy ale prečo zomierať zbytočne a poslúžiť tak za potravu nevábne vyzerajúcim bytostiam (bez urážky). Rozhodli sme sa vyskúšať obchvat okolo bariny na miesto cesty cez úzky most pochybnej kvality. Predierali sme sa hustým, čiastočne hnilým porastom, naše nohy sa zabárali do bahna a šaty nám trhali šľahúne podivných rastlín, ktoré akoby si neželali aby ich niekto rušil v pomalom zomieraní. Konečne sme sa dostali na veľkú lúku (ak sa to, čo bolo pred nami dalo lúkou nazvať, nebolo to zelené ale hnedasté a sivé), nenápadne sme sa začali uberať na druhú stranu, vyhýbajúc sa tieňom vynárajúcim sa zo šera podvetia. Celkom bezpečne sme sa dostali až na breh rieky Styx a k prievozu, kde sa v šere zjavila postava prievozníka. Privítal nás ako starých známych, určite tušil, že po ňom budeme niečo chcieť. „Môžem sa ťa opýtať na pár vecí?“, začal som opatrne. „Ale kľudne, ak budem vedieť.“ „Boli sme v svätyni boha Zuula a ty iste poznáš dobre rieku Styx.“ „Mal by som, veď som tu prievozníkom od nepamäti.“ „Potrebujeme získať Slzu z rieky Styx.“ “To nebude jednoduché.“ „Viem, potrebujeme k tomu tri artefakty.“ Porozprával som mu aké veci potrebujeme a opýtal sa či náhodou nevie kde ich máme hľadať. „No to ani veľmi neviem, ale opýtajte sa mojej známej, Bielej smrti. Hľa akurát prichádza.“ Už je to tu! Náš rozhovor s Bielou čarodejnicou sa neodvratne blíži. Som zvedavý akú bude mať náladu, či na nás  zošle nejakú nepríjemnú chorobu hneď alebo nás zabije rýchlo. Urobili sme zopár krokov jej v ústrety. „Čo si želáte?“ Nahodila „milý“ úsmev čiernych pier v bielej tvári. Zatváril som sa ako by sa ma to ani netýkalo a povedal: „Hľadáme zopár vecí ...“ „Aj ja by som niečo potrebovala, nie pre seba, ale tam hľa pre priateľov nemŕtvych...“ No zbohom, ešte aj tí sú tu. „Potrebovala by som úlomok zničeného amuletu...“ - Ani som sa vo svojom rozprávaní nezmienil, že som potiahol, ale nie, zodvihol zo zeme v chráme boha Zuula podivný úlomok, ktorý zaujal moju pozornosť. - „Asi mám niečo také...“ Nemŕtvi prišli bližšie a ja im ukázal ten úlomok. „Je to ono,“ potešil ma ich vodca. Tak sme urobili v ríši podsvetia náš prvý obchod, získali sme za zlomok amuletu zvitok s Kúzlom odvahy. Radšej sme sa s vďakou rýchlo rozlúčili a obzerajúc sa dozadu, či nás nechcú použiť ako schránky pre duše zomretých, sme sa uberali preč. Získali sme síce prvý artefakt, ale boli sme zas na začiatku – kde hľadať ďalej? Vtedy sa stalo niečo nezvyčajné, ako by niečo zazvonilo a v hlave som počul hlas. Bol to hlas Boží. Pripravte sa, blíži sa k vám Beštia. Je to stvorenie celé zahalené v čiernom. „Počul som Božie vnuknutie“, povedal som svojím druhom. „Prichádza Beštia.“ Z náprotivnej húštiny sa vynorilo desivé stvorenie, chcel som sa tomu prihovoriť, inštinktívne sme sa rozostúpili. Temná postava mi neodpovedala a bez slova sa s taseným mečom vrhla na Lorda Zema, aj keď som bol najbližšie ja. Lord Zemo sa nedal zahanbiť a prvý úder bol jeho. To Beštiu trocha pribrzdilo, odrazila útok  vtedy sa pridala aj Meluzína a ja so svojím kúzlom Strely priamo z neba... a už sa váľala v prachu. Nebolo ťažké ju doraziť, o to ťažšie ju bolo zbaviť pľúc, čo sa mi s pomocou lordovho noža podarilo. Ani sme ju nepochovali a ľahko zakrvavení po tej úspešnej pitve sme sa vydali v ústrety ďalšiemu hľadaniu.<br />Ako vždy pred nami stala úloha koho sa opýtať, kto by mohol vlastniť posledný artefakt, ktorý sem museli mať. Ale po chvíľke rozmýšľaní nás napadlo, „Ešte sme sa nerozprávali zo Stínom.“ Kde ho hľadať sme samozrejme nevedeli a tak sme sa vybrali jedinou cestou, ktorú sme poznali – nazad ku svätyni Boha Zuula. Mali sme neuveriteľné šťastie, na lúke neďaleko svätyne sa vznášal podivný tieň, to bude určite on. Ani sme sa veľmi neobávali, už sme mali skúsenosti s jednaním s čudnými tvormi tejto krajiny, ale predsa len sme slušne pozdravili a on sa na nás otočil a ani nezoslal žiadnu smrteľnú kliatbu. „Hľadáme Elixír sily, nevieš o ňom niečo?“ Teraz naozaj pri nás stali všetci bohovia, celkom jednoducho siahol do záhybov svojho tienistého habitu a vylovil odtiaľ malý flakón s červenkastou tekutinou. Neviete si predstaviť, ako sme sa potešili a po rýchlom rozlúčení sa opäť vydali k prievozníkovi. Celkom bez obtiaží sme (po koľký krát už) prešli nám dôverne známou krajinou. Pri prievoze ale bolo veľmi rušno. Toľko rôznych bytostí sme na celej svojej púti ešte nevideli, každý od prievozníka niečo chcel a on bol z toho veľmi nešťastný a nakoniec sa zjavil aj Boh Drago, ktorý mu začal nadávať, že do jeho krajiny prenikajú živí a prečo ich preváža ... Na chvíľu sa mi ho však podarilo vytrhnúť z davu všetkých čo po ňom niečo chceli a našli sme chvíľu, v ktorej som ho požiadal o pomoc pri hľadaní Slzy. Ešte pred nami ostávala úloha rozhodnúť kto je taký statočný že pôjde do temného prúdu rieky a vytrhne jej z moci vzácny artefakt. „Ja nemôžem, musím sa vrátiť s ružou do Akonu,“ hneď som sa vyradil zo zoznamu hrdinov. „To ako že naznačuješ, že ten kto pôjde pre slzu sa nevráti?“ Celkom logicky namietol jeden zo statočných vojakov, ktorí sa k nám opäť pripojili. Nie, tak som to nemyslel, ale čo keby náhodou, kto dokončí našu úlohu,“ chabo som oponoval. Bolo jasné, že nikomu sa do tej čiernej hlbiny, plnej nechutných vecí nechce. Našťastie sme predsa len mali medzi sebou najstatočnejšieho bojovníka. Meluzína sa prejavila ako ten kto je hodný a schopný vykonať tento hrdinský čin: „Idem, ja, keď sa nikomu z vojakov nechce.“ Ani nenaznačila, že ja som sa tiež nemal k činu, to bolo od nej pekné. Kým sme opäť stihli vytiahnuť prievozníka od jeho povinností, pristúpil k nám vodca barbarov: „Potrebujem pomoc tvoju a tvoji vojakov a možno budem mať pre teba niečo čo potrebuješ.“ „Môžeme ti pomôcť, ale najprv musíme vykonať to prečo sme prišli na tento breh rieky Styx,“ odpovedal som mu. “Dobre, sme dohodnutí, keď to bude ešte treba pomôžete nám.“ Mali sme len pár chvíľ na splnení našej úlohy, Cháron sa vybral do silného prúdu s Meluzínou a my sa prizerali na to čo sa odohrávalo na temnej hladine rieky zabudnutia. Hľa aj Stín sa prišiel pozrieť ako si Meluzína poradí s ťažkou úlohou. Videli sme, ako sa vrhá do prúdu a stráca sa v ňom. Dlho sme hľadeli do špinavého prúdu rieky a už si mysleli, že už nikdy neuvidíme našu statočnú bojovníčku, keď sa nečakane vynorila. Bola veľmi vyčerpaná a z posledných síl sa vydriapala z prievozníkovej lode na breh. „Máš?“ Boli moje prvé slová. Bez toho, že by niečo povedala mi ukázala Slzu z Rieky Styx a úplne oslabená sa zvalila na zem. Už nás nezaujímal ruch okolo nás, len sme sa snažili je znovu navrátiť silu. Nakoniec sa nám ju podarilo prebrať k životu a po krátkom oddychu som ju požiadal aby odniesla Slzu Bohovi Zuulovi.<br />Spolu s vojakmi sme sa vybrali nájsť vodcu barbarov a pomôcť mu v súboji s nekromantmi a nemŕtvymi. Ďalšie udalosti potom nabrali rýchly spád. Dve armády sa stretli na brehoch rieky Styx v divom boji, vodca barbarov sa niekam stratil a potom som sa dozvedel, že sa im podarilo zavrieť portál do podsvetnej ríše. Ešte dlhá bola naša púť, keď sa k nám pripojila Meluzína, ktorá odovzdala Bohovi Zuulovi Slzu a priniesla od neho zvitok s príbehom dávneho mesta Maken a železnú ružu, v ktorej pulzovala silná mágia pomáhajúca v boji s nemŕtvymi. Hľadali sme a našli druhý portál z podsvetia, ktorý nám pomohol k návratu do sveta živých. Pred nami už bola len cesta nazad do pevnosti Akon, plná očakávania budúcich udalostí.</p>";

var zz="<h3 onclick=\"document.getElementById('zz').innerHTML=zza\">Zápisky Zlatého Elfa Kúzelníka</h3><h4 style=\"font-family:\"Old English Text MT\"\">Zápisky zlatého elfa kúzelníka</h4><p>Mesto Akon hrdo vypína svoje hradby uprostred hlbokých lesov. Cesta mňa aj mojich priateľov zaviedla k starobylej bráne, ktorá sa pred nami so škripotom otvorila a my vstúpili priamo do živého ruchu v jeho uliciach. Našli sme si ubytovanie v mešťanskom dome neďaleko starobylej čajovne, kde trávili svoj čas aj veľmi vysoko postavení občania mesta Akon. Spolu so mnou prišla aj moja milovaná rytierka Ankara. Na námestí sa zatiaľ diali čudesné veci. Najväčší dav ľudí sa nachádzal neďaleko praniera, kde sa chystali na pokyn správcu mesta  zbičovať niektorých občanov. Než som sa stihol pretlačiť cez ľudí, odviedli ich niekde preč a tak som ich stratil z dohľadu. Ocitol som sa na bočnom námestí, pribehol ku mne obchodník a hneď sa okolo nás nazberal hlúčik ľudí, elfov, barbarov a podobných bytostí. Obchodník podivne zapáchal a nechal sa oslovovať „Cibuľa“. Na zem položil veľké vrece, z ktorého vyťahoval rozličné podivnosti. Nehovoril obecnou rečou, pochádzal z ďalekej krajiny a kto s ním chcel obchodovať, musel sa naučiť jeho čudnú reč. Znela asi takto: „Pozrela, aha čo ja mať, magická prsteň, prodat, vymenit ...“ Kúpil som si od neho magický prsteň, ďalšiemu bojovníkovi predal helmu. Slovo dalo slovo a on  si nás najal ako svoju osobnú stráž.<br />Mojou úlohou v meste bolo nájsť temnú bytosť čo ma prekliala. Moje vlasy sa zmenili na krátke čierne a už nerástli ďalej ... moje nádherné vlasy sú preč!<br />Cestou do Akonu sa k nám pripojil aj mág menom Arkor. Bol veľmi záhadnou postavou a nikto nevedel odkiaľ pochádza a aký je jeho cieľ.<br />Správca mesta vyhlásil odmenu za zabitého vlka, rozdelili sme sa a vošli do lesa. Vlka sme síce nenašli, ale zato obchodník urobil dobrý obchod, jednému z vojakov „Cibuľa“ predal vzácnu vec a dobre zarobil. Naša cesta viedla lesom a my sme, nemajúc nič na prácu, pomali kráčali a užívali si pekný deň. Keď sa zrazu stala tá podivná vec: lesom sa vznášalo veľké bojové kladivo. Kto niečo také nevidel, ako ja na vlastné oči, neuverí. Ako sme sa dozvedeli neskôr, bol to duch kráľovho syna. Zachránili nás pred ním hradby mesta, kde som vyhľadal kňaza, od ktorého som dostal talizman, umožňujúci rozprávanie sa s duchmi.<br />Aby nám mysle pookriali a spamätali sa zo stretnutia so záhrobnou ríšou, naše kroky celkom neomylne našli miestnu krčmu, kde sme obklopení rôznymi povaľačmi a pijanmi zahasili smäd a vylepšili si názor na svet. Pred krčmou sme stretli milého alchymistu, ktorý mi ponúkol neznámy elixír. Veľmi som mu neveril, tak som ho radšej  nepil, aj keď mi za to ponúkal slušnú odmenu. Osud nám po odchode z tohto požehnaného miesta prihral do cesty čudnú žienku, ktorá sa potulovala po okraji lesa a ktorej sme sa spýtali na cestu. Ukázala nám smer a chcela, aby sme na stretnutie s ňou zabudli, mohli by sme sa dostať kvôli nej do problémov. Dotackal som sa so svojou družinou k nášmu domu a išiel na chvíľu spať, aby som bol pred nocou dobre odpočinutý a pripravený použiť mágiu. Noci tu vraj bývajú plné nebezpečenstva a ja som prijal úlohu strážiť cintorín pred nemŕtvymi, ktorý vykrádali hroby. Spoločnosť mi robili a samozrejme aj ochranu poskytovali rytierka Ankara, bojovníčka Avi a hraničiar. Keďže sme nemali ani potuchy, kde sa onen cintorín nachádza, sám Správca sa podujal odprevadiť nás až na miesto. Zrejme sme boli veľmi dôležití alebo už možno nebolo nikoho, kto by sa tam odvážil strážiť celú noc. Keď sa s nami rozlúčil pred vstupom vybral sa do mesta riešiť iné dôležitosti (pozn. aut.: išiel si pre pivo). Ktovie prečo, ale tú noc sa nič dôležité nestalo, nik neprišiel, nik nerušil žiadnym kvílením, búchaním, škrekmi a inými nechutnosťami kľud tohto posvätného miesta - len mŕtvolný chlad cintorína ukonal aj udatných bojovníkov a preto sme sa rozhodli vrátiť do mesta. Bol pred nami len jediný problém: Preboha kade?<br />K cintorínu sme išli dosť ďaleko a len málokto z nás mal orientáciu a pamäť sťahovavých vtákov - skoro sme zablúdili, keby nebolo Ankary, ktorá nás pomocou ženskej intuície vyviedla z temného lesa do ulíc Akonu. Pred našim príchodom sa mestom prehnal vlkolak, ale nikoho nezabil a tak sme išli spať bez hrdinských činov.<br /><br />Ďalší deň bol kľudnejší. Po dobrom a zaslúženom spánku a ľahkých raňajkách sme v hlbokých húštinách v okolí mesta stretli samotného Licha, vládcu nemŕtvych, ktorý práve pred niekoľkými chvíľami napadol a ochromil paladina. Našťastie pre nás, mal veľmi naponáhlo a zmizol skôr, ako sme sa mohli zľaknúť. K večeru sa strhla na námestí veľká vrava, ktorá nás vylákala od večere - obvinili miestnu kleričku, že je upírka. Nechcelo sa mi veriť, že by upíri nosili ruženec a bibliu. Veril som jej úprimným očiam, aj tak ju vsadili do vezenia a čakali do západu slnka, či sa premení v bytosť noci. Prišiel, že vraj, jej upírsky otec a oslobodil ju od upírstva. Čo sa s ňou stalo ďalej už neviem, opäť sme zamierili do našej známej krčmy a prišiel večer.<br /><br />Pre veľký úspech sme aj túto noc išli strážiť cintorín, keď som však zháňal dobrovoľníkov, nikomu sa nechcelo - a prečo aj. Je príjemnejšie zvládnuť päť pív, ako jedného nemŕtveho.<br />Neostalo mi nič iné - išiel som len so svojou spoločníčkou Ankarou a ako obyčajne sme zablúdili v lese. Nevedeli sme nájsť cintorín, nevedeli sme  nájsť cestu naspäť do mesta a potom sme už nevedeli vôbec nič a ostali uprostred temného lesa. Báli sme sa, ale nestrácali sme chladnú hlavu. Po čase, keď sme sa už chceli utáboriť, zjavil sa náš záchranca - pán Správca a po istom čase nás doviedol opäť na cintorín. Za svetlom tam prišli aj hraničiar s bojovníčkou Avi.<br />Zrazu som začal mať divný pocit, prebudilo sa vo mne divná sila, také čosi som nezažil a drala sa na povrch, chcela ísť von, neubránil som sa a stratil som vedomie. Potom si len pamätám, ako som sa prebudil v kríkoch a nado mnou sa všetci skláňali (pozn. aut.: bol som vlkolak). Cítil som sa unavený a slabý. Odniesli ma ku fakli a vtedy sme začuli zvuky, niečo sa k nám blížilo, bolo to všade okolo nás. Všetci sme sa ukryli do tieňov okolo fakle a čakali. Zaútočili na nás zo všetkých strán, boli to nemrví - ghulovia. Ankara kričala bojové povely a všetkých nás pripravila na boj. Stačilo pár dobre mierených úderov a za chvíľu sme ich porazili a ostatní sa dali na ústup. Len Správca, ktorý sa bezhlavo vrhol priamo medzi nich a narobil v radoch ghulov chaos a zmätok, bol ťažko zranený a stratil vedomie. Čo teraz? Rýchlo som s Ankarou bežal do mesta pre pomoc. V neuveriteľnej tme, ktorú rušilo len svetlo fakieľ, som našiel nášho magického spoločníka - vykľul sa z neho klerik. Zobrali sme ešte nejakých bojovníkov a nazad sme prišli práve v čas aby klerik Arkor mohol magickou silou vyliečiť Správcu, ktorý však potreboval od Ankary ďalšiu pomoc. Jej schopnosť Obeta mu zachránila život. Vtedy prišiel nový útok nemŕtvych. Ich príšerné tváre sa na nás pozerali z temnôt a náš boj proti nim bol veľmi ťažký. Tu sa ukázalo aké silné je spojenie statočných bojovníkov s magickými schopnosťami ich druhov. Po boji Ankara s Avi niesli správcu do mesta a ja s ostatnými sme tvorili ich obranu. Zranenia ma tak vyčerpali, že som padol od únavy. Už na dohľad mestských hradieb nás prepadli vlkolaci a naše statočné bojovníčky pustili Správcu na zem (pozn. aut.: chudák to skoro zaplatil životom) a spolu s ostatnými sa bránili. V neúprosnom boji sme zvíťazili a potom si len pamätám, že prišli žoldnieri a odniesli ranených za hradby Akonu. V meste sa o nás a správcu dobre postarali a vyliečili nám naše mnohé rany. Mojej maličkosti sa venoval s veľkou pozornosťou Zvierací poloboh, ktorého som aj predtým stretol a vďaka jeho umení som úplne vyzdravel.<br />Po týchto dramatických udalostiach Správca menoval skupinu dobrovoľníkov, ktorí ho budú sprevádzať do taverny. Bolo nás asi sedem, s fakľami a tasenými mečmi sme sa vydali cez trávnaté pláne, z ktorých za zdvíhala hmla. Okolitá krajina zahalená v jej závoji vydávala tajomné zvuky a my čakali, kedy na nás noc vyvrhne strašlivého vlkolaka.<br />V taverne si správca vybavil potrebné veci a urýchlene sme sa vracali do bezpečia opevneného Akonu. Nebolo nám súdené vstúpiť bez problémov za jeho mocné hradby. Okolo mesta bojovali proti sebe upíri a vlkolaci. Mestskú bránu strážil mocný paladin Terrodaun. Keď nastal kľud vstúpili sme do mesta. Bol som na námestí a predo mnou stála Avi. Pozerali sme sa jeden druhému do očí. Keď ma zrazu temným kúzlom omámila a napila sa mojej krvi. Celý svet sa so mnou zatočil a já nevedel čo je so mnou. Chcela, aby som ju kusol, tak som poslúchol - zrazu sa svet zmenil ... stal som sa upírom. Videl som lepšie, počul som lepšie, bol som silnejší. Predo mnou sa zjavil Terrodaun a mocným kúzlom nás odohnal za hradby......„NIEEEE...... Prečo si to urobila, prečo si ma nenechala na pokoji, mám v meste priateľku a teraz, teraz ...“ usmiala sa: „Teraz si upír!“ Hlad bol hrozný, musel som sa napiť krvi, ľudskej krvi. Keď vtom sa otvorila brána a do skupinky piatich upírov napochodovala Ankara. Keď som ju zbadal, začal som ustupovať. Nechcel som jej ublížiť. Miloval som ju, ale bol som upír. Prišla ku mne, padol som na kolená a chcel som ju prosiť o odpustenie. Ostatní upíri, keď ma videli pred ňou ustupovať, tiež ustúpili. Do úst mi naliala elixír a odbehla preč. Schovala sa v meste. Mňa chytili kŕče, nemohol som sa hýbať. Prestal som cítiť potrebu krvi, bol som opäť človek. Mesto sme túto noc ubránili, upírov vyliečili a začalo svitať...<br /><br />Nasledujúce ráno, či už skôr obed, sme boli, bojovníci z cintorína a záchrancovia Správcu, pasovaní do šľachtického stavu - ja, Arkor, Ankara a bojovníčka Avi sme sa stali barónmi. Ankara bola za svoje mnohé hrdinské činy pasovaná do rádu paladinského.<br />Po obrade sme sa rozhodli pozrieť na cintorín, aby sme zistili čo sa stalo z telami zabitých ghulov, ale ani jedna mŕtvola tam už neležala. Kríže boli pováľané po nočnej bitke a tak sme posvätné miesto trocha upravili a snažili sme sa zakryť všetky stopy neľútostného boja. Keď sme všetko dali do poriadku vybrali sme sa pomali nazad do Akonu. Prekvapil nás ešte jeden nález: Neďaleko od cintorína hlboko v zemi zarazené drevené koly a pod nimi upír poslaný na večný spánok. Už sme sa ničoho nedotkli a ponáhľali sa domov.<br /><br />V meste nás už očakával Správca a požiadal, aby som našiel živú vodu a knihu života. Celá družina sa podujala na túto obtiažnu úlohu. Hľadali, pýtali sme sa všetkých, až mi jeden milý pán dal živú vodu, výmenou za protislužbu. Ešte ostávala kniha života. Správcovi sme odovzdali živú vodu a on nám pomohol: Povedal, že v okolí videl potulovať sa jedného černokňažníka, že on by mohol vedieť kde je. Vybrali sme sa ho teda hľadať. Dopočuli sme sa aj o bani, v ktorej sa dá ťažiť železo. Počas cesty do bane sme mali šťastie, cestu nám skrížil černokňažník. Chceli sme knihu a on nás napadol. Mňa uväznil kúzlom, nemohol som sa hýbať a zosielať kúzla. Ankara, Avi a Matej ho premohli a našli v jeho rúchu útržok papiera s miestom ukrytia knihy: Na cintoríne pod najväčším krížom. Tak, že sme znova zamierili za naším osudom - na cintorín. Cestou sme v meste pribrali aj klerika, hraničiara a Angrim, ktorý ako hraničiar zbieral hríby a varil pre Správcu vynikajúce polievky. Sprevádzal nás lesnou cestičkou. Ako vravel černokňažník, pod najväčším krížom bola ukrytá Kniha života - Ankara ju vyslobodila z objatí hrobu. Návrat ako väčšinou nebol bez obtiaží. Prepadli nás tri tvory (pozn. aut.: boli to buaby, ale ešte nevyvinuté). Bojovali sme v blate a bránili sme Knihu života, ktorú som tajne dal najrýchlejšiemu z nás, Matejovi. Príšery obehol a knihu odniesol do Akonu. Ankara a bojovníčka pri boji padli do blata, ale podarilo sa nám za pomoci magických schopností klerika Arkora zvíťaziť. A tak sme sa v dobrej nálade vrátili do mesta, kde sme sa vysušili, najedli, oddýchli a načerpali novú magickú silu. Po dobre vykonanej úlohe nás čakala ďalšia.<br />V hlbokom lese ďaleko za hradbami mesta sídlil alchymista, ktorý ale odišiel. Správcovi sa doniesli čudné správy: v jeho laboratóriu sa usídlili podivné bytosti. Mali sme zistiť či predstavujú zlo alebo dobro. Zlo bolo treba vykoreniť v samých základoch a očistiť alchymistove laboratórium. Potrebovali sme tiež nájsť paladína Terrodauna, aby nám pomohol zasvätiť novú paladínku Ankaru do jej povinností. Cestou sme znovu narazili na tú divnú žienku, ktorá teraz pre zmenu utekala pred bandou bojovníkov, čo ju chceli zabiť. Tvrdili že, premieňa bojovníkov na žaby, bojovníčka jedného zakliateho bojovníka musela pobozkať, aby ho zbavila jej kúzla. Občerstvili sme sa v krčme a vydali sa v ústrety novému dobrodružstvu.<br />Les nás privítal podozrivým kľudom a za chvíľu sme sa driapali do strmého svahu. Po pravej ruke, na dne hlbokej strže nám tiekol potôčik. Okrem zvuku vody bolo absolútne ticho. Ticho, v ktorom je prítomné zlo ... Hlboko v lese sme potom objavili alchymistov brloh, správy neklamali. Báli sme sa vstúpiť do temného vchodu pretože sme cítili prítomnosť nebezpečia. Po chvíli váhania sa prvý z tvorov objavil pri vchode, jeho znetvorená tvár napovedala takmer všetko. Ankara ale pre istotu použila svoje magické schopnosti a donútila príšeru odhaliť v sebe zlo. Vtedy sa začal neľútostný boj. Dvaja goblini, ktorí sa na nás vrhli, boli silní aj na nás štyroch. Zaútočili sme mečmi aj mágiou. Avi dokonca urobila premet, aby dostihla unikajúceho goblina a spolu s Arkorom ukončili jeho biedny život. Porazili sme ich a vo vnútri alchymistovej chyže sme našli telá dvoch upírov a nášho spolubojovníka Maťa. Bol v bezvedomí, mal ohryzené ruky a nohy, ani sme nevedeli kedy sa od nás odpojil a pokúsil sa sám splniť našu úlohu. Goblini ho ale vlákali do pasce a to sa mu stalo osudným. Po chvíľke uvažovania sme ho zobrali zo sebou. Cestou do mesta sme narazili na kruh, magický kruh. Skúšali sme všetko možné ale neprišli sme na čo slúži. Uzdravili sme toho zraneného dobráka a povedal nám, že kruh používali na odhalenie pravdy, pribehol k nám aj jeden zo správcových bojovníkov. Veľmi sme sa potešili, keď sme zistili, že má pri sebe posvätný kolík na upírov a poslali sme ho ukončiť ich pozemskú púť do alchymistovej dielne.<br />Na smrť unavený som išiel spať, aby som bol pripravený na večer. Na námestí sa zatiaľ začal súdny proces s bosorkou -  to je predsa  tá divná žienka čo nás stále stretávala. Fuj ale sme mali šťastie, že nás nezakliala. Mala krásny fakľový sprievod v strieborných putách. Celé mesto sa skvele pobavilo a .... upálili ju. Jej duša odletela k nebu čistá.<br /><br />Slnko sa klonilo k západu a opäť nastala noc - noc, v ktorej príšery vládnu a biedni smrteľníci sa bránia za hradbami Akonu. Ešte sme netušili, že túto noc sa zdvihnú tisíce nemŕtvych a zaplavia šíre lúky pred bránami mesta. Naša skupinka sa vybrala  strážiť priesmyk, medzi Akonom a Makenom, vyvraždeným mestom, v ktorom sa skrýval kráľ lichov so svojimi nemŕtvymi služobníkmi. Správca mňa, Ankaru, Avi, Angrima a Mateja zaviedol na miesto. Asi po pol hodine začali prichádzať prví nemŕtvi. Angrima sa ponáhľal do mesta, varovať obranu. Bok po boku sme ustupovali pred armádou nemŕtvych. Chladnou, pomalou, temnou armádou nesúcou strach do našich sŕdc. Veľa ich padlo, kým sme sa dostali až ku mestu, tam už na nás čakal Angrim s Terrodaunom. Začalo pršať. Ukryli sme sa v meste a všetkými silami ho bránili pred tisíckami nemŕtvych. Bol to dlhý boj. Prišiel aj sám kráľ lichov a zosielal strašné kúzla ako zvracanie a odhodenie. Preliezali hradby, bojovalo sa v meste, liečilo sa v chrámoch. Sám som sa tam dva krát ocitol. Ale nemŕtvych nestačilo len zabiť, museli sme ich pokropiť svätenou vodou, aby sme zrušili mocné kúzlo oživenia. Keď na nás práve neútočili, pripravovali sme plány na kráľa lichov, ja som ho mal zadržať čarom mojej duše a Terrodaun ho mal zabiť. Bolo nutné ho pokropiť svätenou vodou, aby sa jeho duša odobrala na večnosť. Všetko vychádzalo, podržal som ho, Terrodaun s ním zviedol krutý boj, ale kňaza nikde. Lich nám utiekol a útoky na mesto prestali, zľakol sa. Do rána sme sa striedali v držaní stráže a keď konečne vysvitlo slnko, bolo po všetkom.<br /><br />Nádej nás udržala pri živote a história Akonu môže pokračovať...</p>";

var cd="<h3 onclick=\"document.getElementById('cd').innerHTML=cda\">Cesta do Akonu</h3><h4>Cesta do Akonu (Matonni)</h4><p>Toho upršaného, studeného večera, Lister, ako každý večer, čítal svoju obľúbenú knižku sediac vo svojom kresle a bafkajúc z fajky. Keď zrazu ktosi zaklopal na vchodové dvere. Lister sa s námahou zdvihol z kresla a otvoril. Celý v úžase civel na umoknutého a ustatého Mateho, svojho mladšieho brata. „Môžem ísť dnu?” spýtal sa Mate. „No jasné, poď,“ s radosťou v hlase ho pozval dnu. Celého si ho premeral, až sa mu pohľad zastavil na Mateho ľavej nohe: „Veď ty si zranený!“ „Ale to nič,“ odvetil Mate a strčil mu do ruky malú knižočku a ľahol si na pohovku: „Prečítaj si to, najlepšie hneď, písal to náš bratranec Martin.“ Lister bez rečí otvoril knižočku s titulom `Cesta do Akonu´ tam, kde mal Mate záložku, a začal čítať:<br />„Deň 61:<br />Sú tomu už vyše dva mesiace, čo som vyrazil zo svojho nového panstva, čo sme s Listerom a Prášilom zabrali v Morieli, až som konečne ledva deň cesty do pevnosti Akon. Pri náročnej ceste, kde na nás na každom rohu číhalo zlo, som prišiel o život Prášila, ktorého spolu so mnou zajali nemŕtvi. Rozštvrtili ho a zjedli na večeru, ešteže Šťastena stála pri mne, putá sa roztrhli a mohol som ujsť. Zo zúfalosti a aj vďaka túžbe získať postavenie v Akone som vstúpil do služieb nejakého černokňažníka, aby som mu pomohol s rozvratom Akonu zvnútra. Samozrejme sám by som tam ani nedošiel, tak mi dal do sprievodu Dagonetha Jos´fa, krvilačného šamana vyžívajúceho s v pitvaní mŕtvol a pití ich krvi, Leda, lovca skalpov a bojovníka Pavoleona, ktorí sa pridal najmä kvôli odmene.<br /><br />Deň 62:<br />Už sme dorazili do pevnosti Akon a zabezpečili si ubytovanie v hostinci v sedliackej štvrti. Ledva sme sa stihli vypakovať a zvedavosť nás vyhnala na nádvorie. Práve sa vrátil správca pevnosti, Maximus, a ešte ani nestihli zavrieť brány a už sa pýtal dnu aj barón Arkor, ktorý sa vrátil z výpravy v Morieli. Hovoril o Železnej ruži, mocnom artefakte, ktorý dali posvätiť samotnému bohu mŕtvych Zuulovi, aby pomohla chrániť pevnosť. Tvrdil, že sa ho zmocnili nemŕtvi a treba ho čo najskôr získať späť. Keď skončil, pobral sa do svojho domu.<br />Naša družinka sa teda vybrala von z pevnosti napĺňať plány černokňažníka. Na ceste, ktorá viedla riedkym porastom, sme stretli nejakú ženu. Vyzerala až príliš mŕtvo na to, že kráčala, a sálal z nej strach. Ešteže nás len tak nejaká ženská, aj keď nemŕtva nevyľaká, a preto som sa k nej prihovoril. Zistil som, že ani sama nevie, kde sa tu vzala a živí sa dušami mŕtvych ľudí. Požiadala nás, aby sme ju informovali o všetkých mŕtvych. Nelenili sme a zobrali si jedného hraničiara zo skupinky chodiacej s nami, akože prieskumníka, a v lese ho zarezali ako jahňa. K mŕtvole sme priviedli pani Mŕtvu, ako sme ju pomenovali. Pani Mŕtva sa však nenasýtila a požiadala o ďalšie duše s tým, že potom nám bude schopná odpovedať na otázky ohľadne Ruže. Už sa stmieva, a tak sa kvôli bezpečnosti vraciame do pevnosti.<br />V noci k nám do pevnosti zavítal akýsi démon, sebe vraviac Krúger, a chcel, aby sme mu dali nejaké ešte nepoškvrnené dievča. Za tú opovážlivosť ho však rád paladinov na čele s takmer polobohom Terrodaunom vybil kladivami a vyhnal preč. Okrem toho sa tu vrútil nejaký vlkolak a pár hôrd nemŕtvych, čo sa dá ubrániť.<br /><br />Deň 63:<br />Ráno slnko opieralo o stráne okolo pevnosti a cítili sme, že dnes bude ideálne počasie na plnenie plánov, aj keď k nim pribudla ešte jedna úloha. Dozvedeli sme sa, že paladinovia hľadajú mocný artefakt Kladivo Ničiteľov oltárov, aby ním mohli ničiť oltáre zasvätené Dragovi, bohovi nemŕtvych, a postaviť na ich mieste oltáre zasvätené Krulovi, bohu osudu a času.<br />Vyrazili sme na poludnie a v lese nikde nekončiacom sme na úzkej lesnej cestičke stretli jedného muža, ktorému na hlave nerástol ani vlas, a ženu, asi jeho spoločníčku, pravdepodobne čarodejku. Mali sme pocit, že vedia, kde by sa mohla nachádzať baňa na striebro, ktorú sme hľadali. Naše tušenie bolo správne a ochotne nás tam zaviedli. Po urputnej a ťažkej ceste hore strmým svahom sme zrazu stáli pred vchodom do bane. Do bane doteraz zavítalo akurát tak svetlo z lampášov a fakieľ a smrad sa zdal neznesiteľný. Napriek tomu začali dvaja neznámi, Pavoleon a Dagoneth Jos´f ťažiť, kým ja s Ledom sme čakali. Čakali sme hodnú chvíľu, zvuk krompáčov narážajúcich o skalu nám dunel v hlave, smrad čiastočne vytiahol von prievan a my sme dospeli k záveru. Pani Mŕtva umiera od hladu a naše mešce už dávno zívajú prázdnotou. Na dohodnutý signál sme tasili dýky a tých dvoch neznámych sme zakľali. Keď sme siahli do ich mešcov, nechcelo sa nám veriť, aký majetok nosia pri sebe. Zlato a striebro šlo ale bokom, keď sme objavili Modrú perlu. Počul som o nej pár legiend, ale neveril som, že môže existovať. Mŕtvych sme sa poctivo zbavili, presnejšie ja som ich zakopal po tom, ako z nich Dagoneth vybral srdcia a obličky, aby ich mohol predať.<br />Zo strachu, aby sme sa navzájom nezradili, lebo sme pochybovali o Pavoleonovi, sme uzavreli prísahu pokrvného bratstva pred starodávnymi duchmi, ktorých vyvolal Dagoneth, že čo i len nepomyslíme na zradu niekoho zo skupiny. Z bane k obchodníkovi je to len na skok, tak sme sa ta po dokončení rituálu vybrali. Avšak cestou nás zastavil akýsi iný obchodník, neskôr vysvitlo, že alchymista. Keď sme spomenuli Modrú perlu, až mu oči zasvietili a sľúbil, že nám, samozrejme nie zadarmo, vyrobí mocnú Hromovú paličku, do ktorej vloží Modrú perlu. Celý deň sme strávili zháňaním materiálu a nosením ho alchymistovi, až nám napokon večer mohol odovzdať hotovú paličku.<br />Vrátili sme sa do pevnosti , kde sme sa dozvedeli zaujímavú novinu. Kladivo Ničiteľov oltárov sa našlo, teda nám ho stačí len ukradnúť paladinom a netreba ho už hľadať. O to smutnejšia správa je, že pani Mŕtva bola zakliata princezná, ktorú po zložitom rituáli vrátili dnes späť medzi živých, a teraz velí pevnosti.<br />Dnešná noc je opäť rušná. Tentoraz nám do šľachtickej štvrti vbehol vlkolak, a čo sa zdalo oveľa nebezpečnejšie, bol útok nemŕtvej armády na čele so samotným Kráľom lichov. Paladinovia si s ním s pomocou domobrany po náročnom boji poradili, čo nás zarmútilo, lebo všetci rytieri prežili. Následne na to sme šli spať.<br /><br />Deň 64:<br />Víta nás krásne slnečné ráno, zato nepekná a ťažká úloha: ukradnúť Kladivo paladinom. Po výdatných raňajkách chystáme veci, ktoré budeme potrebovať na ďalšiu cestu, zakiaľ ja som si bol dať u kováča vyrobiť hák, ktorého pomocou a s použitím lana by sme mohli v najhoršom prípade opustiť pevnosť prelezením cez hradby.<br />Keď bolo všetko pripravené, vyšli sme von z pevnosti. Na pláni pred bránou stál chumeľ ľudí. Kričali, niektorí od strachu, v iných vzplanula agresivita, ale čo mali spoločné, bolo, že všetci tasili zbrane a mierili na jedného rytiera. Od niekoho z davu som sa dozvedel, že ten rytier sa zmocnil Meča zloby (alebo skôr naopak), starodávneho meča, ukutého z čistého Zla. Keď sa ho raz človek chopí, už ho nepustí z rúk a aj z najväčšieho svätca spraví doslova démona. „Ten by sa zišiel dať tak do rúk paladinovi Terrodaunovi, taká osoba na našej strane, hm...“ pomyslel som si. V tom som si spomenul, že sme si v izbe zabudli peniaze, tak sme sa vrátili do pevnosti. Ledo začul dvoch vojakov, ako hovoria, že Meč rytierovi zobrali a uzavreli ho do truhlice, ktorú umiestnili do šľachtickej štvri pred správcov dom.<br />Ledva sme došli po veci, takmer celé mesto sa vybralo kdesi do Makenu, aby získali predmety na zničenie Meča. V pevnosti zostala len malá, nám lojálna posádka, a tak sme aj s Ledom truhlicu s Mečom zobrali a ukryli hlboko v lese, kým nevymyslíme, ako ho podstrčiť Terrodaunovi. Keď sme sa vrátili do pevnosti, všimli sme si oznam, že v šľachtickej štvrti sa nasledujúci večer uskutoční oslava. Začali sme uvažovať o tom, ako by mohol prebehnúť puč, lebo taká možnosť určite dlho nenastane. Avšak medzitým prišiel k Ledovi posol z jeho rodného domu so správou, že jeho mať už melie z posledného a chce ho vidieť. Teda sa zbalil a ešte skoro ráno odchádza.<br />Dnešná noc nestojí ani za reč, taký „pokoj“ tu vládne.<br /><br />Deň 65:<br />Ráno opäť nádherné, akoby tu nikdy mraky ani nebývali, lúky zaplavené slnkom, počasie na odpočinok priam stvorené. Doobeda sme navštívili obchodníka s magickými predmetmi, a potom aj krčmu. Po vkročení dnu som však ostal ako prikovaný k zemi. Na zemi leží zviazaný trojmetrový, smradľavý, zelený, škaredý drak, podľa krčmára ešte len mláďa. Po poháre pivka sme krčme dali rýchlo zbohom a vrátili sa do pevnosti. Tá zívala prázdnotou, lebo vyššia kasta sa vybrala na pravidelný zraz v krčme.<br />Neviem prečo, ale veľmi ma lákalo nazrieť do domu paladinov, keď tu teraz nikoho niet. Dvere boli zamknuté, ale aspoň cez okno som zahliadol v tom neporiadku Kladivo. Po dohode s družinou som sa vlámal do domu a Kladivo vzal. Opatrne som vykĺzol von z pevnosti, keďže vrchnosť vyhlásila zákaz vychádzania z pevnosti kvôli tomu drakovi, a hlboko v lese ho ukryl, aby sme s ním v noci zničili Krulove oltáre a postavili tam opať Dragove. Od chrbta ma mal kryť Dagoneth, ale mám pocit, že to príliš neustrážil. Čochviľu stál pri nás jeden hraničiar a vyzvedal, prečo sme opustili pevnosť. „Zabiť – nezabiť?“ prebiehalo mi hlavou, na jeho šťastie sa uspokojil s krátkou odpoveďou a odišiel. Odtiaľ sme šli do krčmy, niečo popili a vrátili sa do pevnosti.<br />Hneď ako sme vošli na nádvorie, stál pri nás Pavoleon so žoldákom, akýmsi Lotrom, či tak nejak, že v dubovom háji máme spojencov v puči, druidku a mocný prízrak. Šli sme teda za nimi a zoznámili sa. Okrem toho, u alchymistu sme si dali objednávku na tri nesmierne silné jedy, na ktoré sme mali priniesť ešte dračiu či orkskú žlč.<br />Keď nám dodá alchymista jed, puč sa stane zrealizovateľným. Otrávime troch mocných mesta, asi Terroduana, či Ergeho, správcu či princeznú, a Arkora, mocného klerika, aby ich náhodou nevyliečil z otravy. Prízrak spracuje pár ďalších ľudí a naša skupinka bojovníkov dielo dokončí a prevezme mesto.“<br />„Tu je koniec. Prečo to končí?“ spýtal sa Lister zvedavo. „Lebo už nemal tú možnosť to dopísať, lebo práve v deň, keď som dosiahol mesta Akon, ho popravili. Túto knižočku som mu vybral z vrecka, predtým ako ho pochovali.“ zronene odpovedal Mate a dodal: „Len to Kladivo zle ukryl, lebo večer už s ním jeden z paladinov bojoval. A čo som počul, ten prekliaty alchymista predal život jeho i jeho druhov za pätnásť zlatých!“ v tom sa začal Mate dusiť, zvíjať sa v bolestiach a z ľavej nohy mu vytryskol prameň krvi. „Čo to máš s tou nohou?“ spýtal sa Lister so strachom o Mateho zdravie a hneď mu ju aj obviazal.<br />„No, pri výprave s paladinmi som sa preriekol ohľadom mojej viery v Draga a dali ma priviazať na pranier pred zvonicou. Po urputných siedmich hodinách presviedčania okoloidúcich, aj za pomoci mágie, sa mi podarilo uvoľniť putá. A čo sa týka tej nohy, to si ma jeden chlapík spolu s jednou Amazonkou poistili, aby som sa nevyslobodil, pretože som neustále všetkým vyberal nohami zbrane z puzdier. Keď už takmer celá pevnosť spala, ten istý chlapík mi nenápadne prerezal putá a odišiel. Vypukla vo mne taká eufória, že môžem ujsť a ráno ma nepopravia, že som aj s rozťatou nohou bežal. Vybehol som z pevnosti a utekal, aj keď čím ďalej to vyzeralo, že sa plazím, až som úplne padol na zem v bolestiach a dúfal...“ A nastalo ticho. Lister si všimol, že Mate zaspal, tak ho prikryl a nechal odpočívať, pričom sám smutný a unavený šiel spať.</p>";
