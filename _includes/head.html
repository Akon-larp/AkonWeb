var zlo="<h3 onclick=\"document.getElementById('zlo').innerHTML=zloa\">Zlodej:</h3><p>Vysvetľovať pojem „zlodej“ ako taký je určite zbytočné. Každému z nás sa už určite stalo, že nejaký „dobrák“ si úplne „omylom“ pomýlil máš plný mešec s tým jeho prázdnym a chcel si ho privlastniť! Ale nieje zlodej ako zlodej! V tomto prípade si odmyslíme tých, ktorý nám vykopávajú zemiaky na poliach a zameriame sa na zlodejov oveľa profesionálnejších! Cechy zlodejské bývajú tajne založené v každom väčšom meste a vstúpiť do takéhoto cechu sa podarí len tým najšikovnejším, najobratnejším, najprefíkanejším a najrýchlejším zo všetkých zlodejov. Spoločnosťou sú veľmi opovrhovaný a nenávidený a ich skutky si kruto trestané!<br /><br />Životy: 5, za úroveň +3 <br />Zbrane: používa krátke, luky, vrhacie, iné nepoužíva!<br />Špecializácia: na krátke a vrhacie zbrane<br />Zbroje: používa ľahké<br />Štíty: nepoužíva<br />Presvedčenie: 3-6<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – krátke a vrhacie zbrane +1 (od útoku).<br /><br />1. úroveň<br />Zistenie peňazí<br />Zo svojej dlhoročnej praxe má zlodej pri pohľade na mešec dobrý odhad koľko sa tam skrýva peňazí. Takže pokiaľ stretne postavu, ktorej mešec je viditeľný, môže povedať „zisťujem obsah Tvojho mešca“ a postava mu musí povedať, koľko sa v ňom skrýva peňazí! Túto schopnosť môže zlodej využiť 10 x za deň.<br /><br />Kradnutie<br />Vysvetľovať, že každý zlodej je preborníkom v kradnutí je úplne zbytočné. V prípade, že chce zlodej postave ukradnúť niektorú z jej vecí, napríklad, mešec, artefakt, magickú zbraň, amulet a podobne (nemôže kradnúť neherné veci, časti kostýmu alebo zbroje, štít, normálne zbrane), musí na túto vec nenápadne pripevniť štipec (kolíček na prádlo) tak, aby si to obeť nevšimla, a následne si to nesmie všimnúť ani do 30 sekúnd po pripnutí štipca. Po tomto uplynutom čase oznámi zlodej postave „okrádam Ťa, daj mi čo je moje“ a ukáže na pripnutý štipec. Postava mu musí okamžite bez reptania danú vec vydať!! Túto schopnosť môže zlodej využívať 1 x za 2 hodiny.<br /><br />2. úroveň<br />Skrytie v tieni<br />Ďalšou silnou schopnosťou zlodejov je skrytie v tieni. V prípade, že sa potrebuje pred niekým skryť, jednoducho sa postaví alebo skrčí za nejaký objekt (strom, herný stan, a pod) a nepohnute tam čaká. Nesmie byť však väčší ako objekt za ktorý sa chováva, nesmie sa schovávať za postavu a v prípade že svieti slnko, nesmú na neho dopadať slnečné lúče (to znamená že musí byť celý v tieni objektu za ktorý sa skrýva) a musí byť minimálne na 10 metrov (tým sa myslí moment skovávania, ak by bol už skrytý a postava by išla oko napríklad na 3 metre už ho nevidí) od najbližšej postavy (v prípade že by nebol, táto postava ho vidí) a povie „skrývam sa v tieni, nevidíš ma“. V tej chvíli je pre všetkých neviditeľný (pokiaľ nik nemá na to nejakú schopnosť, amulet alebo podobné veci na to určené)! Schopnosť môže využiť 1 x za 4 hodiny. <br /><br />Putá<br />Pokiaľ niekto zviaže zlodeja, ten sa dokáže z tohto zviazania dostať (schopnosť nepôsobí na schopnosť zviazanie). Musí však prejsť aspoň 5 minút od jeho zviazania a potom si sám môže špagát strhnúť a utekať čo mu nohy stačia a pritom zakričať „opäť som voľný, mňa nespútate“. Môže túto schopnosť využiť 1 x za 4hodiny.<br /><br />3. úroveň<br />Vytvor jed (stredne silný)<br />Počas hry sa dozviete ingrediencie na vytvorenie jedu, ktoré si môžete sami zhotoviť. Za jeden deň dokážete vyrobiť jed na 3 použitia. Je to jed strednej kategórie. Má však krátku trvácnosť a na ďalší deň sa vám skazí a nebude účinkovať. Takže na každý deň treba vytvoriť nový jed.. Použiť sa dá pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane čí hrot šípu (žiadne kladivá a palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). V jedle či vode účinkuje za 5 minút ak je na zbrani, tak okamžite. Obeť si po dobu 10 minút za každé uplynuté 2 minúty odpočíta 1 život (ak bola použitá zbraň tak si na začiatku odpočíta aj jej zranenie). Obeti však treba oznámiť že ste na ňu použili stredný jed a jeho účinky.<br /><br />Prebodnutie zozadu<br />Túto schopnosť je možné použiť len v prípade že o vás obeť nevie, alebo vám slepo dôveruje a nemožno ju použiť počas boja. Zlodej sa potíšku prikradne zozadu ku svojej obeti a niektorou z krátkych zbraní ju veľmi jemne (ale aby to cítila) štuchne do chrbta a povie „prebodávam Ťa“. V tej chvíli obeť stráca polovicu zo svojich počiatočných životov ( to znamená, že ak má za plného zdravia 10 životov, 3 už stratila v predošlých bojoch a teraz je prebodnutá zostávajú jej len 2 životy, 10/2-3=2) a v tomto prípade sa nerátajú životy zbroje!! Schopnosť možno využiť 1 x za 8 hodín.<br /><br />4. úroveň<br />Útek<br />Ak je so zlodejom už naozaj zle tak zvolí útek, pri ktorom zakričí „nôžky moje bežte preč“ utečie všetkým prenasledovateľom, respektíve, tí už ho nemôžu ďalej prenasledovať, proste im ušiel. Túto schopnosť môže zlodej využiť maximálne 1x za <br />6 hodín a nemôže byť pri tom zviazaný, zajatý alebo bezprostredne obkľúčený!!!<br /><br />Omráčenie<br />Na hranici vyradenia môže omračovať každý, avšak len pár povolaní v rátane zlodeja dokáže omráčiť postavu s plnými životmi ale tá nesmie mať chránenú hlavu prilbou alebo drátenou kuklou a o jeho zámere nesmie vedieť. Tiež nemôže omračovať počas boja. Pri omráčení musí položiť ruku na hlavu obete a povedať „omračujem Ťa, napriek tvojim životom“ a obeť musí hneď predstierať omráčenie po dobu 5 minút. Omráčenie môže využiť 1x za 6 hodín.<br /><br />5. úroveň<br />Špecializácia na zbraň – krátke a vrhacie zbrane +2 (od útoku).<br /><br />Akrobacia<br />Zlodej je majster v akrobacii, nielen že mu to pomáha pri boji, ale aj pri šplhaní a podobne. Počas boja sa potom môže uhnúť jednému útoku (aj strele a taktiež útočným kúzlam pri ktorých sa používajú firebally, ale útočníka musí vidieť) ak zvolá „akrobacia, uhýbam sa tvojmu útoku“ a napriek tomu že bol zlodej zasiahnutý, neráta si zranenie. Tiež pri páde z výšky si spôsobí oveľa menšie zranenia ako ostatný. Akrobacia sa dá použiť aj stúpení na pascu (napr. by na neho padla klec alebo vyletel šíp tak jednoducho uskočí) či pred padajúcimi skalami. Navyše akrobaciu môže využiť napr. aj v prípade že ho niekto naháňa a on chce pred útočníkom vyšplhať na strom. Stačí ak príde ku stromu, obímeho a zvolá: „akrobacia, šplhám na strom“. Schopnosť môže použiť 1x za 4 hodiny. (Akrobacia môže mať viac využití len ich treba konzultovať s orgom!!).<br /><br />6.úroveň<br />Nezistiteľnosť<br />Vďaka tejto schopnosti dokáže skúsený zlodej zostať v utajení. V prípade že na neho niekto použije zistenie peňazí, presvedčenia, povolania, životov alebo zistenie klamstva, či mučenie, kľudne môže zaklamať, neodpovedať, alebo sa jednoducho odvolať na túto schopnosť, a protivník vám musí uveriť. Ak by sa stalo, že hráč si myslí že podvádzate v žiadnom prípade mu neukazujte svoju sprievodnú listinu ale pošlite ho za organizátorom. Schopnosť je neobmedzená a neplatí pri použití čítania v mysli, lektvarov pravdy, hypnóze a pod.!!</p>";

var mag="<h3 onclick=\"document.getElementById('mag').innerHTML=maga\">Mág:</h3><p>Mágovia sú veľmi silný kúzelníci, hlavne čo sa týka útočnej mágie. Vzhľadom k tomu, že ich školy sú po celom svete, sú aj značne rozšírený a známi. Každý mág má dve cesty ktorými sa môže vydať. Buď cestou bielej mágie, alebo cestou čiernej mágie. Často ich nájdeme vo veľkých mestách, pevnostiach, kráľovskom dvore a podobne. Čierny mágovia sa často vydávajú za kladných, a v správnej chvíli zaútočia celou svojou temno silou. V prípade, že sú odhalený, sú buď upálený, vyhostený do divočiny alebo väznený v hlbokých žalároch. <br /><br />Životy: 4, za úroveň +2<br />Zbrane: dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 1-7<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>13 many</td><td>20 many</td><td>28 many</td><td>39 many</td><td>52 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>67 many</td><td>84 many</td><td>103 many</td><td>124 many</td><td>146 many</td></tr></table><br /><br />Schopnosti:<br /><br />0.úroveň<br />Magický štít <br />Mág sa jednou rukou chytí druhej a povie: „Magický štít chráň ma.“ Potom je po dobu 5 minút vždy zranení o 1 menej (jak zbraňami tak útočnými kúzlami). Schopnosť môže použiť 1 x za 4 hodiny<br />Nemožno však kombinovať s kúzlom neposilnenie.<br /><br />1.úroveň<br />Ochromenie nôh <br />Mág sa dotkne nejakej postavy a povie: „Ochromujem Tvoje nohy.“ Potom táto postava zostane nepohnute stáť po dobu 5 minút. Môže sa však brániť, rozprávať alebo čarovať. Ochromenie nôh môže použiť 1 x za 4 hodiny.<br /><br />4.úroveň<br />Využi útok<br />Vďaka tejto schopnosti dokáže mág premeniť na neho použitý útok zbraňou na doplnenie životov (samozrejme zranenie útokom na neho nepôsobí). Stačí ak hneď po tom čo na neho niekto zaútočí a dá mu platný zásah zakričí „tvoj útok ma vylieči“. Následne je mág vyliečený o toľko životov koľko je polovica jeho pôvodných životov (napr. plný stav mágových životov je 12, ale je dosť zranený tak má momentálne len 4 a použije túto schopnosť tak si priráta k tým 4 ešte 6 čo je jedna polovica z  12 a bude mať 10 životov) a pokiaľ by mal v momente použitia tejto schopnosti mág plný počet životov priráta si na 1 hodinu (alebo dokedy mu ich niekto neuberie) 3 fiktívne životy (pri zranení sa odratávajú ako prvé) nad rámec svojich skutočných životov. Schopnosť môže použiť 1x za 4 hodiny.<br /><br />5.úroveň<br />Rýchle meditácia<br />Mág dobíja svoju manu rýchlejšie než zvyčajne. To jest, dva krát tak rýchlo než doteraz (čiže 10 minút). Schopnosť je automatická.<br /><br />Vznietenie <br /> Mág vystrie pravú ruku a zvolá ,,vzplaň\". Predmet smerom na ktorý postava ukáže začne horieť. Predmet nemôže byť od kúzelníka ďalej ako 2 metre. Pomocou tejto schopnosti dokáže zapáliť akýkoľvek predmet napr. aj železnú zbraň, či kamennú misku. Následne tento predmet bude horieť buď dokedy nezhorí alebo ho niekto neuhasí alebo pri nehorľavých materiáloch prestane horieť sám od seba po 10 minútach. Navyše takýto predmet môže mág kľudne zobrať do rúk bez toho aby sa mu niečo stalo, ak by ho však chcel vziať do ruky niekto iný ta sa popáli a horľavé veci sa od neho chytia. Schopnosť môže použiť 1x za 2 hodiny.<br /><br />6.úroveň<br />Spoznaj a oprav magický predmet<br />Pokiaľ sa mág dotkne nejakej veci, zbrane, zbroje, amuletu a pod., tak dokáže určiť či je táto vec magická (táto schopnosť je automatická). Stačí ak sa daného predmetu dotkne a povie, „zisťujem či sa v tejto veci nenachádza akákoľvek mágia“, a od tej chvíle vie či je vec magická alebo nie.<br />Navyše mág dokáže takýto predmet veľmi ľahko opraviť pokiaľ je poškodený  (samozrejme ak nieje úplne zničený a nie všetky magické predmety sa dajú opraviť – treba to konzultovať s organizátorom). Mág na takúto opravu potrebuje aj príslušnú magickú prísadu (napr. hviezdny prach, magický kryštál a pod.) a náradie (primerane opravovanej veci). Potom 10 minúť musí dobre zahrať opravu tohto predmetu pričom 10x zvolá „mágia, pomôž mi obnoviť tvoj výtvor“. Následne sa predmet spoji do kopy alebo sa opraví jeho závada. Túto schopnosť môže použiť 1x za 8 hodín.<br /><br />Kúzla:<br /><br />0.úroveň<br />Ohnivá strela (kúzlo- 2 many)<br />Mág hodí nosič a povie: „Strela ohňa“ potom ak trafí<br />nepriateľa, je zranení za 3 životy.<br /><br />Ochrana pred šípmi (kúzlo – 4/6 many)<br />V prípade že sa mág ocitne pod spŕšku nepriateľských šípov, môže na seba alebo niekoho iného zoslať toto kúzlo. Stačí ak rukami vo vzduchu vytvorí kruh a povie „ochrana pred šípmi“ a od tej chvíle ho po dobu 5 minút zraňujú šípy o 1 slabším zranením. Ak ochranu zosiela na seba, kúzlo stojí 4 many ak niekoho iného, kúzlo stojí 6 many.<br /><br />1.úroveň<br />Magický výboj (kúzlo- 4 many)<br />Mág hodí svoj nosič a zvolá: „Mágia zraňuje!“ Ak sa do niekoho trafil, je automaticky zranení za 4 životy.<br /><br />Ohnivé ruky (kúzlo- 6 many)<br />Mág musí prísť k postave a dotknúť sa oboma rukami jej tela a povedať „Oheň mojich rúk Ťa spáli“ a postava je zranená za 6 životov.<br /><br />2.úroveň<br />Posilnenie (kúzlo- 7 many)<br />Mág sa dotkne zbrane a zvolá: „Moja zbraň, buď rýchla a silná!“ Ak takto učinil, zbraň zraňuje o + 1 navyše. Toto kúzlo môže zoslať aj na zbraň niekoho iného. Doba trvania je 5 minút.<br /><br />Neposilnenie (kúzlo- 8 many)<br />Mág sa dotkne zbrane rukou alebo palicou a povie: „Tvoja zbraň, buď pomalá slabá!“ Ak takto učinil, zbraň zraňuje o - 1. Toto kúzlo môže, alebo by mal radšej zoslať na zbraň niekoho iného. Doba trvania je 5 minút. Nemožno kombinovať so schopnosťou magický štít.<br />Rýchlosť (kúzlo- 12 many)<br />Pokiaľ mág potrebuje okamžite utiecť z boja povie „rýchlo preč“ otočí sa okolo seba a začne utekať, vtedy mu musia dať prenasledovatelia 60 metrov náskok aby sa za ním mohli pustiť.<br /><br />3.úroveň<br />Štít zloby (kúzlo- 15 many)<br />Ešte pred bojom mág na seba môže zoslať tento štít, stačí ak spraví s palicou alebo rukou okolo seba kruh a povie „Štít zloby chráň ma“ a v prípade, že mág dostane počas boja zásah (prvý platný), či už zbraňou alebo útočným kúzlom, ukáže rukou alebo palicou na protivníka od ktorého zásah dostal a povie „Štít zloby ma chráni, Teba však zraní“ a protivník je zranený plnou silou svojho útoku ktorý dal mágovi, avšak mágovi sa nič nestane. Ak zásah nedostane, štít sa sám za 30 minút zruší a naraz môže mať na sebe maximálne 2 takéto štíty.<br /><br />Neviditeľnosť (kúzlo-15 many)<br />Mág si prekríži ruky na hrudníku a povie: „Moje telo neviditeľné jest.“ Potom si musí jednu ruku dať za hlavu, alebo zbraň. Po dobu 5 minút je neviditeľní, jeho kroky, hlas je počuť, i stopy v blate je vidieť. No on sám nieje vidieť. Nedá sa naň ho priamo útočiť, iba približne. Kúzlo sa zruší po vypršaní, či ak ho sám zruší.<br /><br />Bábka (kúzlo- 18 many)<br />Mág príde a musí sa jednou rukou dotknúť nejakej postavy, pri tom musí povedať: „Si moja bábka, ja Ťa ovládam.“ Potom postava stráca svoje vlastné vedomie na dobu 15 minút. Mág túto postavu musí držať alebo sa jej dotýkať vždy, keď jej chce dať nový príkaz. Táto postava robí, odpovedá a správa sa ako chce mág, ten jej svoje rozkazy šepká do ucha, no postava nespraví príkazy v ktorých by išla vyslovene proti svojmu záujmu alebo by mala ísť na istú smrť.<br /><br />4.úroveň<br />Zlom kúzlo (kúzlo – 10 many)<br />Mág týmto kúzlom dokáže zlomiť všetky kúzla s bonusovým i postihovým efektom. Stačí ak ukáže na postavu na ktorú ide kúzliť a povie „zbavujem ťa všetkých kúziel ktoré ťa posilňujú“, alebo „zbavujem ťa všetkých kúziel ktoré ťa oslabujú“.<br /><br />Ohnivý kruh (kúzlo – 14 many)<br />Mág okolo seba spraví palicou na zemi kruh a povie „ohnivý kruh ma ochráni“. A od tejto chvíle sa v okruhu 3 m vytvorí okolo mága ohnivý kruh (na dobu 20 minút), ktorý ho chráni pred všetkými ohnivými útokmi či zraneniami (ale len pokiaľ z tohto kruhu neodíde). Navyše každý kto by chcel do toho kruhu vstúpiť je zranený ohnivým zranením za 6 životov. <br /><br />5.úroveň<br />Kolomaž (kúzlo - 4 many za každú postavu)<br />Ak mág natiahne ruky a povie „z mojich prstov, strieka kolomaž!“ vystrekne na postavy klzký sliz priamo z mágových prstov, maximálne však do diaľky 5 m. Zasiahnuté postavy potom musia predstierať že sa im šmýka zem pod nohami, stále padajú a pri pokusoch sa zdvihnúť znova padajú. Pohybovať sa môžu, ale veľmi pomaly a po každom ujdenom metri znova spadnú. Kolomaž zaschne do 5 minút. Navyše, postavám z rúk vykĺzavajú aj zbrane a rôzne predmety, lebo sú oslizené. Mág môže naraz zoslať kolomaž na toľko ľudí na ktorej je úrovni ( na 5.úrovni to môže použiť na 5 ľudí a bude ho to stáť 20 many).<br /><br />6.úroveň<br />Ilúzia (kúzlo – 16 many)<br />Vďaka tomuto kúzlo dokáže mág zobrať odniekiaľ určitú vec a nahradiť ju ilúziou, aby si všetci mysleli že táto vec nezmyla. Ilúzia potom zmizne sama po 30 minútach alebo po tom ako sa jej ktokoľvek dotkne. Pre vyčarovanie ilúzie sa musí mág jednou rukou držať veci (postavy)  ktorú chce napodobniť a druhov rukou sa dotýkať miesta kde má ilúzia vzniknúť. Potom povie „ilúzia (vec ktorú chce spraviť, napr. „mešca“) vytvor sa“ a ilúzia sa vytvorí (na mieste kde predtým bola umiestnená daná vec treba nechať papierik s pokynmi že vidia ilúziu a za akých podmienok sa rozplynie).<br />Mág tiež dokáže vytvoriť ilúziu nejakej postavy alebo seba. Všetky podrobnosti platia ako pri vytváraní ilúzie veci, akurát formulka ktorú povie je: „ilúzia (meno postavy) vytvor sa“ alebo „ilúzia mňa samého vytvor sa“ (tiež tu treba nechať papierik, že na tom mieste vidia ilúziu danej postavy alebo mága a podmienky za akých sa rozplynie).</p>";

var car="<h3 onclick=\"document.getElementById('car').innerHTML=cara\">Čarodejník:</h3><p>Možno viac obávanými kúzelníkmi než mágovia sú čarodejníci. Sú veľmi nevyspytateľný a náladový. Takže pripliesť sa do cesty rozmrzelému čarodejníkovi ktorý sa vôbec nevyspal lebo ho celú noc boleli zuby by mohlo znamenať istú smrť alebo prinajmenšom zvyšok života stráviť v tele žaby  . Často sa uťahujú na svoje sídla – zväčša to bývajú vysoké veže, ktoré sú ďalej od civilizácie v tmavých lesoch, a v mestách sa ukazujú len kúzelníckych veľtrhoch alebo iných veľkých príležitostiach. <br /><br />Životy: 4, za úroveň +2<br />Zbrane: dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 1-7<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>15 many</td><td>23 many</td><td>34 many</td><td>46 many</td><td>60 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>76 many</td><td>95 many</td><td>115 many</td><td>137 many</td><td>161 many</td></tr></table><br /><br />Schopnosti:<br /><br />0.úroveň<br />Čaro duše <br />Čarodej len povie: „Čaro mojej duše, preč! Ustúp o 5 metrov a kľakni si“ Pri tom musí ukázať na postavu, ktorá nie je od neho ďalej než 3 metre. Táto postava potom musí ustúpiť o 5 metrov od čarodeja a kľaknúť si a bez pohnutia uprene sledovať čarodeja ako keby bol jeho idol  po dobu 5 minút alebo kým ho niekto zásadne nevyruší napr.útokom. Schopnosť môže použiť 1 x za 4 hodiny.<br /><br />1.úroveň<br />Vysaj magenergiu <br />Čarodej sa dotkne nejakej postavy a povie: „Upadni mana, do mojich rúk.“ Ak takto učinil, postava stráca 6 many a čarodejovi sa doplní táto hodnota many (nie však nad jeho maximálnu hodnotu many). Postava musí manu znova získať meditáciou (alebo iným spôsobom). Vysatie energie môže použiť 1 x za 4 hodiny.<br /><br />4.úroveň<br />Nočný strážca<br />Čarodejník si vždy pred spánkom (ale len v noci) môžu privolať nočného strážcu, čo je akýsi malý škriatok ktorý počas čarodejníkovho spánku vykonáva stráž aby sa mu nič nestalo, resp. keby ho chcel počas spánku niekto okradnúť či zabiť, nočný strážca ho včas zobudí. Navyše nočný strážca sa nedá zabiť a ani sa na neho kúzliť alebo mu čokoľvek spraviť. Na túto schopnosť si treba doniesť nejakú plyšovú postavičku aspoň 20 cm vysokú a vždy v noci pred spaním ju umiestniť tak, aby ju prípadná nechcená návšteva uvidela napr. keď vojde do stanu. Akonáhle túto postavičku uvidí, musí odísť, alebo zobudí čarodejníka a musí počkať, kým sa pripraví na boj (mimo stanu), alebo ak by mu chcel niečo ukradnúť musí ho najprv zobudiť!!! V prípade, že čarodejník takúto postavičku mať nebude, nemusí ho budiť a môže spraviť čo chce, ale ak tam postavička je a o niečo sa pokúsi je to neplatné!!!<br />Schopnosť ne neobmedzená, automatická, ale platí len v noci počas spánku s nastavenou postavičkou. <br /><br />Čo takto zmeniť tému <br /> Keď sa rozhovor uberá nie zrovna ideálnym smerom alebo sa čarodejníka niekto pýta nepríjemné otázky, vie zmeniť tému rozhovoru. Stačí aby roztiahol ruky a povedal: ,,Čo takto zmeniť tému?\" Od tej chvíle sa postava, (postavy) ktoré kúzlo zasiahlo po dobu 30 minút nesmú na predošlú tému rozhovoru myslieť, ani sa na nič ohľadom nej pýtať, či naznačovať. Nato aby schopnosť účinkovala treba ju použiť na celú skupinu s ktorou sa čarodejník rozpráva.Schopnosť môže použiť naraz na toľko postáv koľká je sám úroveň a môže ju použiť 1x za 3 hodiny.<br /><br />5.úroveň<br />Oko čarodeja <br />Čarodejníci sú, aj keď to mnohý ľudia nevedia, schopnými špiónmi. Dokážu totižto vyčarovať tretie oko, ktoré pláva v priestore a dokáž ho ovládať svojou mysľou. Musia sa sústrediť aspoň 5 minút, potom sa v ich zovretých rukách zjaví ich tretie oko. Avšak čarodej k tomuto kúzlu musí mať rekvizitu, loptičku ktorá vyzerá ako oko, alebo niečo podobné, a musí ho nasadiť na palicu (buď kúzelnícku alebo nejaký dlhý konár). Potom sa s okom môže ľubovoľne pohybovať a sledovať okolie po dobu 5 minút, no čarodejník sám tam nie je, je tma iba oko. To čo vidí oko (ale nepočuje), vidí aj čarodejník, no ostatné postavy vidia iba levitujúce malé oko. Použiť ho môže toľkokrát za deň koľká je sám úroveň.<br /><br />6.úroveň<br />Počarovanie zaľúbenosti<br />Čarodejník dokáže niekomu počarovať tak, aby sa do neho, alebo kohokoľvek iného osoba zaľúbila. Stačí ak danej osobe prejde rukou pred tvarov, luskne prstami a povie „od tejto chvíle ľúbiť ma budeš“ alebo „od tejto chvíle ľúbiť budeš (a povie meno postavy)“. Ak by postava nevedela o koho ide, treba jej to vysvetliť. Zaľúbenosť trvá  2 hodiny po tom automaticky vyprchá. Počas tejto doby počarovaná osoba musí určenej osobe prejavovať, náklonnosť, city, nosí jej darčeky, vo všetkom jej pomáha a neustále vyhľadáva jej spoločnosť. Toto počarovanie je možne zrušiť aj príslušným kúzlom alebo schopnosťou.<br /><br />Kúzla:<br /><br />0.úroveň<br />Čarovná strela (kúzlo- 2 many)<br />Čarodejník hodí nosič a povie: „Strela čarovná“ potom ak trafí nepriateľa, je zranení za 3 životy.<br /><br />Odtlačenie postavy (kúzlo- 4 many)<br />Pokiaľ potrebuje čarodejník dostať protivníka ďalej od svojho tela, výstražne ukáže na neho prstom a povie „vravím Ti ustúp o 5 metrov“ a protivník musí ustúpiť o 3 metre, potom sa však môže zase vrátiť.<br /><br />1.úroveň<br />Čarodejníkova strela (kúzlo- 4 many)<br />Čarodejník hodí svoj nosič a zvolá: „Čaro mojej streli!“ Ak sa do niekoho trafil, je automaticky zranení za 4 životy.<br /><br />Bariera (kúzlo- 6 many)<br />V prípade že čarodejník potrebuje zdržať protivníkov, vyčaruje im do cesty bariéru. Táto bariéra vydrží 15 zásahov akoukoľvek zbraňou či útočným kúzlom. Čarodejník len prejde palicou po zemi (akoby nakreslil tak 2 metrovú čiaru) kde má bariéra vyrásť a zakričí „bariéra ukáž sa“ a protivníci musia predstierať že pred nimi sa zjavila bariéra ktorú musia rozbiť. Cez túto bariéru sa nedá kúzliť, bojovať, strieľať a bariéra sa nedá ani obísť!! <br /><br />2.úroveň<br />Posilnenie (kúzlo- 8 many)<br />Čarodejník sa dotkne zbrane a zvolá: „Moja zbraň, buď rýchla a silná!“ Ak takto učinil, zbraň zraňuje o + 1 navyše. Toto kúzlo môže zoslať aj na zbraň niekoho iného. Doba trvania je 5 minút. Toto kúzlo je totožné s mágovým čiže platí že sa nesmú kumulovať na jednej zbrani!<br /><br />Fiktívna zbroj (kúzlo- 11 many)<br />Ešte pred bojom môže na seba čarodejník zoslať fiktívnu zbroj. Stačí ak sa rukami dotkne ramien a povie „Obliekam si zbroj zhotovenú z mágie“ Táto zbroj zmizne buď sama po 30 minútach alebo v prípade jej zničenia (iným kúzlom alebo zásahmi). Zbroj má 6 životov. Tieto životy sa odratávajú po zásahu zbraňou alebo útočným kúzlom. Nemožno na seba naraz zoslať viac takýchto zbrojí.  <br /><br />Vánok (kúzlo-13 many)<br />Čarodejník povie: „Moje telo, staň sa vetrom.“ Potom si musí jednu ruku dať za hlavu, alebo zbraň. Po dobu 5 minút je neviditeľní, no všade kam sa pohne je ho počuť ako vietor. Je v jeho prítomnosti cítiť aj chlad. No on sám nieje vidieť. Nedá sa naň ho priamo útočiť, iba približne. Kúzlo sa zruší po vypršaní, či ak ho sám zruší.<br /><br />3.úroveň<br />Teleport (kúzlo- 15 many)<br />Čarodejník si čupne potom vyskočí a zvolá: „Moje telo, bolo tu a teraz tam je.“ Ak takto učinil, môže sa kľudne odobrať ľubovolným smerom do vzdialenosti 15 metrov, nikto po dobu pohybu naň ho nesmie zaútočiť, lebo tam herne čarodej nieje. Ak by sa chcel čarodejník teleportovať ďalej než na 15 metrov musí si odpočítať za každý meter naviac 1 manu. Čiže ak by sa chcel premiestniť o 25 m bude ho to stáť 25 many ale v prípade že by sa chcel premiestniť napríklad len o 3 metre tak to bude stáť stále 15 many.<br /><br />Vymaž spomienky (kúzlo- 20 many)<br />Čarodejník príde k nejakej postave, dotkne sa jej hlavy a povie: „Zabudni, hlava deravá!“ Potom postava zabudne na všetko čo sa stalo v priebehu posledných 10 minút, alebo čarodejník môže vybrať len jednu určitú spomienku za posledných 10 minút ktorá sa má vymazať. Nebude si na nič pamätať, ani si už nespomenie.<br /><br />Oslepujúci záblesk (kúzlo- 17 many)<br />Čarodejník hodí nosič o zem a zakričí „Oslepujúci záblesk“ a všetky postavy (okrem čarodejníka) v okruhu 5 metrov sú na 30 sekúnd oslepené (držia si oči a kričia od bolesti) a strácajú 2 životy – nie však zo zbroje (to platí aj pre tých ktorý by sa do kruhu chceli dostať). Nosič však môže hodiť maximálne 3 metre od seba.<br /><br />4.úroveň<br />Mocné zovretie (kúzlo – 14 many)<br />Čarodejník na niekoho ukáže prstom, alebo palicou a povie „mocné zovretie“. Potom sa zasiahnutá postava nemôže hýbať po dobu 5 minút, navyše počas trvania kúzla s ňou môže čarodejník pohybovať, kam ukáže, tam sa postava musí presunúť.<br />5.úroveň<br />Hašterivosť (kúzlo - 6 many za každú postavu)<br /> Pomocou tohto kúzla dokáže zmanipulovať toľko postáv koľká je sám úroveň. Postavy sa okamžite začnú medzi sebou agresívne hádať a zabudnú na predošlé ciele a rozhovory. Čarodejník pri zosielaní kúzla zodvihne ruky k nebesiam a preriekne: ,,Zlovestná chvíľa sadne na vás, a mysle vzdorom poblúzni vám.\" Potom ukáže na jednotlivé postavy s vystretou rukou a označením: ,,Ty, ty, ... a ty. Hádaj sa sťa zmyslov zabavený.\" Postavy sa hádajú po dobu 5 minút a nenechajú sanikým ani ničím od zdanlivo hlúpej hádky odradiť (len v prípade že by ich niekto napadol tak sa prestanú hádať po prvom zásahu).<br /><br />Neviditeľná žiara (kúzlo – 13 many)<br />Mág na 30 minút do nejakého predmet či zbrane dokáže včarovať neviditeľnú žiaru ktorá sa rozsvieti vždy ak sa do blízkosti 3 m dostane nejaká neviditeľná bytosť, duch, démon, alebo bytosti z iných dimenzií. Svetlo sa rozsvieti aj pri postavách ktoré posadol nejaký duch či démon. Samozrejme že nositeľ svetelného predmetu nevie zistiť o koho alebo čo presne ide a ani mu touto žiarou nijako neublíži. Pre očarovanie zbrane alebo predmetu ju musí čarodejník chytiť do oboch rúk a povedať: „mocnú žiaru do teba vkladám, aby neviditeľné bolo vidno“, a následne musí viditeľne uviazať na danú vec bledomodrú stuhu (po 30 minútach ju však treba odviazať). Takto počarovanú vec môže používať aj iná postava ako samotný čarodejník.<br /><br />6.úroveň<br />Premena na žabu (kúzlo – 15 many)<br />Na tejto úrovni dokáže čarodejník premeniť postavu (nie beštiu ani zviera) na žabu. Stačí ak sa jej dotkne svojou palicou a povie „nech si silný, nech si mocný, na žabu sa rázom zmeň“. A od tejto chvíle sa postava zmení po dobu 5 minút na malú žabu (postava musí 5 minút hrať žabu, čiže nerozpráva ani nebojuje, len skacká po okolí), na ktorú sa však nedá útočiť! Na späť do normálnej podoby sa zmení automaticky po ulipnutí 5 minúť alebo v prípade že ju niekto pobozká.</p>";

var klr="<h3 onclick=\"document.getElementById('klr').innerHTML=klra\">Klerik:</h3><p>Vďaka ich liečiacim schopnostiam, patria k veľmi obľúbeným a vyhľadávaným. Ich liečiace schopnosti vychádzajú hlavne s poznania rôznych bylín a veľkej viery svojho boha. Márne by ste ich hľadali v mestách. Oveľa radšej bývajú v chatrčiach v lesoch okolí miest kde hľadajú svoje bylinky a varia z nich odvary. Mnohokrát si ich panovníci vyberajú za svojich osobných lekárov, alebo ich nájdeme aj na vozoch, ktoré v prípade vojny idú za armádou a ošetrujú ranených na bojisku.<br /><br />Životy: 4, za úroveň +2<br />Zbrane: dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 1-3, 5-7<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>14 many</td><td>22 many</td><td>32 many</td><td>44 many</td><td>58 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>74 many</td><td>92 many</td><td>112 many</td><td>134 many</td><td>158 many</td></tr></table><br />Schopnosti:<br /><br />0.úroveň<br />Malé požehnanie <br />Klerik sa musí svojimi rukami dotknúť postavy a musí povedať: „V mene (meno nejakého boha) Ťa žehnám.“ Potom je táto postava požehnaná a zraňuje za +1 k svojmu útoku po dobu 5 minút. Schopnosť môže použiť 1 x za 4 hodiny.<br /><br />1.úroveň<br />Liečenie <br />Klerik sa musí skloniť nad zranenou postavou, ktorá musí ležať. Položí jej jednu ruku na hruď a druhú v ktorej zviera kvet (aký nájdete v okolí) na hlavu. Potom musí povedať: „(meno boha) žiadam Ťa, daj moc mojim rukám, nech uzdravia zranenia.“ Po 5 minútach sa postave vylieči 5 životov. Je možné použiť len mimo boja. Liečenie môže použiť 1 x za hodinu.<br /><br />4.úroveň<br />Požehnanie <br />Klerik sa musí svojimi rukami dotknúť postavy a musí povedať: „V mene (meno nejakého boha) Ťa žehnám.“ Potom je táto postava požehnaná a zraňuje za +2 k svojmu útoku a ma +1 k obrane po dobu 5 minút. Schopnosť môže použiť 1 x za 3 hodiny.<br /><br />Odstráň jed a jeho následky<br />Klerik touto schopnosťou dokáže odstrániť jed z akéhokoľvek nápoja, jedla alebo úplne odstrániť jeho účinky, ak sa jedu už niekto napil. Stačí ak chytí nádobu s otrávenou tekutinou, jedlom alebo položí ruku na žalúdok otrávenej postavy a povie „Boh (meno boha), očisti túto vodu (víno, jedlo,..)“ alebo „Boh (meno boha) vylieči tvoje telo od jedov“. Schopnosť môže použiť 1x za 3 hodiny.<br /><br />5.úroveň<br />Úplné liečenie <br />Klerik sa musí skloniť nad zranenou postavou, ktorá musí ležať. Položí jej jednu ruku na hruď a druhú v ktorej zviera kvety (aké nájdete v okolí) na hlavu. Potom musí povedať: „(meno boha) žiadam Ťa, daj moc mojim rukám, nech uzdravia všetky zranenia ktoré táto bytosť má.“ A  postave sa vyliečia všetky zranenia a doplnia sa všetky životy. Je možné použiť len mimo boja a len na živú postavu! Liečenie môže použiť 1 x za 2 hodiny.<br /><br />6.úroveň<br />Liečenie chorôb<br />Vďaka tejto schopnosti sa klerik naučil liečiť choroby (väčšinu). Pred samotným liečením musí klerik nazbierať rôzne ingrediencie a spraviť z nich lektvar alebo masť (liečenie treba dobre zahrať podľa druhu choroby a na každú chorobu treba iné ingrediencie a iný postup). Keď potom chorému podáva liek musí povedať: „(meno boha) žiadam Ťa, daj moc mojim rukám, nech vyliečia chorobu ktorú táto bytosť má.“<br />A postava je po 10 minútach vyliečená. Schopnosť môže použiť 1x za hodinu.<br /><br />Kúzla:<br /><br />0.úroveň<br />Rajská strela (kúzlo- 3 many)<br />Klerik musí povedať: „Strela priamo z raja.“ Potom stačí ak hodí svoj nosič a ak trafil nejakú postavu, je zranená za 3 životy.<br /><br />Mier (kúzlo- 4 many)<br />Pokiaľ niekto klerika ohrozuje zbraňou, alebo ho už napadol, či pácha nepravosť na niekom inom, klerik sa môže postaviť pred neho nanajvýš na vzdialenosť 4 metrov, ukáže na neho prstom a povie „Mier s Tebou“ a útočník v tej chvíli musí odhodiť zbraň aspoň na 3 metre od seba.<br /><br />1.úroveň<br />Nebeská strela (kúzlo- 4 many)<br />Klerik musí povedať: „Strela priamo z neba.“ Potom stačí ak hodí svoj nosič a ak trafil nejakú postavu, je zranená za 4 životy.<br /><br />Prenes životy (kúzlo- 5 many)<br />Klerik sa dokáže tak obetovať pre svojich priateľov, že im dokáže darovať časť svojich životov (vždy mu musí minimálne 1 ostať), takže koľko životov daruje, toľko si postava môže prirátať nie však nad maximu. Príde k nej, položí jej jednu ruku na rameno a povie „moje životy sú teraz Tvoje“, a povie číslo koľko životov chce darovať. Po tomto úkone je klerik na 5 minút vyčerpaný (musí to dobre predstierať!). <br /><br />2.úroveň<br />Bojové liečenie (kúzlo- 10 many)<br />Stačí ak klerik v boji pribehne k postave, dotkne sa jej a povie: „Liečim ťa rýchlo, skrz moc mojich rúk.“ Potom je táto postava vyliečená za 5 životov. Je možné použiť len počas boja.<br /><br />Vlastné liečenie (kúzlo- 8 many)<br />Stačí ak si klerik prekríži ruky na hrudníku a zvolá: „(meno nejakého boha) vylieč svojho služobníka.“ Hneď na to je klerik vyliečení za 6 životov.<br /><br />Ochrana (kúzlo- 10 many)<br />Pokiaľ klerik zošle toto kúzlo pred bojom na seba alebo niekoho iného, všetky zranenia spôsobené zbraňami či útočnými kúzlami, ktoré dostanú, budú znížené po dobu 10 minút na klerika alebo po dobu 5 minút na inú postavu, o 1 život. Takže ak dostane zásah za 3 životy, odpočíta si len 2. Kúzlo sa zosiela dotykom ruky alebo palice a vyslovením ,,ochrana“.<br />3.úroveň<br />Svetlo nebeské (kúzlo- 19 many)<br />Klerik musí ukázať na postavu oboma rukami, nie od chrbta, musí vidieť že na ňu klerik mieri. Potom len zvolá: „Svetlo nebeské, vypáĺ dieru do duše.“ Postava na ktorú klerik ukázal je zranená za 8 životov.<br /><br />Liečenie ťažkých zranení (kúzlo- 18 many)<br />Stačí ak klerik dobehne k postave, dotkne sa jej a povie: „Skrze mňa ťa (meno boha) rýchlo lieči.“ Táto postava je potom vyliečená za polovicu jej pôvodných životov a má zahojené všetky zranenia.<br /><br />Ohlušujúci piskot (kúzlo- 17 many)<br />Klerik hodí nosič o zem a zakričí „Ohlušujúci piskot“ a všetky postavy (okrem klerika) v okruhu 5 metrov sú na 30 sekúnd ohlušený (držia si uši a kričia od bolesti) a strácajú 2 životy – nie však zo zbroje (to platí aj pre tých ktorý by sa do kruhu chceli dostať). Nosič však môže hodiť maximálne 3 metre od seba.<br /><br />4.úroveň<br />Predstieraj smrť (kúzlo- 20 many)<br />Keď klerik potrebuje predstierať smrť, pripadne to potrebuje niekto z jeho blízkych dokáže to zariadiť a to dvoma spôsobmi: a to predstieraním že niekoho dýkou prebodne (napr. potrebuje nepriateľov zmiasť a akože zabije svojho priateľa (prípadne seba) tak zinscenuje divadlo kedy bodne do postavy (alebo seba) svoju dýku a súčasne povie ,,vista karma“ a meno svojho boha odzadu, takže napr. ,,vista karma luuz“, a postava ktorú bodol sa okamžite zosunie k zemi bez akejkoľvek známky života – nebije mu srdce, nedýcha, nevydáva žiadne zvuky. Postavy ktoré tomu musia uveriť nesmú byť vzdialené od klerika na viac než 15m ). Druhá možnosť je v prípade že klerik toto divadlo chce zinscenovať ešte predtým aby ho niekto videl a to tak že daná postava si ľahne (alebo on sám ) položí jej (alebo sebe) jednu svoju ruku na srdce druhú na ústa a povie ,,ostaň sťa mŕtvola“ a od tej chvíle je postava (alebo samotný klerik) bez známky života – nebije mu srdce, nedýcha, nevydáva žiadne zvuky. V tomto prípade však nesmie byť počas aktu v okolí nikto kto ma tomu divadlu uveriť. Pri oboch prípadoch dĺžku tohto stavu určuje klerik avšak maximálne môže trvať 24 hodín (vždy sa dopredu postavy musia dohodnúť na ako dlho to bude a pokiaľ je to možné oznámiť to aj organizátorovi alebo CPčku) alebo pokiaľ sa klerik opäť postavy nedotkne (klerik sa môže prebrať sám kedy chce) a nepovie ,,prebuď sa, už je čas“ . Počas tejto doby každý musí uveriť že postava je skutočne mŕtva a ani ju nenapadne mŕtvolu pre istotu prebodávať, štvrtiť a podobne!! <br /><br />5.úroveň<br />Hromadný mier (kúzlo- 5 many za každú postavu)<br />Pokiaľ niekto klerika ohrozujú zbraňou, alebo ho už napadli, či páchajú nepravosť na niekom inom, klerik sa môže postaviť pred nich, nanajvýš na vzdialenosť 4 metrov a povedať „Mier s Vami“ a útočníci v tej chvíli musia odložiť svoje zbrane z rúk a začať sa chovať priateľsky. V prípade že by ich niekto napadol alebo vyprovokoval kúzlo sa automaticky zruší, inak má trvanlivosť 15 minút. Klerik môže uviesť do mieru toľko ľudí na ktorej je úrovni ( na 5.úrovni to môže použiť na 5 ľudí a bude ho to stáť 25 many).<br /><br />Božia ochrana (kúzlo- 26 many)<br />Pokiaľ klerik zošle toto kúzlo pred bojom na seba, nepôsobia na neho po dobu 5 minút žiadne zbrane (ani kúzelné) a ani kúzla. Pokiaľ kúzlo pred bojom zošle na niekoho iného tak na danú postavu po dobu 2 minút nepôsobia žiadne zbrane ani kúzla len magické zbrane. Kúzlo sa zosiela dotykom ruky alebo palice a vyslovením ,,Boh (meno boha) Ťa ochráni“ (napr. ,,Boh Zuul Ťa ochráni“).<br /><br />6.úroveň<br />Spoznaj postavu (kúzlo- 14 many)<br />Klerik príde ku postave, položí jej obe ruky na hlavu a povie „zisťujem, kým skutočne si “. Následne mu postava musí (nevzťahuje sa  to napr. na schopnosť nezistiteľnosť) pošepkať jej presvedčenie, rasu, povolanie, úroveň a v akého boha verí.</p>";

var bb="<h3 onclick=\"document.getElementById('bb').innerHTML=bba\">Barbar/Berserk:</h3><p>Určite patrí k jedným z najobávanejších a najzúrivejších bojovníkov. Je dosť nevypočitateľný a veľkú záľubu nachádza v boji a v samotnom zabíjaní svojich protivníkov. V niektorých prípadoch sa počas boja dostane až do tranzu a jeho sila sa značne zvýši. S tým sa začne zvýši aj pravdepodobnosť že v tomto ošiali trafí aj niektorého so svojich spolubojovníkov a spôsobí mu vážne zranenie. Aj kvôli tomuto sú dosť neobľúbený a samotársky. Určite ich nenájdeme nikde v civilizovanom meste ale oveľa pravdepodobnejšie budú žiť v nejakej barbarskej dedine.<br /><br />Životy: 9, za úroveň + 4 na každej párnej +5<br />Zbrane: používa krátke, stredné, ťažké, iné nepoužíva!<br />Špecializácia: na ťažké zbrane<br />Zbroje: používa ľahké<br />Štíty: nepoužíva<br />Presvedčenie: 3-5<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – ťažké zbrane +1 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />1. úroveň<br />Potlač bolesť<br />Postavy s týmto povolaním si nesmierne odolné a dokážu potlačiť bolesť. V prípade že počas boja dostanú zásah, povedia „potláčam bolesť“ zareve a životy z toho zranenia si odpočíta až po 45 (na 5úr. po 75) minútach po skončení boja. Ak by sa po tomto odpočítaní životov dostal do mínusu zomiera na vykrvácanie (takže by bolo dobré aby sa hneď po skončení boja nechal ošetriť). Potlačiť bolesť dokáže len v prípade, že zásah ktorý dostal nebol za viac ako 3 (na 5úr. za viac ako 5 životov) životy (neplatí na jedy pokiaľ ešte nemá jedovú odolnosť). Schopnosť môže použiť 1 x za 2 hodiny.<br /><br />Regenerácia<br />Každému berserkovi sa oveľa rýchlejšie hoja zranenia ako ostatným. Preto si za každú  hodinu môžu pripočítať 1 (na 5úr. 2 životy) život.(neplatí na zbroj a nad limit jeho plných životov).<br /><br />2. úroveň<br />Berserk (bojový ošiaľ)<br />Táto schopnosť z nich robí veľmi zúrivých zabijakov!! Každý berserk, ktorý bojuje v boji dlhšie ako 5 minút, je zranený za viac ako 3 životy (jedným úderom), alebo jeho priateľ je ťažko ranený či mŕtvy, sa veľmi rozlostí začne strašlivo ručať a zareve „hnev ma zocelil“ má bonus +1 (na 5úr. +2) do útoku ale –1 (na 5úr. –2) do obrany (pokiaľ mu niekto oznámil že ho zranil za 2, tak si odpočíta 3 (4) životy). Schopnosť trvá do konca boja a môže ju využiť 1 x za 2 hodiny. <br /><br />Zvýšená odolnosť<br />Zo všetkých útokov zraňujúcich za 3 a viac životov ktoré berserk dostane, si počas 5 minút bude odpočítavať o jedno (na 5úr. o dve menšie) zranenie. Stačí ak sa pred bojom bude tak minútu hecovať, udierať do hrudníka, ručať a potom zakričí „cítim odolnosť ktorá ma napĺňa“! Schopnosť môže použiť 1 x za 4 hodiny.<br /><br />3. úroveň<br />Odolnosť na jedy<br />Každý berserk na tejto úrovni sa stáva imúnny na ľahké a stredné jedy (na 5úr. aj na ľahké a stredné uspávadlá či halucinácie). Schopnosť je automatická a neobmedzená! Útočníkovi len treba povedať „Tvoje jedy ma nezrania“ pokiaľ to však niesu silné jedy.<br /><br />Zastrašenie<br />Z každého berserka vyžaruje strach a navyše keď k tomu pripojí túto schopnosť, protivník s ním nebude bojovať, pokiaľ ho sám berserk nenapadne. Stačí ak na nepriateľa zareve „zmizni mi s cesty“, rozmáchne sa zbraňou a udrie ňou do zeme. Najbližších 10 minút vás tento protivník nenapadne (na 5úr. musí od vás utiecť aspoň na 50 metrov a najbližších 20 minút sa ani len nevráti) ale môže bojovať proti ostatným. Zastrašenie môžete použiť 1 x za 4 hodiny.<br /><br />4. úroveň<br />Rozbíjanie štítov<br />Barbar je vo svojich útokoch tak brutálny, že dokáže postave rozbiť jedným útokom jej štít a tak ju zbaviť cennej obrany. Stačí ak zasiahne štít a povie „sila víťazí nad štítom“, potom musí postava štít odložiť a po boji si ho musí opraviť u kováča, inak ho nemôže používať. Schopnosť môže použiť 1x za 2 hodiny.<br /><br />Zúrivý útok<br />Berserk sa počas boja dokáže tak rozzúriť že prvým úderom v boji zraní protivníka o 5 životou naviac ako zraňuje jeho zbraň (ak zraňuje za +3 zúrivý útok +5 výsledná hodnota bude 8 životov). Berserk musí pred bojom nahlas zarevať „moja zúrivosť ťa zabije“, následne sa niekde na tele poreže (stačí tak aby mu tiekla krv-pri tom však stratí jeden život) a prvým platným zásahom protivníka zraní za daný počet životov. Schopnosť môže použiť 1 x za 4 hodiny.<br /><br />5. úroveň<br />Špecializácia na zbraň – ťažké zbrane +2 (od útoku), vrátane bastardu v jednej ruke!<br /><br />Odolnosť voči omráčeniu<br />Nakoľko berserk nepoužíva v boji takmer žiadnu ochranu hlavy je jeho hlava na silne otrasi značne zvyknutá a odolná, preto na neho neplatí schopnosť omráčenie ktoré majú niektoré povolania (omráčenie za plných životov), stačí ak berserk pri pokuse omráčiť ho zarehoce a povie „omráčiť mňa sa ti nepodarí“ ale platí na neho klasické omráčenie (keď je postava na hranici vyradenia). Schopnosť je automatická a neobmedzená. <br /><br />Zdokonalenie schopností<br />Postupom času sa niektoré barbarové schopnosti zdokonaľujú:<br /><table cellpadding=\"5px\"><tr><td>Potlač bolesť</td><td></td><td></td><td></td><td>Regenerácia</td></tr><tr><td>Berserk</td><td></td><td></td><td></td><td>Zvýšená odolnosť</td></tr><tr><td>Odolnosť na jedy</td><td></td><td></td><td></td><td>Zastrašenie</td></tr></table><br /><br />6.úroveň <br />Hod skalou<br />Barbar oplýva takou silou že mu nerobí problém vrhať aj veľké skaly za pomoci ktorých môže rozbíjať určité veci alebo spôsobovať veľké zranenia. Na túto schopnosť je potrebné aby si hráč doniesol umelo vytvorenú skalu (najlepšie z papiera alebo niečoho mäkkého zafarbeného na šedo o rozmeroch minimálne 25x15cm). Pre použitie ju potom musí uchopiť do oboch rúk, dvihnúť nad hlavu a náprahom ponad hlavu ju hodiť a zakričať „vrhám skalu“ za 5 životov. Ak zasiahne postavu (neráta sa štít), postava sa musí zvaliť na zem, ale následne sa môže postaviť. Schopnosť môže použiť 1x za 2 hodiny.</p>";

var boj="<h3 onclick=\"document.getElementById('boj').innerHTML=boja\">Bojovník:</h3><p>Bojovníci (aj bojovníčky) sú veľmi tvrdý a drsný. Od útleho detstva sa učia narábať so zbraňami. Z hĺbky svojho srdca nenávidia kúzelníkov a strelcov, lebo ich štýl boja, teda streľbu a kúzlenie, považujú za nečestné a oveľa radšej dávajú prednosť boju na blízko. Vojsko zostavené s takýchto tvrdých bojovníkov predstavuje velikú hrozbu pre akéhokoľvek nepriateľa. Na rozdiel od berserka sa do boja nepúšťajú po hlave a skôr ako zaútočia si premyslia akú takú taktiku. <br /><br />Životy: 8, za úroveň +4 na každej párnej +5<br />Zbrane: používa krátke, stredné, ťažké, vrhacie, tyčové, iné nepoužíva!<br />Špecializácia: na ťažké zbrane<br />Zbroje: používa ľahké, stredné<br />Štíty: všetky<br />Presvedčenie: 1-7 <br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – ťažké zbrane +1 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />1. úroveň<br />Liečenie životov<br />Každý bojovník si musí vedieť obviazať svoje zranenie, alebo zranenia svojich druhov. K tejto schopnosti potrebuje obväzy a symbolicky obviazať niektorú časť tela sebe alebo ostatným. Po obviazaní sa životy doplnia až za 30 minút. Po túto dobu je potrebné obväzy nosiť! Bojovník dokáže vyliečiť max. 3 životy a schopnosť môže použiť raz za 2 hodiny.<br /><br />Odzbrojenie<br />Touto schopnosťou dokáže bojovník protivníka odzbrojiť. Svojou zbraňou sa pri tom musí dotknúť jeho zbrane a povedať „odzbrojujem Ťa“ . Protivník musí následne zbraň odhodiť minimálne 4 metre od seba pokiaľ je 1 ručná ak má 2 ručnú (čiže všetky ťažké, bastard musí byť v dvoch rukách, tyčové luky a kuše) musí ju odhodiť 2 m. Odzbrojenie môže použiť 1 x za 2 hodiny.<br /><br />2. úroveň<br />Bojový pokrik<br />Každý bojovník si môže vymyslieť vlastný bojový pokrik (ktorý pri postupe na túto úroveň oznámi príslušnému CP ktorého vyvíja a následne aj organizátorovi). Samozrejme že tento pokrik musí byť v hrozivom prevedení (krik, rev a pod.) a bojovník musí 3x zatočiť zbraňou nad svojou hlavou. Nasledujúcich 5 minút bude mať bonus +1 do útoku. Schopnosť môže použiť 1 x za 4 hodiny.<br /><br />Rozptýľ mágiu<br />Vďaka svojmu odporu k mágii sa ju bojovníci naučili rozptýliť. Stačí ak dajú kúzelníkovi platný zásah a povedia „rozptyľujem Tvoju hnusnú mágiu za 10“. V tej chvíli si dotyčná postava musí odpočítať so svojej many 10 bodov (pokiaľ má pred použitím tejto schopnosti kúzelník len 10 many a menej, a bojovník použije na ňu túto schopnosť jeho mana bude na 0 a nemôže ďalej čarovať pokiaľ nebude zase meditovať alebo si ju ináč neobnoví) ale zásah ho zraní len za 1 život (nech je dávaný akoukoľvek zbraňou). Bojovník môže naraz rozptýliť len 10 bodov mágie a schopnosť môže použi 1 x za 4 hodiny.<br /><br />3. úroveň<br />Odolnosť na uspávadlo<br />Každý bojovník na tejto úrovni sa stáva imúnny na ľahké a stredné uspávadlá. Schopnosť je automatická a neobmedzená! Útočníkovi len treba povedať „Tvoje uspávadlá na mňa nepôsobia“ pokiaľ to však niesu silné uspávadlá.<br /><br />Vykry a zraň<br />Bojovník využíva túto schopnosť tak, že pokiaľ dostane platný zásah (ale o ňom musí vedieť čiže sa nedá použiť na útok od chrbta a pod.), povie súperovi „vykrývam Tvoj zásah a zraňujem Ťa za ....“. Takže bojovník si neodpočíta žiadne životy a naopak svojho útočníka hneď zraní (silou svojho útoku +1) bez toho aby mu dal vôbec zásah. Pri tomto útoku má bojovník bonus +1 do útoku zbrane. Schopnosť možno použiť 1 x za 6 hodín a nemožno ju použiť na bojovníka!<br /><br />4. úroveň<br />Využi mágiu<br />Vďaka tejto schopnosti dokáže bojovník premeniť na neho použité kúzlo (akékoľvek kúzlo ktoré nepriateľ na neho použije) na doplnenie životov (samozrejme účinky kúzla tým pádom na neho nepôsobia). Stačí ak hneď po tom čo na neho kúzelník zošle nejaké kúzlo zakričí „tvoja mágia ma vylieči“ (pri kúzlení cez nosič musí kúzelník trafiť aby bojovník mohol použiť túto schopnosť. Následne je bojovník  vyliečený o toľko životov koľko je tretina jeho pôvodných životov (nevzťahuje sa na zbroj) (napr. plný stav bojovníkových životov je 27, ale je dosť zranený tak má momentálne len 12 a použije túto schopnosť tak si priráta k tým 12 ešte 9 čo je jedna tretina z 27 a bude mať 21 životov) a pokiaľ by mal v momente použitia tejto schopnosti bojovník plný počet životov priráta si na 1 hodinu (alebo dokedy mu ich niekto neuberie) 4 fiktívne životy (pri zranení sa odratávajú ako prvé) nad rámec svojich skutočných životov. Schopnosť môže použiť 1x za 6 hodín.<br /><br />Oprav zbroj<br />Počas častých bojov sa bojovníci naučili opravovať zbroje. Túto schopnosť môže využiť len mimo boja. Zbroj si musí vyzliecť a veľmi dobre zahrať jej opravu (aspoň 15 minút). Opravou sa doplní polovica bodov z pôvodného počtu. Opravovať môže 4x za deň.<br /><br />5. úroveň<br />Špecializácia na zbraň – ťažké zbrane +2 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />Dvojitý sek<br /> Dvojitým sekom zraní bojovník počas jedného zásahu. Stačí ak povie „dvojité zranenie“ a postava je zranená za dvojnásobný počet životov. Je to nebezpečná schopnosť, ktorá slabšie postavy dokáže zabiť behom jedného zásahu. Schopnosť môže použiť 1x za 5 hodín.<br /><br />6.úroveň<br />Podrazenie<br />Vďaka tejto schopnosti dokáže bojovník dostať svojho protivníka na zem aj počas súboja (samozrejme že schopnosť sa dá využiť aj kedykoľvek mimo súboja). Stačí ak sa zbraňou dotkne súperových nôh a zakričí „podrážam ťa svojou zbraňou, padáš ihneď na zem“. V tej chvíli postava na ktorú bola táto schopnosť použitá musí padnúť (nie sa len posadiť, treba to poriadne zahrať!) na zem ale vzápätí sa môže postaviť. Schopnosť môže bojovník použiť 1x za hodinu.</p>";

var lov="<h3 onclick=\"document.getElementById('lov').innerHTML=lova\">Lovec:</h3><p>Lovec má veľa spoločného s hraničiarom a druidom. Aj on sa stará o prírodu a ochraňuje ju. Dohliada na to, aby sa zver nepremnožila. Pokiaľ je zvere dostatok alebo je stará či chorá, uloví ju a živí sa jej mäsom a odieva do jej kože. Mestá takmer nenavštevuje, len v prípade že potrebuje niečo nakúpiť alebo popredávať kožušiny. Stavajú si lesné príbytky, alebo prespávajú pod holým nebom keď sa neustále presúvajú z miesta na miesto. <br /><br />Životy: 5, za úroveň +3<br />Zbrane: používa krátke, stredné, vrhacie, luky, iné nepoužíva!<br />Špecializácia: na luky<br />Zbroje: používa ľahké<br />Štíty: nepoužíva<br />Presvedčenie: 1-4<br />Schopnosti: <br /><br />0. úroveň<br />Špecializácia na zbraň – luky +1 (od útoku).<br /><br />1. úroveň<br />Lov<br />To, že každý lovec vie loviť, je samozrejme. Každý deň môžete loviť nanajvýš 5 krát. Je potrebné aby ste to dobre zahrali (aspoň 5 minút). Z veľmi výživného úlovku sa vám obnovia 3 stratené životy, alebo úlovok môžete dať zjesť aj niekomu inému. Treba však naozaj pri tom zjesť nejaký kúsok potravy (napr. aj chleba). Túto stravu je potrebné zjesť hneď po ulovení a nemožno ju odkladať na neskôr, skazila by sa. Tiež nemožno loviť počas boja alebo v meste. Na akciu by ste si mali priniesť aspoň 4 kúsky (stačí 3 x3 cm) kožušiny či kože, ktoré ste získali pri lovení zo zvierat a každý večer môžete jeden kúsok predať obchodníkovi. <br /><br />Jedy a uspávadlá (slabé)<br />Lovec je imúnny na slabé jedy a slabé uspávadlá. Túto imunitu si vytvoril vďaka svojmu životu v lese, kde je veľa jedovatých chrobáčikov, jašteričiek a omamujúcich plodov. Počas hry sa dozviete ingrediencie na vytvorenie slabého jedu a uspávadlá, ktoré si môžete sami zhotoviť. Za jeden deň dokážete vyrobiť jed na 3 použitia a uspávadlo na 1 použitie. Je to jed a uspávadlo slabej kategórie. Majú však krátku trvácnosť a na ďalší deň sa vám skazia a nebudú účinkovať. Takže na každý deň treba vytvoriť nové. Jed sa dá použiť pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane čí hrot šípu (žiadne kladivá a palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). V jedle či vode účinkuje za 15 minút ak je na zbrani, tak jedom okamžite a uspávadlo (slabé) nemožno použiť žiadnou zbraňou, je možné ho len vypiť, či pridať do jedla!! Obeť si v prípade jedu odpočíta 2 životy (ak bola použitá zbraň tak si na začiatku odpočíta aj jej zranenie) a pokiaľ ide o uspávadlo, obeť zaspí na 2 minúty. Obeti však treba oznámiť že ste na ňu použili slabý jed alebo slabé uspávadlo a ich účinky. <br /><br />2. úroveň<br />Maskovanie<br />V prípade, lovca niekto sleduje, alebo sa sám potrebuje niekde ukryť, použije maskovanie. Samozrejme že to nefunguje v meste, pokosenej lúke a podobne. Proste sa musí byť za čo skovať a musí zakričať „maskujem sa“ a hráči musia predstierať, že ho nevidia! Vo chvíli keď však chce túto schopnosť použiť musí byť aspoň 10 metrov od postáv pred ktorými sa chce skovať. V opačnom prípade ho budú vidieť. Aby nebol odhalený musí sa skrývať v tichosti a nemôže sa hýbať. Maskovanie môže využiť 4x za deň.<br /><br />Pod ochranou stromov<br />Vždy keď je lovec pod stromami (nie na lúke alebo v meste) môže si prirátať 2 životy ku zbroji. Je to odmena prírody za službu, ktorú lovci pre ňu vykonávajú. Schopnosť je automatická a neobmedzená.<br /><br />3. úroveň<br />Falošné stopy<br />Pokiaľ lovec zistí že ho niekto sleduje či prenasleduje, zoberie vetvičku alebo kameň a hodí ju smerom ktorým sa majú prenasledovatelia vydať a oznámi im „falošné stopy vás povedú týmto smerom“ a oni ho nemôžu ďalej prenasledovať ale musia sa vydať smerom (minimálne 100 m na konci ktorých stratili stopu a nevedia kam ďalej) na ktorý hodil predmet. Avšak v momente keď začne zahladzovať svoje stopy, musia byť od neho postavy najmenej 20 metrov ďaleko, ináč ho môžu prenasledovať. Schopnosť môže použiť 3 x za deň.<br /><br />Lesný duch<br />Ešte pred bojom začne žiadať lovec lesných duchov aby mu pomohli v boji. Po krátkom (asi tak minútu) obrade (mali by to byť nejaké prosby či modlitby k prírode, jej duchom, pri ktorých bude lovec ležať na zemi, dotýkať sa oboma rukami stromu alebo sa bude šľahať trsom trávi, či rozhadzovať lístie a pod.) sa v jeho zbrani usadí jeden z lesných duchov a v tejto zbrani bude zotrvávať asi 5 minút. Počas tejto doby bude mať lovec bonus + 2 do útoku zbrane. Privolávať lesného ducha môže 1 x za 6 hodín. <br /><br />4. úroveň<br />Plíženie<br />Každý skúsený lovec sa vie k svojmu cieľu potichu a nenápadne priblížiť. Samozrejme pri tom musí využívať vhodne podmienky ako napríklad tmu, vysokú trávu, tmavý les a pod. Stačí ak si na hlavu uviaže zelenú šatku, potrie si farbou, popolom alebo blatom tvár, a začne sa pomaly a potichu plížiť smerom k svojmu cieľu a pre tento cieľ sa stane taký nenápadný že sa k nemu môže nepozorovane prikradnúť až na blízkosť 5 metrov samozrejme ak to vyššie uvedené podmienky dovoľujú. Avšak nepozorovateľným sa stáva len pre danú postavu (či skupinku) ku ktorej sa plíži a tá sa musí tváriť že si ho nevšimla (samozrejme ak bude napadne hlučný, či sa nebude zakrádať tak si ho všimnú). Ak by bol niekto iný v okolí tak je šanca že tí ho uvidia. Schopnosť môže použiť 1x za 4 hodiny. <br /><br />Bylinky a lesné plody<br /> Svojim životom v lese sa lovec naučil využívať všetky možne byliny a plody ktoré mu les dáva. Stačí ak v správnej kombinácii 30 minút povarí dané ingrediencie (samozrejme že zvlášť ingrediencie na jed zvlášť na liečenie a pod.) a z tých následne vytlačí príslušný extrakt stredne silný.Liečivý extrakt (z bylín) (1 dávka = 3 použitia) -  ak ho ranený vypije tak sa mu behom 30 minút doplní 8 životov alebo si ho môže naliať priamo do rany a tým sa mu doplnia za 5 minút  4 životy.<br />Jedový extrakt (z plodov) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane čí hrot šípu (žiadne kladivá a palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). V jedle či vode účinkuje za 5 minút ak je na zbrani, tak okamžite. Obeť si po dobu 10 minút za každé 2 uplynuté minúty odpočíta 1 život (ak bola použitá zbraň tak si na začiatku odpočíta aj jej zranenie). Obeti však treba oznámiť že ste použili stredný jed a jeho účinky.<br />Uspávací extrakt (z ihličia) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla alebo pitia,  (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 5 minút ak sa vypije samostatne, tak okamžite. Obeť si následne pospí zhruba 30 minút. Treba jej však oznámiť že ste na ňu použili uspávadlo strednej sily a jeho účinky.<br />Halucinogénny extrakt (z hríbov) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 10 minút ak sa vypije samostatne, tak za 5 minút. Obeť následne musí zhruba 20 minút predstierať najrôznejšie vidiny či halucinácie. Treba jej však oznámiť že ste na ňu použili halucinogén strednej sily a jeho účinky.<br /><br />Každý deň môže lovec navariť max. jednu dávku z každého extraktu.<br /><br />5. úroveň<br />Špecializácia na zbraň – luky +2 (od útoku).<br /><br />Medvedia sila<br />Túto schopnosť môže lovec používať až po tom čo nájde v lese statného medveďa a pokúsi sa ho zabiť len dýkou, aby tak preukázal svoju odvahu, silu a že si zaslúži aby mu duch medveďa pomáhal v jeho povolaní. Ak sa mu podarí takto medveďa zabiť, musí následne spraviť obrad pri ktorom zje surové medvedie srdce, z kožušiny alebo drápov si spraví amulet a ostatné mäso obetuje lesu, druidom alebo matke zemi. <br />Od tejto chvíle bude môcť lovec oplývať veľkou silou vždy keď to bude potrebovať. Napríklad by potreboval premiestniť nejakú ťažkú vec, niekoho odhodiť či prípadne zaútočiť zbraňou. Stačí ak pred tým silno stisne v ruke medvedí amulet a zakričí „duch medveďa vstúp do mňa“ a od tej chvíle bude mať lovec na najbližší úkon veľkú silu. Napríklad do niekoho sotí a ten musí odskočiť o 10 metrov dozadu, alebo keby na niekoho zaútočil zbraňou (krátkou, strednou alebo lukom) tak má bonus +6 do útoku a navyše postava odletí dozadu o 5 metrov Túto schopnosť môže použiť 1x za 6 hodín.<br /><br />6.úroveň<br />Osie hniezdo<br />Lovec je spriaznený s prírodou a tak mu je príroda veľakrát nápomocná hoc aj pri boji. Lovec si dokáže v lese nájsť osie hniezdo ktoré nosí pri sebe a v prípade potreby ho hodí po nepriateľovi a pokiaľ ho zasiahne osoba stráca 2 životy a musí po dobu 2 minút predstierať napadnutie osami. Počas tohto napadnutia ma postih –1 do útoku a –1 do obrany. Napadnutý sú aj všetci v okruhu 3m od zasiahnutej osoby. Lovec môže takisto hodiť osie hniezdo aj na zem ku skupinke postáv pri čom sú všetky v okruhu 3m zranené za 2 životy a tiež musia predstierať po dobu 2 minút napadnutie osami a majú rovnaký postih. Schopnosť nepôsobí na hraničiara, druida, šamana a iného lovca. Na túto schopnosť si hráč musí priniesť na hru buď papierovú alebo penovú guľu pripomínajúcu osie hniezdo o minimálnom priemere 15 cm. Schopnosť môže použiť 1x za 3 hodiny.</p>";

var lvs="<h3 onclick=\"document.getElementById('lvs').innerHTML=lvsa\">Lovec skalpov:</h3><p>Povolanie vyslovene typické pre barbarské kmene! Ich krvilačnosť a ukrutnosť nepozná hraníc! Veľmi radi lovia iné rasy ako sú oni sami, ale zo všetkého najviac nenávidia civilizované rasy (ako sú ľudia, elfovia a pod.). Chodia na výpravy po svojich územiach a hľadajú votrelcov ale mnohokrát prepadávajú aj menšie dediny a každého nešťastníka ktorý sa im dostane do cesty oskalpujú a veľmi bolestivo a pomaly zabijú. Ich skalpy si potom s hrdosťou našívajú na zbroje alebo nosia povešané na opasku, prípadne si z ich kože šijú odevy. S veľkou obľubou tiež pijú krv svojich protivníkov a sýtia sa ich vnútornosťami. Mnohokrát si ich najímajú aj rôzne temné sily, či bohatý páni aby za nich vykonali špinavú prácu, avšak už veľa krát sa stalo, že po skončení svojej práce sa im zdala že nedostali primerane zaplatené a zabila aj svojho zamestnávateľa! <br /><br />Životy: 6, za úroveň +3 na každej párnej +4<br />Zbrane: používa krátke, stredné, vrhacie, luky, iné nepoužíva!<br />Špecializácia: na stredné zbrane<br />Zbroje: používa ľahké a stredné<br />Štíty: malý a stredný <br />Presvedčenie: 4-7<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – stredné zbrane +1 (od útoku).<br /><br />1. úroveň<br />Odhad životov<br />Lovec skalpov vie veľmi dobre zhodnotiť súperove sily.<br />Stačí ak sa na neho chvíľu sústredene pozerá (asi tak 1 minútu) a potom ukáže prstom na postavu a povie „zisťujem tvoje životy“. Tá mu následne musí povedať, koľko má životov. Schopnosť môže použiť raz za hodinu.<br /><br />Rituál skalpov <br />Pokiaľ lovec skalpov niekoho zabije, spraví nad jeho telom rituál (treba ho dobre zahrať aspoň minútu) pri ktorom mu zoberie skalp (veľmi jemne mu prejde dýkou po čele), môže si doplniť 3 životy. Ak by to spravil nad mŕtvolou ktorú on sám nezabil, môže si pridať 1 život. Táto schopnosť je obmedzená len počtom neoskalpovaných mŕtvol a možno ju prevádzať len do 10 minút po smrti tejto obete, prípadne sa to dá spraviť aj zaživa, ale obeť musí byť omráčená, spútaná, spiaca, omámená alebo na hranici vyradenia. Pokiaľ tento obrad vykoná na živej postave, môže si doplniť 5 životov ale musí ju nechať žiť! Pri odobratí skalpu živej obeti stráca táto obeť 1 život, pokiaľ je však na hranici vyradenia tento život nestráca! Stratu života treba potom obeti oznámiť. A nikoho nemožno oskalpovať 2 krát!! <br /><br />2. úroveň<br />Krvavá zbroj skalpov <br />Každý lovec skalpov si zo svojich trofejí (čiže skalpov) môže ušiť zbroj. Aby si mohol spraviť takúto zbroj, musí nazbierať aspoň 7 skalpov ktoré si potom zošije dokopy a spraví z nich zbroj, vďaka ktorej si môže pripočítať 2 životy ku svojej zbroji (od teraz až do konca hry).. Takúto zbroj si môže zhotoviť len ak dosiahol 2 úroveň, nazbieral potrebný počet skalpov a bol na ňu vyvinutý! Počas hry je možné si spraviť len jednu takúto zbroj (ďalšiu až v prípade úplného zničenia tej prvej).<br /><br />Omráčenie<br />Na hranici vyradenia môže omračovať každý, avšak len pár povolaní v rátane lovca skalpov dokáže omráčiť postavu s plnými životmi ale tá nesmie mať chránenú hlavu prilbou alebo drátenou kuklou a o jeho zámere nesmie vedieť. Tiež nemôže omračovať počas boja. Pri omráčení musí položiť ruku na hlavu obete a povedať „omračujem Ťa, napriek tvojim životom“ a obeť musí hneď predstierať omráčenie po dobu 5 minút. Omráčenie môže využiť raz za 8 hodín.<br /><br />3. úroveň<br />Strach <br />Zo všetkých lovcov skalpov vyžaruje veľká aura strachu, vďaka ktorej dokážu svojho protivníka zastrašiť a zahnať na útek. Stačí ak na svojho súpera zakričí „Tvoje srdce si dám na večeru, len strach Ťa môže zachrániť“ pritom musí zúrivo revať, rehotať sa a nakoniec nohou dupne o zem. V tom momente musí jeho protivník utekať preč, čo mu budú nohy stačiť. Schopnosť strach môže použiť 1x za 5 hodín a neplatí na lovca skalpov.<br /><br />Štít mŕtvych duší <br />Vďaka skalpom mŕtvych, ktorých lovec skalpov pozabíjal, väzní ich duše a pripútava si ich k sebe. Pokiaľ ho niekto napadne a on povie „duše mŕtvych chráňte ma“ platný zásah ktorý práve dostal sa neráta (okrem schopnosti, napr. svätý úder a pod.) lebo tento úder zobrali na seba duše mŕtvych a na oplátku mu úder rovnakej veľkosti vrátili (pokiaľ útočník zraňuje za 3 životy a je použitá táto schopnosť, sám si ich musí odrátať). Môže to použiť 1 x za 4 hodiny.<br /><br />4. úroveň<br />Nárek mŕtvych<br />Všetky veci ktoré lovec skalpov používa a taktiež on sám, sú ako keby nasiaknuté bolestivými výkrikmi a prosbami jeho obetí. Lovec odmien sa naučil tento nárek ovládnuť a keď potrebuje, tak v pravú chvíľu tento nárek dokáže zo seba vypustiť tak aby ho počuli aj postavy navôkol. Stačí ak pevne v ruke podrží nejaký skalp, dvihne ho nad hlavu a zvolá „nárek mŕtvych vám znie v ušiach“. Od tejto chvíle všetky postavy v okruhu 10 metrov (okrem lovcov skalpov) počujú veľmi desivé náreky a plač mŕtvych obetí, ktoré lovec skalpov zabil. Tieto výkriky sú tak strašné, že všetci majú na 5 minút –1 do útoku a –1 do obrany (ak vás niekto zraní za 2 životy, odrátate si 3). Schopnosť lovec skalpov môže použiť 1x za 4 hodíny.<br /><br />Znechutenie<br />Väčšine postáv sú skalpy odporné, zhluk vlasov z ktorého visí kus kože a odkvapkáva krv. Lovec skalpov ich preto využíva aj na to, aby znechutil a odstrašil protivníka v boji. Stačí ak sa postaví oproti súperom, olíže skalp a povie „si mnou vari znechutený ?“ a potom postava musí začať roleplayovať záchvat hystérie a znechutenosti (ó bože to je nechutné, fuj,..), začne zvracať a snaží sa dostať čo najďalej od skalpu a samotného lovca skalpov. Znechutenie hrajú všetci v okolí lovca skalpov v okruhu 5 m (okrem lovcov skalpov) po dobu 5 minúť alebo kým ich napr. niekto nenapadne. Schopnosť môže použiť 1x za 2 hodiny alebo vždy v momente keď získa čerstvý skalp. Navyše lovec skalpov má bonus +1 (do útoku) na prvý útok na každého zvracajúceho. <br /><br />5. úroveň<br />Špecializácia na zbraň – stredné zbrane +2 (od útoku).<br /><br />Úder padlých <br />Schopnosť môže lovec skalpov používať až po tom čo svojou zbraňou pri ktorej chce túto schopnosť použiť, zabil najmenej 6 bytostí (nie zvierat!). Od tejto chvíle bude môcť lovec skalpov pri útoku touto zbraňou využiť silu a moc mŕtvych ktorých zabil a to tak že pred bojom vezme najčerstvejší skalp ktorý má, a krvou čo z neho kvapka potrie svoju zbraň a následne pri platnom údere zakričí „úder mŕtvych“ a postava je následne zranená za útok jeho zbrane +5 (ak svojou zbraňou zraňuje za 3 životy, tak teraz si priráta +5 do útoku, čiže výsledná hodnota zranenia je za 8 životov). Schopnosť môže použiť 1x za 5 hodín.<br /><br />6.úroveň<br />Stráž mŕtvych duší<br />Lovci skalpov si často nosia do svojich príbytkov svoje trofeje ktoré si ukoristili či už zo svojich živých alebo mŕtvych súperov. Sú to napríklad kože, kosti čeľuste, zuby, skalpy a vyzdobujú si s nimi svoje okolie aby tak uväznili duše mŕtvych v okolí svojho príbytku a tým ho chránili. Na túto schopnosť si treba priniesť potrebné rekvizity a rozvešať ich okolo vášho príbytku v okruhu 10m. Každý (vrátane neviditeľných) kto potom do tohoto kruhu vojde (okrem lovcov skalpov) musí v tom momente hlasno vykríknuť (musí to byť naozaj hlasno, lebo v podstate tento váš výkrik predstavuje duše mŕtvych strážcov varujúcich lovca skalpov!!) od strachu a počas prípadného súboja na tejto pôde má postih –1 do útoku a –1 do obrany. Schopnosť je automatická (po dosiahnutí tejto úrovne, rozvešaní rekvizít a spravení nejakého RPového rituálu) a neobmedzená.</p>";

var zbj="<h3 onclick=\"document.getElementById('zbj').innerHTML=zbja\">Zbojník:</h3><p>Zase jedno s tých známejších povolaní. Veľkú časť zbojníkov tvoria trestanci, vrahovia, rebelanti a iný vyvrheli, ktorých spoločnosť označila za nežiadúcich. Postupne sa k ním pridávali aj tý najchudobnejší, a vypočítavý chytráci, ktorý prišli na to, že je ľahšie lúpiť, prepadávať a rabovať ako sa živiť poctivou prácou. Skrývajú sa pri lesných cestách a prepadávajú nič netušiacich chudákov. Každý kto sa rozhodne spustiť sa na zbojnícke chodníčky musí rátať s tým, že spravodlivosť mu pôjde nekompromisne po krku, ktorý koniec koncov nebude už musieť slúžiť ku svojmu účelu, lebo sekery katov sú vždy pripravené pomstiť spravodlivosť.<br /><br />Životy: 6, za úroveň +3 na každej párnej + 4<br />Zbrane: používa krátke, stredné, vrhacie, iné nepoužíva!<br />Špecializácia: na stredné a vrhacie zbrane<br />Zbroje: používa ľahké a stredné<br />Štíty: malý<br />Presvedčenie: 4-6<br />Schopnosti: <br /><br />0. úroveň<br />Špecializácia na zbraň – stredné a vrhacie zbrane +1 (od útoku).<br /><br />1. úroveň<br />Úskok<br />Zbojník sa svojou obratnosťou dokáže zásahu uhnúť. Pokiaľ dostane zásah od protivníka ktorého vidí (nedá sa použiť pri útoku od chrbta a pod.), zakričí „uskakujem“ odskočí tak meter dozadu a životy si jednoducho neodpočíta. Toto neplatí na kúzla ani schopnosti. Úskok môže použiť každé 1 x za 2 hodiny.<br /><br />Oprav zbroj<br />Kvôli tomu, že zbojníkom nemá kto opravovať zbroje (pokiaľ niekoho zoženú, je to ich prínos), naučili sa ich opravovať sami. Túto schopnosť môže využiť len mimo boja. Zbroj si musí vyzliecť a veľmi dobre zahrať jej opravu. Opravou sa doplní polovica bodov z pôvodného počtu. Opravovať môže 2x za deň.<br /><br />2. úroveň<br />Bola<br />V prípade, že zbojníkovi uteká obeť dokáže po nej vrhnúť bolu a obeť tak spomalí. Obeť však nesmie byť ďalej ako 10 metrov, zbojník musí zakričať „vrhám bolu“ 3 x zatočiť zbraňou nad hlavou a naznačiť ňou vrhnutie smerom k cieľu. Po tomto musí obeť zastať, zvaliť sa na zem, aspoň na 30 sekúnd, počas ktorých bude simulovať rozuzľovanie boli na nohách. Potom sa môže postaviť a utekať ďalej. Schopnosť je možné použiť 1 x za 4 hodiny. <br /><br />Skrytie v tieni<br />Ďalšou silnou schopnosťou zbojníka je skrytie v tieni. V prípade, že sa potrebuje pred niekým skryť, jednoducho sa postaví alebo skrčí za nejaký objekt (strom, herný stan, a pod) a nepohnute tam čaká. Nesmie byť však väčší ako objekt za ktorý sa chováva, nesmie sa schovávať za postavu a v prípade že svieti slnko, nesmú na neho dopadať slnečné lúče (to znamená že musí byť celý v tieni objektu za ktorý sa skrýva) a musí byť minimálne na 10 metrov (tým sa myslí moment skovávania, ak by bol už skrytý a postava by išla oko napríklad na 3 metre už ho nevidí) od najbližšej postavy (v prípade že by nebol, táto postava ho vidí) a povie „skrývam sa v tieni, nevidíš ma“. V tej chvíli je pre všetkých neviditeľný (pokiaľ nemajú na to nejakú schopnosť, amulet alebo podobné veci na to určené)! Schopnosť môže využiť 1 x za 4 hodiny.<br /><br />3. úroveň<br />Prekvapivý úder<br />Zbojníci zakladajú svoje úspechy na rýchlych a prekvapivých útokoch. Takže prvý (vždy len prvý) platný zásah ktorý dá zbojník protivníkovi ho zraní okrem útoku zbojníkovej zbrane ešte za ďalšie 4 životy (teda jeho bonus do útoky zbrane je +4). Stačí ak pri tom zakričí „môj útok je silný a prekvapivý“ a zakričí za koľko zraňuje.<br />Túto schopnosť môže použiť 1 x za 6 hodín. <br /><br />Odlákaj pozornosť<br />Túto schopnosť nemožno použiť priamo v boji. Pokiaľ zbojník potrebuje odlákať niekoho pozornosť (napríklad sa potrebuje dostať na strážené miesto a pod.) zoberie konár, alebo kamienok a hodí ho smerom ktorým chce odlákať postavu a zakričí „odlakavam Tvoju pozornosť“ (pozor aby ste niekoho netrafili). Od tejto postavy však musí byť vzdialený aspoň na 10 m a postava nesmie v tej chvíli na neho útočiť. Ak splnil tieto podmienky, postava sa musí daným smerom vybrať asi tak na 70 metrov, tam sa poriadne rozhliadnuť a potom sa môže vrátiť. Odlákanie pozornosti môže použiť 1 za 5 hodín. <br /><br />4. úroveň<br />Pasca<br />Zbojník dokáže nastražiť rôzne pasce, napr. aj pascu na medvede (kovové čeľuste) a pritom vôbec nemusí slúžiť na to, aby sa do nej chytil medveď, ale aby lapila nejakého chudáka. Musí na zem položiť prázdnu umelohmotnú fľašu, bez vrchnáka. Takáto fľaša musí byť označená modrou páskou (je to kvôli tomu aby postava dokázala odlíšiť či je to naozaj „pasca“ alebo len odpad - fľaša pohodená v lese nejakým blbcom). Fľašu môže zbojník zakryť listami tak, aby nebola vidieť. Potom keď na pascu postava stúpi, je zranená za 3 životy a nemôže sa pohnúť z miesta, pokiaľ ju nevyslobodí iná postava. A ak ju aj vyslobodí, musí krívať na zranenú nohu a nemôže utekať až kým jej nohu niekto dôkladne neošetrí a nevylieči (poprosím zbojníkov, aby si pamätali kam dávajú svoje pasce a aby ich potom po hre zobrali, nechceme v hernej lokácii po sebe nechať odpadky!!). Zbojník môže robiť rôzne pasce v rôznom prevedení a s rôznym účinkom, avšak každú pascu musí konzultovať s organizátorom a ten mu ju musí schváliť a stanoviť jej účinky. Zbojník za deň dokáže rozmiestniť toľko pascí, na ktorej je sám úrovni. <br /><br />Odolnosť na jedy (stredné)<br />Každý zbojník na tejto úrovni sa stáva imúnny na ľahké a stredné jedy. Schopnosť je automatická a neobmedzená! Útočníkovi len treba povedať „Tvoje jedy ma nezrania“ pokiaľ to však niesu silné jedy.<br /><br />5. úroveň<br />Špecializácia na zbraň – stredné a vrhacie zbrane +2 (od útoku).<br /><br />Predstieraj náhlu smrť<br />Schopnosť ktorá je podobná klerikovmu kúzlu „predstieraj smrť“. V prípade keď zbojník potrebuje predstierať smrť, zje koreň kvetiny zvanej „baheník tlmivý“(len zbojník vie ktoré časti korienka rozžuť aby ho to nezabilo) a  okamžite sa zosunie k zemi bez akejkoľvek známky života – nebije mu srdce, nedýcha, nevydáva žiadne zvuky, v podstate nikto nedokáže zistiť jeho životné funkcie a pre všetkých pôsobí ako mŕtvola (samozrejme že v momente keď si dáva zbojník do úst koreň sa nikto nesmie na neho pozerať aby nevzbudil podozrenie). Počas tohoto stavu sa dokáže zbojník kedykoľvek prebrať k životu a jeho funkcie sa opäť obnovia, avšak obnovia sa aj sami automaticky po 2 hodinách. Počas tejto doby pôsobí zbojník ako skutočne mŕtva a nikoho ju nenapadne pre istotu prebodávať, štvrtiť a podobne!! Schopnosť môže použiť 1x za 12 hodín.<br /><br />6.úroveň<br />Útek<br />Ak je so zbojníkom už naozaj zle tak zvolí útek, pri ktorom zakričí „nôžky moje bežte preč“ utečie všetkým prenasledovateľom, respektíve, tí už ho nemôžu ďalej prenasledovať, proste im ušiel. Túto schopnosť môže zbojník využiť maximálne 1x za 6 hodín a nemôže byť pri tom zviazaný, zajatý alebo bezprostredne obkľúčený!!!</p>";
