var sam="<h3 onclick=\"document.getElementById('sam').innerHTML=sama\">Šaman:</h3><p>Aj o šamanoch sa dá hovoriť ako o čisto barbarskom povolaní. Často sa stávajú vodcami kmeňov a sú v nich veľmi uznávaný aj ako duchovný predstavený. Majú veľmi kladný vsťah k prírode, kde nachádzajú rôzne plody, bylinky, hrýbiky a veľa iných prísad vďaka ktorým sa dostávajú do tranzu a za pomoci ktorých vyrábajú aj rôzne odvary. Ich čary z veľkej časti pôsobia na priamu podstatu duše. Rôzne príbehy tvrdia že mocný šaman dokáže ukradnúť aj dušu, alebo sa prevteliť do čierneho pantera alebo medveďa. Prinášajú rôzne obete svojim bohom, mnohokrát aj ľudské (alebo iné rasy). <br /><br />Životy: 4, za úroveň +2<br />Zbrane: dýka, vrhacia dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 2-6<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>15 many</td><td>24 many</td><td>31 many</td><td>47 many</td><td>62 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>78 many</td><td>91 many</td><td>111 many</td><td>140 many</td><td>165 many</td></tr></table><br /><br />Schopnosti:<br /><br />0.úroveň<br />Tanec duchov <br />Šaman začne divoko poskakovať a tancovať ponorený do hlbokého tranzu. Tancuje asi tak minútu, aj viac keď chce. Pritom volá: „Predkovia moji, dajte silu mojej zbrani.“ Po správnosti by to mal povedať tak 10x. Ako náhle dotancuje má o +1 väčší útok pre boj z blízka na 10 minút. Schopnosť môže použiť len na seba 1 x za 2 hodiny.<br /><br />1.úroveň<br />Prekliatie (slabé)<br />Šaman zdvihne svoju zbraň, ukáže na jednu postavu, ktorá stojí blízko aspoň v okruhu 3 metrov. Potom povie: „Nech ta prekliatie pohltí.“ Potom je postava zranená za jeden život a dostáva postih –1 do útoku, v prípade kúzelníckych povolaní nestráca postih do útoku ale stráca 4 many (do skončenia kliadby). Prekliatie trvá zhruba 2 hodiny. Dá sa použiť 1 x za 4 hodín.<br /><br />4.úroveň<br />Bylinky a lesné plody<br />Svojim životom v lese sa šaman naučil využívať všetky možne byliny a plody ktoré mu les dáva. Stačí ak v správnej kombinácii 30 minút povarí dané ingrediencie (samozrejme že zvlášť ingrediencie na jed zvlášť na liečenie a pod.) a z tých následne vytlačí príslušný extrakt stredne silný.<br />Liečivý extrakt (z bylín) (1 dávka = 3 použitia) -  ak ho ranený vypije tak sa mu behom 30 minút doplní 8 životov alebo si ho môže naliať priamo do rany a tým sa mu doplnia za 5 minút  4 životy.<br />Jedový extrakt (z plodov) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane čí hrot šípu (žiadne kladivá a palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). V jedle či vode účinkuje za 5 minút ak je na zbrani, tak okamžite. Obeť si po dobu 10 minút za každé 2 uplynuté minúty odpočíta 1 život (ak bola použitá zbraň tak si na začiatku odpočíta aj jej zranenie). Obeti však treba oznámiť že ste ňu použili stredný jed a jeho účinky.<br />Uspávací extrakt (z ihličia) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla alebo pitia,  (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 5 minút ak sa vypije samostatne, tak okamžite. Obeť si následne pospí zhruba 30 minút. Treba jej však oznámiť že ste na ňu použili uspávadlo strednej sily a jeho účinky.<br />Halucinogénny extrakt (z hríbov) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 10 minút ak sa vypije samostatne, tak za 5 minút. Obeť následne musí zhruba 20 minút predstierať najrôznejšie vidiny či halucinácie. Treba jej však oznámiť že ste na ňu použili halucinogén strednej sily a jeho účinky.<br /><br />Každý deň môže šaman navariť max. jednu dávku z každého extraktu.<br /><br />5.úroveň<br />Prekliatie (stredné)<br /> Šaman zdvihne svoju zbraň, ukáže na jednu postavu, ktorá stojí blízko aspoň v okruhu 3 metrov. Potom povie: „Nech ta neskonalé prekliatie pohltí.“, a od tej chvíle má daná postava –1 stráca do útoku (v prípade kúzelníckych povolaní má o tretinu menšiu manu ako je jej plný stav) a –1 do obrany (postava dostane zásah za 2 a odpočíta si 3). Navyše sa postava stáva veľmi nemotornou, v ničom sa jej nedarí, je bez nálady, občasne jej vypadávajú veci z rúk, zakopáva a pod.(treba to veľmi dôsledne zahrať!!).Prekliatie trvá dokedy ho sám šaman nezruší, prípadne jeho smrťou, alebo pokiaľ ho nezlomí niekto kto to dokáže. Dá sa použiť 1 x za 4 hodín.<br /><br />Dýka šoku <br />Šamanova dokáže svojou dýkou (aj vrhaciou dýkou) narábať tak majstrovsky že ak bodne či sekne (trafí) postavu a pritom povie „šok z mojej dýky ta neminie“ zasiahnutá postava musí spadnúť na zem a asi 1 minútu sa musí triasť ako keby dostala šok, navyše stráca 2 životy. Schopnosť môže použiť 1x za 2 hodiny.<br /><br />Kúzla:<br /><br />0.úroveň<br />Úder (kuzlo- 3 many)<br /><br />Šaman vytiahne nosič (penovú loptičku, či inú vec ktorá sa normálne používa na fireballi), povie: „Úder!“ potom môže nosič hodiť a ak sa trafí, postava je zranená za 2 život.<br /><br />Smiech (kúzlo- 5 many)<br />Šaman hodí nosič do postavy a povie „smiechoty“ a postava v tom momente dostane smiechoty a musí sa po dobu 3 minút šialene rehotať. Popri tom však smie bojovať, ale má postih –1 do obrany, takže ak dostane zásah za 2 životy, odpočíta si 3. Postava v tomto stave nesmie rozprávať (čiže ani kúzliť!!).<br /><br />1.úroveň<br />Výr duší (kúzlo- 6 many)<br />Šaman sa začne točiť okolo seba a volať: „Duše, chráňte ma!“ Musí to povedať 3x po sebe. Pritom sa musí i 3x zatočiť a potom okolo neho začnú lietať tiene a duše jeho predkov. Ako náhle sa k nemu niekto priblíži je zranení od tieňov za 3 životy. Tieňe zraňujú každého v okolí 3 metre, trvajú 5 minút a zraňujú najprv 3 životy a potom každých 10 sekúnd strávených v blízkosti (do 3 metrov) šamana za 2 životy.    <br /><br />Spomalenie (kúzlo- 8 many)<br />Šaman zakričí „spomaľujem Ťa“ a ukáže prstom alebo palicou na postavu ktorá od tej chvíle musí hrať spomalenie (nesmie bežať, príliš rýchlo sa hýbať,.) po dobu 2 minút.<br /><br />2.úroveň<br />Odhaľ dušu (kúzlo- 10 many)<br />Šaman sa začne uprene pozerať na jednu postavu, ktorá je aspoň od neho vzdialená 2 metre. Potom povie: „Duša čistá, duša špinavá, duša zlá, duša dobrá, duša prezraď sa.“ A pri tom musí ukázať na postavu, na ktorú zosiela kúzlo. Potom mu musí postava povedať potichu, najlepšie pošepkať do ucha, stav svojho presvedčenia. Ale nie úplné, len či je dobré, zlé, alebo neutrálne, nič viac.<br /><br />Jedový šíp (kúzlo- 9)<br />Šaman vrhne nosič, ktorý sa zmení na letiaci šíp napustený stredným jedom. Stačí ak zakričí „jedový šíp“ a vrhne nosič. Samotný šíp zraní za 2 životy a jed po dobu 3 minút za každú minútu 1 život.<br /><br />Únik duše (kúzlo- 14 many)<br />Šaman zvolá: „Duša uteč, duša leť preč!“ Následne jeho duša uletí do domovských sfér jeho predkov. Potom je po dobu 5 minút zraniteľný vždy len za 1. I keď doň ho niekto sekne s útokom za 6, tak len za 1.život, to platí aj pre útočné kúzla.<br /><br />3.úroveň<br />Dotyk duší (kúzlo- 20 many)<br />Šaman musí ukázať na svoju obeť svojou zbraňou a povedať: „ Dotýkam sa dušou duše.“ Týmto kúzlom sa dajú lámať kliatby, kúzla, posilnenia od lektvarou. Či už svojim priateľom či nepriateľom.<br /><br />Premena na medveďa alebo čierneho pantera. (kúzlo- 18 many)<br />Šaman zvolá: „Lesní medveď (alebo čierny panter), som tvoj brat a otec.“ Potom sa jeho telo zmení na medveďa alebo čierneho pantera. Ak je medveď, jeho útok je za 5 životov (útočí drápami, teda rukami) a má zbroj za 5 životov. Ak je panter, jeho útok je za 3 životy (útočí drápami, teda rukami) a má zbroj za 3 životy a v prípade úniku ho nikto nedobehne. Kúzlo trvá len 5 minút, no po túto dobu šaman musí chodiť skrčení, nerozpráva a chová sa ako medveď či panter.<br /><br />Smrtiaci dym (kúzlo- 19 many)<br />Šaman hodí nosič o zem a zakričí „Smrtiaci dym“ a všetky postavy (okrem šamana) v okruhu 5 metrov sú zranené za 3 životy – nie však zo zbroje (to platí aj pre tých ktorý by sa do kruhu chceli dostať) a každý kto v tomto kruhu zostane bude zranený každých 10 sekúnd za ďalšie 2 životy. Nosič však môže hodiť maximálne 3 metre od seba.<br /><br />4.úroveň<br />Premena na havrana (kúzlo – 20 many)<br />Šamanská viera je založená na spiritualizme a animalizme. Preto sa dokážu premeniť na havrana, s červenými žiariacimi očami - zraňuje za 1 život (dotyk ruky), je možné ho len zostreliť alebo ho trafiť aj inou zbraňou keď havran útočí. Stačí ak rozpaží ruky a povedia „duša a telo havrana, sú i mojou dušou a telom“. Po zmenení na havrana šaman vyzerá a musí sa správať ako havran. Dokáže však hovoriť ľudskou rečou a taktiež jej rozumie ale nedokáže kúzliť. Kúzlo vydrží 15 minút, šaman sa však do svojej podoby môže vrátiť aj skorej.<br /><br />Vresk banší (kúzlo- 23 many)<br />Pri zosielaní šaman povie „banšiným vreskom vás zaženiem“ a začne kvílivo kričať a škrečať. Všetky postavy (aj šamanoví spojenci) v okruhu 50 metrov, ktoré kvílenie začujú v panike utekajú čo naďalej. Šaman nesmie kvíliť dlhšie ako 30 sekúnd.<br /><br />5.úroveň<br />Montiho čardáš (kúzlo - 6 many za každú postavu)<br /> Pri zosielaní šaman zvolá: ,,Pokiaľ melódia bude znieť, neprestaneštancovať v nej.\" Potom označí postavy ktoré začaroval, max. však toľko postáv aká je sám úroveň, nesmú byť však od šamana ďalej ako 10 metrov, a začne si spievať, pohmkávať, či vypiskovať melódiu (prípadne ak ma píšťalku, alebo nejaký hudobný nástroj a začne na ňom hrať). Postavy zasiahnuté týmto kúzlom sa šialene roztancujú. Ledva udržia zbraň v rukách, preto majú -1 k útoku a –1 k obrane (keď sú zranené za dva odpočítajú si 3 životy). Nevedia sa pohybovať tam kam chcú. Len tancujú do kruhu, ako zmyslov zbavené. Kúzlo trvá pokým šaman neprestane pískať alebo spievať. Počas tohto kúzla šaman nedokáže zosielať žiadne ďalšie kúzla.<br /><br />6. úroveň<br />Mlč (kúzlo- 17 many)<br />Postava onemie alebo bude vydávať nejaký neurčitý zvuk (napr. chrŕŕ). Postava už nikdy nebude vedieť hovoriť, iba ak nájde niekoho, kto bude schopný odkliať ju. Šaman pri zosielaní kúzla sa musí postavy chytiť a povedať: ,,Zväzujem ti jazyk tvoj, nevyslovíš slovo stoj čo stoj.“<br /><br />Kocovina (kúzlo- 13 many)<br />Pri zosielaní šaman zvolá: ,, Budeš strašne opitý, aj keď si nič nevypil.“ Postava bude 30 minút strašne opitá, nebude poriadne rozmýšľať, má zníženú motoriku, zlú artikuláciu, neútočí a má –1 do obrany a –1 do útoku.</p>";

var dru="<h3 onclick=\"document.getElementById('dru').innerHTML=drua\">Druid:</h3><p>Zo všetkých povolaní preukazujú najväčšiu spätosť s prírodou práve druidi. Žijú vo svojich posvätných dubových hájoch kde prinášajú aj svoje obety, ďaleko od civilizácie. Ako najvyššie božstvo vyznávajú Matku Zem z ktorej všetko vzišlo a ktorá ich živý. Z nej tiež čerpajú silu a za pomoci živlov ovládajú svoju mágiu. Ichnajväčší sviatok je na jar, keď sa celá príroda zobúdza po chladnej zime. Za odmenu sa starajú o všetku populáciu živočíchov a rastlín ktoré v prírode môžeme nájsť. Dávajú pozor aby nikto nerušil kľud lesov, neničil porasty alebo nezabíjal zver. <br /><br />Životy: 4, za úroveň +2<br />Zbrane: dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 3-5<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>15 many</td><td>23 many</td><td>30 many</td><td>46 many</td><td>61 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>77 many</td><td>90 many</td><td>110 many</td><td>138 many</td><td>164 many</td></tr></table><br />Schopnosti:<br /><br />0.úroveň<br />Tanec zvierat <br />Druid začne divoko poskakovať a tancovať ponorení do hlbokého tranzu. Tancuje asi tak minútu, aj viac keď chce. Pritom volá: „Zvieratá, moji sluhovia a bratia v lese, dajte silu mojej zbrani.“ Po správnosti by to mal povedať tak 10x. Ako náhle dotancuje má o +1 väčší útok pre boj z blízka na 5 minút. Schopnosť môže použiť len na seba a 1 x za  4 hodiny.<br /><br />1.úroveň<br />Zviaž<br />Druid zdvihne svoju zbraň, ukáže na jednu postavu, ktorá stojí blízko aspoň v okruhu 3 metrov. Potom povie: „Les ťa spúta!“ Potom postavu bleskurýchlo obmotajú okolité rastliny za nohy a ruky tak že sa nemôže pohnúť. Takto zotrvá 5 minút. Po túto dobu je možné na postavu útočiť, ale nieje to zrovna fér. Obeť sa môže brániť a aj útočiť no nesmie sa pohnúť z miesta. Rastlinky je možné aj odťať ostrou zbraňou (žiadne kladivá či palcáty) avšak treba aspoň 7 sekov na oslobodenie jednej nohy. Je možné použiť 1 x 4 hodiny.<br /><br />4.úroveň<br />Telo stromu <br />Druid, ktorý sa potrebuje ukryť sa dokáže schovať priamo do stromu. Musí objať strom (strom musí mať aspoň 30 cm v priemere, inak schopnosť nebude fungovať!!) a povedať „strom, príjmy moje telo do svojho“ potom strom vtiahne druida priamo do seba a nie je vidieť, lebo je uprostred stromu. Durid sa počas trvania schopnosti musí stále držať stromu, ostatné postavy ho nevidia, no ak boli v čase použitia tejto schopnosti od druida na menej než 10 metrov môže ich napadnúť tento strom vyťať (ak boli ďalej než 10 metrov, strom rúbať nemôžu, jednoducho si myslia že im druid ušiel) a presvedčiť sa či sa druid neskrýva v jeho korune (pre vyťatie stromu musia do jeho kmeňu seknúť buď sekerou 20 krát alebo mečom 40 krát, inou zbraňou sa im to nepodarí, navyše ak budú používať na sekanie meč tak ten sa im otupí tak že až do najbližšieho nabrúsenia u kováča/alebo použitia tejto schopnosti, budú mať –1 do útoku mečom). Po vyťatí stromu druid zo stromu automaticky vypadne. Inak schopnosť trvá dokedy druid sám nevylezie zo stromu. Schopnosť sa dá použiť 1x za 3 hodiny.<br /><br />Mravce <br />Druid si čupne jednou rukou sa dotkne zeme a druhou rukou ukáže na postavu (postavy) a zvolá ,,mravce“. Táto postava (postavy) okamžite pocíti svrbenie na celom tele a nutkanie sa škriabať. Svrbenie pociťuje 5 minút a po túto dobu má postih – 1 do útoku a –1 do obrany. Schopnosť môže použiť 1x za 2 hodiny a môže ju naraz použiť na toľko postáv aká je sám úroveň.<br /><br />5.úroveň<br />Vládni prírodným veciam<br />Táto schopnosť funguje iba v krízových situáciách (prípadne aj v iných prípadoch keď druid bude potrebovať s niečím pomôcť, to však bude záležať od organizátora), napr. ak je druid sám zavalený v jaskyni alebo ak ho privalil konár, či sa zamotal to obrovskej pavučiny a nikto mu nemôže v tej chvíli pomôcť. Druid sa musí plne sústrediť a úprimne prosiť matku prírodu o pomoc, následne sa dotkne danej veci prírodného materiálu (drevo, kameň, pavučina) a tá sa buď roztrhá, odvalí alebo rozsype. Nevzťahuje sa na kovy, tekutiny (okrem vody) a magické predmety. Schopnosť môže používať neobmedzene.<br /><br />6.úroveň<br />Životy stromu<br />Vďaka tejto schopnosti si dokáže druid doplniť svoje životy (nie však nad rámec svojich plných životov) zo stromu. Stačí ak aspoň na 2 minúty obime akýkoľvek strom hrubší ako 30 cm a zvolá „priateľ strom, podaruj mi časť z tvojho života“. A od tejto chvíle sa doplnia druidovi 3 životy. Túto schopnosť môže druid použiť 1x za 4 hodiny pri čom každý strom môže objať len raz!<br /><br />Kúzla:<br /><br />0.úroveň<br />Osi (kúzlo- 3 many)<br />Druid vytiahne nosič (penovú loptičku, či inú vec ktorá sa normálne používa na fireballi) a musí povedať: „Osi útok, 1 minútu ťa prenasleduje osí roj!“ potom môže nosič hodiť a ak sa trafí, postava je zranená za 2 život a navyše sa 1 minútu správa ako keby ho napadol roj ôs.<br /><br />Tepelná vodivosť (kúzlo- 6 many)<br />Pokiaľ dostane druid  platný zásah a povie, „teplom môjho tela, rozžeravím Tvoju zbraň“ útočník musí zbraň pustiť a po dobu 30 sekúnd ju nemôže vziať lebo je príliš horúca (je jedno či je z kovu alebo dreva). Po uplynutí  tejto doby si zbraň môže zobrať a narábať s ňou ako predtým.<br /><br />1.úroveň<br />Lesná strela (kúzlo- 5 many)<br />Druid zvolá: „Lesná strela.“ Potom ak vrhne nosič a tráfí sa do niekoho, je zranení za 4 životy.<br /><br />Ochrana chrbta (kúzlo- 6 many)<br />Druid pred bojom zošle na seba toto kúzlo ktoré trvá 10 minút a po dobu tohto času, každý zásah ktorý dostane do chrbta či už je to zbraňou alebo útočným kúzlom ho bude zraňovať len za 1 život, nech je ich útok akýkoľvek. Pre zoslanie tohto kúzla stačí keď driud povie „ochrana pre môj chrbát“ a dotkne sa oboch ramien.  <br /><br />2.úroveň<br />Smršť (kúzlo- 8 many)<br />Druid ukáže na svoju obeť a povie: „Smršť lesa za 5 životov a ustúp o 3 metre!“ Potom sa na obeť vrhne studený vietor, mrholenie a krupobitie. Pri tom je postava zranená za 5 životy, musí sa skrčiť a ustúpiť 3 metre vzad.<br /><br />Lesný strážca (kúzlo- 11 many)<br />Druid si vždy pred spánkom (aj cez deň) môžu privolať lesného strážcu, čo je nejaké malé lesné zvieratko ktoré počas druidovho spánku vykonáva stráž aby sa mu nič nestalo, resp. keby ho chcel počas spánku niekto okradnúť či zabiť, lesný strážca ho včas zobudí. Navyše lesný strážca sa nedá zabiť a ani sa na neho kúzliť alebo mu čokoľvek spraviť. Pred spaním musí driud 3x po sebe povedať „lesný strážca buď mi po celú noc na pomoci“. Na toto kúzlo si treba doniesť nejaké malé plyšové zvieratko, aby však malo 10 až 20 cm a vždy pred spaním ho umiestniť tak, aby ho prípadná nechcená návšteva uvidela napr. keď vojde do stanu. Akonáhle toto zvieratko uvidí, musí odísť, alebo zobudí druida a musí počkať, kým sa pripraví na boj (mimo stanu), alebo ak by mu chcel niečo ukradnúť musí ho najprv zobudiť!!! V prípade, že druid toto zvieratko mať nebude, nemusí ho budiť a môže spraviť čo chce, ale ak tam zvieratko je a o niečo sa pokúsi je to neplatné!!!<br /><br />Pomoc lesa (kúzlo- 13 many)<br />Ak druid ukáže na blízko stojacu postavu a zvolá: „Les mi pomôže, teba zničí!“ Postava sa musí otočiť a priskočiť k najbližšiemu stromu (pokiaľ nieje žiadny strom v blízkosti 10 metrov, tak sa toto kúzlo nedá použiť), pretože ten ju napadol. Postava nesmie pred ním utiecť. Potom s ním musí bojovať aspoň 2 minúty, a trochu záživne, akčne a efektívne. Po skončení boja je postava zranená za 4 životy. Ak by ho pri boji so stromom napadol ešte niekto iný, musí sa brániť proti obom a patrične to aj zahrať. V prípade, že by sa bránil len proti postave a na strom by sa vykašlal, tak po tomto súboji by mu strom spôsobil zranenia za 8 životov (to mu treba oznámiť dodatočne)!<br /><br />3.úroveň<br />Oslava lesa (kúzlo- 20 many)<br />Ak je druid v lese, stačí ak si kľakne pred nejaký strom a 10x sa mu ukloní. Pritom musí zakaždým povedať: „Les som tvoja zbraň.“ Potom stačí ak sa niekoho dotkne a povie: „Posiela ma les.“ Je postava ktorej sa dotkol zranená za 7 životov. Je to možné použiť len na jednu postavu počas doby trvania, ktorá je 15 minút, ak do tejto doby kúzlo nepoužije, samo sa rozplynie.<br /><br />Víchor (kúzlo- 18 many)<br />Druid hodí nosič o zem a zakričí „Silný víchor“ a všetky postavy (okrem druida) v okruhu 5 metrov sa musia posunúť tak, aby boli najmenej 5 metrov smerom od druida a následných 30 sekúnd sa k nemu nedokážu priblížiť (držia si oči, kričia od bolesti, ledva sa držia na nohách) a strácajú 2 životy – nie však zo zbroje (to platí aj pre tých ktorý by sa do kruhu chceli dostať). Nosič však môže hodiť maximálne 3 metre od seba.<br /><br />Premena (kúzlo- podľa premeny)<br />Druid zvolá: „Chcem mať inú tvár, chcem mať iné telo.“ Potom záleží na čo sa chce premeniť. Potom sa zmení na dané zviera na 5 minút, no kúzlo môže skončiť aj skôr, ako chce<br /><table cellpadding=\"5px\"><tr><td>Myš</td><td>8 </td><td>many</td><td>nedá sa na ňu útočiť</td></tr><tr><td>Ryba</td><td>8 </td><td>many</td><td>nedá sa na ňu útočiť </td></tr><tr><td>Had</td><td>12 </td><td>many</td><td>zraňuje za 1 + 1 život slabým jedom (dotyk oboch rúk)</td></tr><tr><td>Vlk</td><td>18 </td><td>many</td><td>zraňuje za 3 životy (rukami),má zbroj za 3 životy, dokáže utiecť </td></tr><tr><td>Sokol</td><td>14 </td><td>many</td><td> zraňuje za 1 život (dotyk ruky), je možné ho len zostreliťalebo ho trafiť aj inou zbraňou keď havran útočí</td></tr></table><br /><br />4.úroveň<br />Premena na kameň (kúzlo- 12 many)<br />Druid dokáže akúkoľvek vec ktorej sa dotkne premeniť na 30 minút na kameň (treba si nejaký kameň o priemere aspoň 5 cm nosiť so sebou, lebo nie vždy bude nejaký po ruke). Stačí len ak sa jej dotkne a povie „(názov veci) čo držím, nech na kameň sa hneď zmení“. A od tej chvíle je akákoľvek vec premenená na kameň, má tvar kameňa a aj jeho vlastnosti.<br /><br />5.úroveň<br />Hmla  (kúzlo - 6 many za každú postavu)<br />Pri zosielaní druid vystrie ruky k nebu, 3x sa otočí okolo seba a zvolá: ,,Nech sa na vás znesie hustá hmla.\" Potom označí postavy ktoré začaroval, max. však toľko postáv aká je sám úroveň, nesmú byť však od druida ďalej ako 10 metrov. Postavy zasiahnuté týmto kúzlom vidia okolo seba len hustú hmlu všade kam sa pohnú po dobu 5 minút avšak do vzdialenosti 1 metra vidia normálne. Preto sa hýbu veľmi pomaly a útočiť môžu až keď sa k postave priblížia na 1 meter. Navyše majú postih -1 k obrane (keď sú zranené za dva odpočítajú si 3 životy).<br /><br />Ochrana pred živlami (kúzlo – na seba 16 many, na inú postavu 22 many)<br />Druid dokáže na seba alebo kohokoľvek iného začarovať ochranu pred jednotlivými živlami a tým sa stáva imúnny po dobu 30 minút na všetky kúzla či zranenia daného živlu (až na malé výnimky). Stačí ak položí obe ruky niekomu na hlavu, prípadne sebe a povie: „ živel vody (ohňa,..), chráň svojho služobníka“. Len druid dokáže postupne na seba zoslať ochranu pred každým živlom. Na iné postavy môže začarovať vždy len jeden živel a ďalší až ochrana toho prvého pominie.<br /><br />6.úroveň<br />Kôrová koža (kúzlo- 14 many)<br />Druid sa postaví medzi dva stromy, na každý z nich položí ruku, zotrvá tak asi 2 minúty a potom zvolá „nech je moja koža tvrdá ako tá vaša“. A od tejto chvíle sa druidová koža premení na kôru, vďaka čomu dokáže absorbovať prvý platný zásah zbraňou alebo nosičom pri útočnom kúzle, prípadne aj odolať niektorým schopnostiam (ako napr. osie hniezdo, hod skalou a pod). Po prvom takomto zásahu sa druidová koža premení späť, prípadne sa premení sama od seba po uplynutí 30 minút od vykúzlenia.</p>";

var zkl="<h3 onclick=\"document.getElementById('zkl').innerHTML=zkla\">Zaklínač:</h3><p>Povaha zaklínača sa nedá jednoznačne popísať. Niektorý sú dosť utiahnutý a nevyhľadávajú spory. Ale sú aj taký, ktorých vyslovene teší keď môžu niekomu urobiť zle. Každopádne sú veľmi silný kúzelníci ktorý využívajú predovšetkým mentálnu mágiu, ktorá dokáže s postavou narobiť pekné zmätky a už nejeden úbožiak okúsil silu ich zaklínadiel. Vždy keď napríklad v dedine vyskytol mor, alebo niekomu vyhorel dom, dávali to za vinu zaklínačovi ktorý žil v ich blízkosti a snažili sa ho zabiť alebo aspoň vyhnať do divočiny. Mnohokrát v tom boli neprávom a tak sa navždy rozhodli opustiť civilizáciu a utiahli sa do jaskýň, močiarov alebo temných lesov. Preto sú poväčšine samotári ktorý už nikomu neveria, a svoju pravú totožnosť utajujú. Takže sa vám môže stať že s vami v skupine cestuje zaklínač a ani o tom neviete. <br /><br />Životy: 4, za úroveň +2 <br />Zbrane: dýka, palica na obranu, iné nepoužíva!<br />Zbroje: nepoužíva<br />Štíty: nepoužíva<br />Presvedčenie: 4-7<br /><table cellpadding=\"5px\"><tr><td>Úroveň</td><td>0.</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td></tr><tr><td>Úroveň</td><td>14 many</td><td>21 many</td><td>29 many</td><td>40 many</td><td>53 many</td></tr><tr><td></td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td></tr><tr><td></td><td>68 many</td><td>85 many</td><td>104 many</td><td>125 many</td><td>147 many</td></tr></table><br /><br />Schopnosti:<br /><br />0.úroveň<br />Zlom zaklínadlo (slabé) <br /> Zaklínač dokáže zlomiť kúzlo, kliadbu, prekliatia ktoré na neho či na inú postavu niekto zoslal. Dokáže týmto ničiť postihy aj bonusy ktoré má niektorá zbraň. Stačí ak na postavu zasiahnutú kúzlom alebo prekliatu zbraň položí obe ruky a zvolá: „Lámem toto zaklínadlo, kliatbu či kúzlo.“ Potom sa kúzlo či iná vec skončí. Dokáže to 1x za 4 hodiny.<br />1.úroveň<br />Skamenenie <br />Zaklínač sa musí svojou palicou alebo rukou dotknúť nepriateľa a musí pri tom zvolať: „Premeň sa na kameň.“ Potom dotyčná postava skamenie, nemôže sa hýbať, bojovať a ani rozprávať. Každý kto sa jej dotkne rukou alebo zbraňou tiež skamenie. V takomto stave na ňu neplatia žiadne kúzla, schopnosti alebo zbrane. Skamenenie trvá 10 minút. Schopnosť možno použiť 1 x za 4 hodiny<br /><br />2.úroveň<br />Uhranutie<br />Stačí ak sa zaklínač bude na niekoho uprene pozerať tak 2 minúty, potom ku nemu príde, zlomí pri ňom nejakú halúzku a pošepká mu ,,Nech ťa trápi večný žiaľ, za všetko čo si vykonal.\" od tejto chvíle bude postava 30 minút v stave kedy ju prepadajú náhle stavy úzkosti, smútku, bezcennosti,  nebude rozmýšľať , nebude vykazovať žiadnu namáhavú činnosť a bude často zvracať. Nemôže ani útočiť, ale brániť sa môže s tým, že bude mať postih do obrany –1 (ak dostane zásah za 2 životy, odpočíta si 3). Schopnosť môže použiť 1x za 5 hodín.<br /><br />3.úroveň<br />Uspanie<br />Pokiaľ sa zaklínač na niekoho uprene a dlho pozerá (zhruba 2 minúty a nesmie byť od tejto postavy ďalej ako 5 metrov) a následne mu ukáže na šnúrke (asi ta 20 cm dlhej) zavesený kamienok s ktorým mu zakýva pred očami (postava sa musí na kamienok pozrieť) a luskne prstami tak postava v momente zaspí tuhým spánkom na dobu 15 minút alebo dokedy ju niekto nezobudí (budenie však musí trvať aspoň minútu). Schopnosť môže použiť 1x za 4 hodiny.<br /><br />4.úroveň<br />Zlom zaklínadlo (stredné) <br />Zaklínač dokáže zlomiť kúzlo, kliadbu, prekliatia ktoré na neho či na inú postavu niekto zoslal. Dokáže týmto ničiť postihy aj bonusi ktoré má niektorá zbraň. Stačí ak na postavu zasiahnutú kúzlom alebo prekliatu zbraň položí obe ruky a zvolá: „Lámem toto mocné zaklínadlo, kliatbu či kúzlo.“ Potom sa kúzlo či iná vec skončí. Dokáže to 1x za 2 hodiny.<br /><br />5.úroveň<br />Zabudni čarovať<br />Pri zosielaní zaklínač musí jednu ruku vztýčiť k nemu a druhou rukou v ktorej má palicu ukázať na danú postavu a zvolať: ,,Myšlienky a kúzla sa ti pomiešali.“ A následne si kúzelník na ktorého zaklínač pri zosielaní ukázal nemôže na 3 minúty spomenúť na žiadne kúzlo, modlitbu a dokonca ani na tie schopnosti pri ktorých vykonávaní musí vravieť určitú formulku. Schopnosť môže použiť 1x za 3 hodiny.<br /><br />6.úroveň<br />Kliatba<br />Vďaka tejto schopnosti dokáže zaklínač prekliať každého kto je na nižšej úrovni ako je on sám. Stačí ak sa mu uprene pozrie do očí, ukáže na neho prstom a zakričí „preklínam Ťa za tvoje skutky“ a dodá akú konkrétnu kliatbu na neho zoslal (napr. smútok, hluchota, nemotornosť, smiech a podobné tohto typu - treba však dopredu konzultovať s organizátorom). Od tejto chvíle sa postava ktorá je zakliata musí správať tak ako jej zaklínač oznámil. Kliatba trvá dokedy ju sám zaklínač nezruší, prípadne jeho smrťou, alebo pokiaľ ju nezlomí niekto kto to dokáže. Dá sa použiť 1x za 4 hodiny.<br /><br />Kúzla:<br /><br />0.úroveň<br />Bolesť (kúzlo- 3 many)<br />Zaklínač hodí nosič a povie: „Prenikavá bolesť“ potom ak trafí nepriateľa, je zranení za 2 životy (nesmie však trafiť štít alebo zbraň).<br /><br />Ťarcha (kúzlo- 6 many)<br />Zaklínač sa dotkne palicou súperovej zbrane (prípadne inej veci) a povie „zvýš svoju hmotnosť 10 násobne“ Od tej chvíle bude musieť postava narábať s danou vecou ako by mala 10 x väčšiu váhu po dobu 2 minút, to znamená že jednoručnú zbraň musí držať v 2 rukách (a treba predstierať ich váhu a narábať s nimi pomaly), ťažké, strelné a tyčové zbrane a štíť ani len nezdvihne, a podobne. Po uplynutí  tejto doby si zbraň môže zobrať a narábať s ňou ako predtým. <br /><br />1.úroveň<br />Ohnivá šipka (kúzlo- 5 many)<br />Stačí ak zaklínač povie: „Ohnivá šipka“ pri tom hodí svoj nosič a ak sa trafí, je postava zranená za 4 životy. <br /><br />Piesok (kúzlo – 5 many)<br /> Zaklínač vie, že v boji treba siahnuť po všetkých prostriedkoch, aby človek prežil. Ak ukáže na postavu s ktorou bojuje a povie „piesok do očí!“ tak mu z prstov vyletí piesok ktorý zasiahne nepriateľa do očí, ten si po dobu 1 minúty musí pretierať oči a mať ich zavreté, tak že nevidí.<br />2.úroveň<br />Zmätenie (kúzlo- 12 many)<br />Každý na koho zaklínač ukáže prstom alebo palicou a povie„nastoľujem zmätok v Tvojej mysli“ bude po nasledujúcich 5 minút behať zmätene hore dole, bláznivo jačí, rozdávať údery všade na okolo (aj svojim musí dať minimálne 1 zásah!!!), prípadne odhodí zbraň a podobné veci (proste to zahrajte čo najlepšie)!<br /><br />Bojové zaklínadlo (kúzlo- 10/20 many)<br />Zaklínač len zvolá: „Zaklínadlá spútavam vás do tejto zbrane.“ Potom má po dobu 5 minút +1 k útoku zbraňou ktorú akurát zviera v ruke (tá zbraň nemusí byť jeho, začaruje zbraň svojho spolubojovníka), teda na tú ktorú toto kúzlo zoslal.<br />Ak by zakričal: „Zaklínadlá spútavam vás do tejto streli“ a následne by vrhol nosič a trafil ním postavu, tá je potom zranená za 6 životov. Pri tejto druhej možnosti si však odráta z many 20. <br /><br />3.úroveň<br />Zmena výzoru (kúzlo- 19 many)<br />Zaklínač musí prísť k postave, položiť na ňu ruku a povedať: „Mením tvoj výzor.“ Potom sa dotyčná postava mení na škaredého, zeleného, malého škriatka. Musí chodiť zhrbení, do útoku má postih –1 a musí plniť prania zaklínača (nesplní príkazy ktoré sú proti jeho záujmom či presvedčeniu alebo by mal ísť na istú smrť). Táto premena trvá iba 30 minút.<br /><br />Záchvev (kúzlo- 18 many)<br />Zaklínač buchne palicou o zem a zakričí „záchvev zeme pod vašimi nohami“ a všetky postavy (okrem zaklínača) v okruhu 5 metrov sú zranené za 2 životy – nie však zo zbroje (to platí aj pre tých ktorý by sa do kruhu chceli dostať), popadajú na zem a najbližších 30 sekúnd sa nedokážu postaviť.<br /><br />4.úroveň<br />Dvojník (kúzlo – 15 many)<br />Toto kúzlo môže zaklínač použiť, keď je prenasledovaný (v čase vyvolania nesmú byť jeho prenasledovatelia od neho na menej než 10 metrov). Stačí ak zvolá „môj dvojník bežal tam!“ a ukáže nejakým smerom. Postavy ktoré ho prenasledujú, začnú naháňať fiktívneho dvojníka. Po ubehnutí asi tak  200 metrov sa im pred očami dvojník rozplynie a oni zistia, že boli napálené.<br /><br />Davová psychóza-zmätok (kúzlo – 21 many)<br />Toto je kúzlo, ktoré pripomína detskú hru. Zaklínač toto kúzlo zakúzli na jednu postavu, ukáže na ňu a povie „prepadla si zmätku“ a táto postava musí začať chaoticky pobiehať po okolí a dotýkať sa iných postáv a hovoriť im, to isté čo jej povedal mág „prepadla si zmätku“ jednej a tej istej postavy sa môže dotknúť iba jeden krát a každá postava reaguje len na jeden dotyk (nie že prepadne zmätku vždy ako sa jej dotkne niekto iný). Postava pri tom pobehuje a kričí, máva rukami, ako keby prepadla panike, sama od seba nezaútočí ale v prípade že je napadnutá bude sa brániť ale má postih –1 do obrany). Po 5 minútach si sadne na zem a musí oddychovať aspoň minútu.<br /><br />5.úroveň<br />Čítanie v mysli (kúzlo- 20 many)<br /> Pri zosielaní zaklínač prejde obeti popred očami rukou a povie: ,,Tvoja myseľ nech je mojou.\" Obeť upadá do tranzu. Zaklínač jej počas tranzu môže položiť jednu otázku, na ktorú musí obeť plne odpovedať. Za každú ďalšiuotázku si musí zaklínač priplatiť 10 many. Po dočítaní z mysle si obeť nič s tranzu nepamätá. Pokračuje v činnosti aj rozhovore, ktorý vykonávala pred tranzom.<br /><br />Zmena presvedčenia (kúzlo- 22 many)<br />Zaklínač dokáže postavu zakliať a zmeniť jej tým presvedčenie. Stačí ak sa dotkne dotyčnej postavy a povie pri tom: „Zaklínam tvoju podstatu, mením ju a upravujem.“ Potom jej môže povedať či chce aby bola dobrá, zlá či neutrálna. Kúzlo na postave trvá 2 hodiny a nedá sa ničím zrušiť, dokáže to iba rusalka.<br /><br />6. úroveň<br />Zaujatie (kúzlo- 16 many)<br />Pri zosielaní sa zaklínač dotkne postavy a zašepká: ,,Teraz nesústreď sa na nič iné, iba na miesto mnou určené.“ (na záver dodá dané miesto, bod, na ktorý má obeť upriamiť svoju pozornosť). Miesto, predmet, na ktoré má byť obeť upútaná musí byť v dohľade. Obeť si nepamätá, prečo ju zrazu daná vec tak upúta. Ako zmyslov zbavená sa vydá za ňou a snaží sa ju čo najlepšie preskúmať, poprípade získať, ukradnúť. Zaklínač môže zvoliť úplne hoc čo, nejakú postavu či úplne banálny predmet.</p>";

var bh="<h2 onclick=\"document.getElementById('bh').innerHTML=bha\">Bohovia</h2><p>Toto je väčšina bohov uctievaných v kráľovstve Tahou a jeho okolí. Z nich si môže vybrať  ktorého budete chcieť uctievať (aj zlých, len rátajte s následkami).<br />Nariadenie kráľa zakazuje uctievanie zlých bohov a to najmä Gilonela Krutého, Darnona Čierny Hák a Draga. Taktiež môžete byť bez viery alebo sa pre niektorú po čas hry rozhodnúť. V prípade že sa rozhodne byť za svoju vieru naplno zapálený treba to aj poriadne zahrať!!<br /><br /><b>Stvoritel</b><br />Považovaný za stvoriteľa všetkého. Ustanovil bohov aby spravovali svet. Často sa naňho zabúda a pritom je najsilnejší zo všetkých bohov. Sám sa však moc nezviditelňuje. Je dobrý, spravodlivý a veľmi múdry. Niektorý z jeho vyznávačov ho považujú za jediného a pravého boha a existenciu ostatných bohov popierajú.<br /><br /><b>K`rull</b><br />Je prastarý boh, ktorý upadol do zabudnutia a večnej smrti. Prežíva len v snovej rovine, v mysliach svojich služobníkov a prehovára k nim len počas ich spánku, keď sa zjavuje v ich snoch. Je bohom osudu a času. Posvätným symbolom je strieborný prsteň.<br /><br /><b>Vars</b><br />Vládca hôr i dolín, boží kováč a umelec, od neho pochádzajú najmocnejšie artefakty sveta, pán severu a leta. Je tiež považovaný za boha vojny.<br /><br /><b>Luna</b><br />Je mesačná bohyňa ktorá je vládkyňou noci a v noci je aj najčastejšie uctievaná. Taktiež je považovaná za bohyňu lesných elfov a mnohých iných lesných bytostí. Neustále musí čeliť Gilonelovi Krutému, ktorý sa snaží o ovládnutie noci. Preto býva často zobrazovaná ako patrónka lovcov démonov.<br /><br /><b>Drin a Dran Lurtend</b><br />Ochrancovia barbarských a divokých národov, prvý z nich je bohom boja, víťazstva a cestovania, zatiaľ čo druhý ja pán domáceho krbu, úrody a žien.<br /><br /><b>Zuul</b><br />Vládca ríše mŕtvych, trestá nehodných a ukladá ku kľudnému spánku dobrých, jeho zbraňou je kosa Ris, ochránca západu a vládca jesene.<br /><br /><b>Drago</b><br />Je bohom všetkých nemŕtvych, zatratených, nekromantov a upírov. Vďaka tomu, že neustále narúša kľud mŕtvych sa často dostáva do sporu so svojim bratom Zuulom.<br /><br /><b>Gilonel Krutý</b><br />S ostatnými bohmi sa neznáša a začal vyznávať cesty zla, násilia a beznádeje, stal sa temným pánom a snaží sa o porážku bohov a nastolenia vlády. Často paktuje s Dragom a spoločne sa snažia o vládnutie sveta. Je pánom démonov.<br /><br /><b>Darnon Čierny Hák</b><br />Boh škretou, trolov, orkov a vôbec všetkých ich príbuzných. Je veľmi zlý a agresívny. Tiež sa pripravuje na ovládnutie sveta.<br /><br /><b>Matka Zem</b><br />Uznávaná najmä druidmi ako pôvod všetkého a matka všetkých živých tvorou. Svätiňu s sposvätným prameňom by sme mohli nájsť v dubovom svätoháji kde sa jej prinášajú rôzne obety (med, obilie, ovocie). Je uznávaná aj ako matka plodnosti. Jej posvätný strom je dub. Raz do roka sa jej prináša aj krvavá obeta.<br /><br /><b>Silwan Litoriet</b><br />Je to elfská bohyňa, ochranárka života v lese, pútnikov a pustovníkov, ktorý obývajú jej lesné kráľovstvo. Modlia sa k nej hlavne elfovia, ale i staro a novo usadlíci z ľudskej rasy (ale aj iných) ktorý žijú na okraji divokých lesov. Dáva ochranu každému, kto dodržuje jej zákony a ctí si prírodu. Je jednou z piatich dcér. Prvá je Tuile (jar), vládne zemi, druhá je Laire (leto), vládne ohňu, tretia je Yávie (jeseň), vládne vode, štvrtou je Hríve (zima), vládne vzduchu a poslednou je Silwan, ktorá má omnoho väčšiu moc ako všetky ostatné. Všetky sa rozdelili a každá odišla na jeden smer, začali vládnuť štyrom ročným obdobiam a navyše, ovládajú jeden zo základných živlov sveta.<br /><br /><b>Modrý vlk</b><br />Je synom Iliri bohyne lesov a noci a Tirasona prvého vlka a pána hvozdov. On sám je patrónom zvierat a zvieracích rás (napoly ľudí a napoly zvierat). Ochraňuje pocestných a preto sa teší veľkej priazni a úcte medzi chodcami a hraničiarmi. Do tohto kraju sa dostal celkom nedávno, spolu s prisťahovalcami a hlavne hraničiarmi. Uctievajú ho zvieracie bytosti, ale i lesný tvorovia ktorých ľudia často považujú za príšery a obludy. Ale medzi obyčajnými ľuďmi v mestách a civilizovaných častiach sa neteší veľkej priazni za to, že pomáhal armáde zvieracích rebelov (ľudia a zvieracie rasy sa vždy nemali moc radi, asi ako elfovia a trpaslíci).<br /><br /><b>LEGENDA (Silwan a sestry):</b><br />Silwan je jednou z piatich dcér. Prvá je Tuile (jar), druhá je Laire (leto), tretia je Yávie (jeseň), štvrtou je Hríve (zima) a poslednou je Silwan, ktorá má omnoho väčšiu moc ako všetky ostatné. Všetky sa rozdelili a každá odišla na jeden smer, začali vládnuť štyrom ročným obdobiam a navyše, ovládajú jeden zo základných živlov sveta.<br />Tuile odišla na východ a zvolila si za svoj domov krásne zelené a nekonečné lúky pokryté stále voňavými a rozkvitnutými kvetmi, kade tečú priezračné potoky s kryštálovo čistou a zázračnou vodou, kde žijú bájne biele jednorožce, kone s rohom na čele. Vládne zemi.<br />Laire odišla na juh a zvolila za svoj domov úrodné a zlatisté obilné polia, ktoré obklopujú jablone ktorým ovísajú konáre pod množstvom stále zrelých plodov, kde žijú bájne čierne jednorožce, kone tak isto s rohom uprostred čela. Vládne ohni.<br />Yávie odišla na západ a zvolila si za svoj domov všetkými farbami hýriace lesy, od červenej až po žltú, ktoré sa pohybujú vo divokom ale jemnom vetre. V tomto kraji žijú bájny pegasovia, okrídlené kone. Vládne vode.<br />Hríve odišla na sever a zvolila si za svoj domov rozsiahle a nikdy nekončiace biele pláne a vysoké ľadové štíty prikryté veľkou vrstvou snehu, ktorý je jemný ako perina a zároveň drsný ako kameň. Túto krajinu obývajú grifini, napoly levy a napoly orly. Vládne vzduchu.<br />Silwan odišla na tisícročnú horu a jej domov je v korunách stromu z ktorého je vidieť celý svet, ktorý rastie na tomto vrchole sveta, ktorý halia oblaky. Ale zatiaľ čo všetky štyri sestry majú iba obmedzenú moc a vládu nad ostatnými krajinami dostávajú do rúk iba na určitú dobu v roku, Silwan vládne celým rokom a ona jediná spája ostatné sestry a udržuje krehkú rovnováhu medzi ich silami.<br /><br /><b>LEGENDA (modrý vlk):</b><br />Na severe, sa vraj zhmotnil aby viedol do boja veľkú armádu rebelujúcich zvierat voči tyranskému ľudskému vladárovi. Ale on i armáda modrého vlka boli porazený a sám bol zakutí do reťazí. Dlhé dva roky bojovali rebeli pod vedením dvoch bratov, synov Modrého Vlka, aby ho vyslobodili. Nakoniec sa to podarilo a Modrý Vlk okúsil slobodu. Znova vystúpil na tisícročnú horu aby zaujal miesto medzi svojimi bratmi a sestrami, bohmi a bohyňami.<br /><br /><b>Tisícročná hora a jej okolie:</b><br />Tisícročná hora leží uprostred Elizenských polí cez ktoré preteká rieka Liforita. Ak sa do tejto rieky ponorí čokoľvek neživé, ožije to. Dokonca i mŕtvy tvor, kameň či socha alebo zkamenelí človek. Tieto polia sú pokryté večne zelenou trávou a večne voňavými kvetmi. Všade samí štvorlístok, o šťastie tu nie je núdza. Nad týmito poliami drží strážnu ruku ohnivý Flameron, ktorý nemá stálu podobu, iba ako ohnivá guľa, ktorý je stvorený z večného ohňa ktorý plápolá na tisícročnej hore. Preto tu na tomto území, Elizenských poliach nenastáva noc. Tisícročná hora je uprostred polí, z jej vrcholu pramení Liforita a vrchol tisícročnej hory ani nie je vidieť, halia ho mraky a hmla. Na jeho vrchole rastie mohutný strom, najväčší na zemi a z jeho koruny je vidieť na celý svet, na všetky strany. Tento strom je Matka príroda, alebo prvosadená rastlina, volá sa Gaiasorta. V jej koreňoch je jaskyňa kde horí Veční oheň, ktorý plápolal už stovky rokov predtým než vzplanul prvý oheň v kováčskej peci. Pri tomto ohni sedia mocné bytosti, bohovia. S nimi aj matka Modrého Vlka.</p>";

var ty="<h2 onclick=\"document.getElementById('ty').innerHTML=tya\">Tituly</h2><p>Každý kto vykoná nejaký veľký a chrabrí čin môže byť správcom alebo kráľom pasovaný do stavu šľachtického a bude mu pridelený titul podľa jeho zásluh. Správca a kráľ majú tiež možnosť tieto tituly odnímať. <br />Každému šľachticovi vďaka jeho postaveniu prináležia aj určité výhody a povinnosti, ako napríklad, menšie ceny v obchode, menšie dane a nočné mýtne pri vstupe do mesta, budú pre nich poriadane večierky v dome správcu. Ale bude to mať aj svoje nevýhody, ak totiž správca vydá rozkaz že mesto sa musí brániť za každú cenu, šľachta musí ísť mesto brániť tiež, je to divné že na hradbách bude vedľa obyčajného zbrojnoša stáť gróf, ale Akon pri obrane potrebuje každú ruku. A šľachta musí rešpektovať rozkazy správcu dvojnásobne, ak nie správca im môže dokonca titul vziať. A to nie je boh vie čo, keď sa stane z grófa sedliak ktorý sa vráti k chovu prasat. <br /><br /><table rules=\"all\"><tr><td width=\"145px\">TITULY</td><td width=\"145px\">OSLOVENIE</td><td width=\"145px\">MANŽELKA</td><td width=\"145px\">SYN</td><td width=\"145px\">DCĚRA</td></tr><tr><td>Čestný rytier</td><td>Pane</td><td>Pani</td><td>-</td><td>-</td></tr><tr><td>Sir</td><td>Sir</td><td>Pani</td><td>-</td><td>-</td></tr><tr><td>Baronet</td><td>Pane</td><td>Baronetta</td><td>-</td><td>-</td></tr><tr><td>Zeman</td><td>Pane</td><td>Zemanka</td><td>-</td><td>-</td></tr><tr><td>Barón</td><td>Pane</td><td>Barónka</td><td>Baronet</td><td>Baroneta</td></tr><tr><td>Lord</td><td>Lordstvo</td><td>Lordka</td><td>Baronet</td><td>Baronetta</td></tr><tr><td>Vikmont</td><td>Jasnosť</td><td>Komtesa</td><td>Vikimont</td><td>Komtesa</td></tr><tr><td>Markýz</td><td>Jasnosť</td><td>Markýza</td><td>Vikimont</td><td>Komtesa</td></tr><tr><td>Gróf</td><td>Jasnosť</td><td>Grófka</td><td>Vikimont</td><td>Komtesa</td></tr><tr><td>Vojvoda</td><td>Jasnosť</td><td>Vojvodkyńa</td><td>Vikimont</td><td>Komtesa</td></tr><tr><td>Knieža</td><td>Jasnosť</td><td>Kňažná</td><td>Vikimont</td><td>Komtesa</td></tr><tr><td>Kráľ</td><td>Vaša Výsosť</td><td>Kráľovná</td><td>Princ</td><td>Princezná</td></tr></table><br />Správca je ustanovený kráľom a nie je možné aby bol tento titul niekomu inému udelení, pokiaľ správca žije. Ak zomrie, alebo vykoná niečo čo pobúri kráľa, ten ho môže zvrhnúť a stanoviť nového správcu. Dá sa teda povedať, že správca je najvyšší titul hneď po kráľovi. <br /><br />Napríklad niekto zachránil  správcu pri prechádzke lesom, keď ho napadla divoká zver. Správca svojmu záchrancovi udelí titul Lorda (musel mať veľmi dobrú náladu a bol zrejme ešte aj opití keď spravil niečo takéto) a ten sa onedlho ožení. Jeho manželka dostane ako jeho žena titul Lordka. Za nejaký čas budú mať dve deti. Syna a dcéru. Obe deti, ako deti dvoch šľachticov dostanú hneď tituly. Chlapec sa stane Baronetom a dievča Baronettou. Vojaci a sedliaci i ostatní dobrodruhovia by mali tochto Lorda oslovovať vaše Lordstvo, jeho ženu vaša Lordka. V prípade že bude titulu pozbavený, prídu o titul aj všetci členovia jeho rodiny. <br /><br />Šľachta aby sa mala tiež správať zdvorilo. Zdvorilostný pozdrav, ktorý skladá nižšie postavení šľachtic vyššie postavenému šľachticovi, napríklad Sir Grófovi je:„Poklona mojej rodiny patrí Vám.“<br /><br />Šľachtic tiež na niekoho nezvrieskne ako barbar: „ ty klamár podlí!“ keď ho obviňuje z ťažkého zločinu ale povie :<br />„Píšeš knihu vyhnancov!“<br /><br /><br />BEZCENNÝ<br />Správca môže niekoho veľmi zlého, kto neuposlúchol rozkaz či vykonal niečo veľmi zlé vyhlásiť za bezcenného a vyhostiť ho z mesta. Bezcenný má jedinú možnosť, žiť v divočine alebo sa odsťahovať niekam preč. Vlastne, pre ostatných stratil svoju česť a preto sa k nemu tak aj chovajú. Nemôže vstúpiť do mesta, nakupovať, predávať, nik sa s ním nebude baviť, všetci ho musia ignorovať, nanajvýš ho môžu od seba vyhnať ak bude moc dotieraví. Tým že sa k nemu budú všetci takto chovať je sám trestaní. Môže sa pokúsiť správcu požiadať o odpustenie, ale to sa dostáva len ťažko. Postava pre ostatných obyvateľov neexistuje. <br /></p>";
