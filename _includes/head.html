var zak="<h2 class=\"click\" onclick=\"document.getElementById('zak').innerHTML=zaka\">Základné:</h2><h3>Hra a herný svet: </h3><p> Odohráva sa na predom určenom mieste za určitých podmienok a pravidiel ktoré musia všetci hráči (aj CP) poznať a vedieť!!! Je potrebné aby sa na toto miesto dostavili všetci hráči včas. Kvôli organizačným veciam by bolo lepšie prísť aj o niečo skôr a nie dobiehať na poslednú chvíľu!!! Počas hry sa treba riadiť pokynmi organizátorov. Takisto organizátori určujú dĺžku hry a jej prípadné herné prerušenie ak je to treba, inak sa hrá nepretržite 24 hodín denne (čiže všetky svoje činnosti vykonávate herne, či už je to spánok, jedenie, alebo návšteva latríny,  preto vás pri týchto činnostiach môže ktokoľvek prepadnúť!!)!! Uvedomte si že ste v prírode a podľa toho sa treba správať (odpadky nepatria na zem ale na predom určené miesto, ohniská sa zakladajú len na to určených miestach a len so súhlasom organizátora a pod.!!)!!! V hernom svete sa nachádzajú hráči, CP, CP hráči, beštie. Úlohou hry nieje vyhrať, ale vytvoriť čo najlepší svet a poriadne sa zabaviť!!!</p><h3>Hráč:</h3><p> Hráčom sa môže stať každý človek, ktorý bude spĺňať určité povinnosti ktoré sú uvedené nižšie. Po splnení týchto povinností sa stáva súčasťou herného sveta, ktorý môže svojim konaním ovplyvňovať pomocou postavy ktorú si dopredu vyberie a počas hry stvárňuje. Povinnosťou každého hráča je včas sa zaregistrovať, poznať pravidlá, zaplatiť štartovné ak je stanovené, prísť na čas, riadiť sa organizátormi, doniesť si so sebou sprievodnú listinu a stále ju pri sebe nosiť(!!!) nekaziť ostatným zábavu powerplayerstvom (!!!), počas hry ani tesne pred ňou požívať alkohol, drogy alebo akékoľvek iné omamné a psychotropné látky!!!</p><h3>CP hráč: </h3><p> Je to vlastne hráč, ktorý hrá svoju postavu, vyvíja sa ako ostatný, získava skúsenosti a postupuje na vyššie úrovne. Jediné v čom sa líši je o trošku väčšími právomocami, napríklad ak je mu to povolené môže vyvíjať ostatných hráčov na vyššie úrovne, dávať úlohy, navrhovať komu dať skúsenosti alebo môže vedieť nejaké podrobnosti o deji naviac, ale len také ktoré by neovplyvnili jeho správanie a nepokazili mu zážitok z hry.</p><h3>CP:</h3><p> CP – teda cudzia postava. Tieto postavy sa počas deja nevyvíjajú a na rozdiel od hráčov nezískavajú skúsenosti ale napriek tomu stvárňujú určité postavy (prípadne iné stvorenia) ktoré obohacujú dej. Podávajú herné informácie, dávajú úlohy, skúsenosti, vyvíjajú na vyššie úrovne, majú špeciálne schopnosti a podobne.</p><h3>Beštia/creep:</h3><p> V hernom svete sa vyskytujú aj beštie alebo inak povedané creepy. Tie slúžia na dotvorenie hry a počas deja sa nijako nevyvíjajú, ich úlohou je hráčom znepríjemňovať život  .</p><h3>Organizátori:</h3><p> Organizátori dohliadajú na plynulí priebeh hry a riadia herný svet. Každý hráč sa musí riadiť ich pokynmi!!! V prípade nejakých nejasností či nezhôd v pravidlách alebo iných závažných veciach je treba ich vyhľadať a oboznámiť ich s týmto problémom. Každú hernú situáciu ktorú chce hráč alebo CP spraviť a mohla by vážne narušiť priebeh hry treba konzultovať s organizátormi a preto je možné počas hry vytvárať nové úlohy či herné situácie.</p><h3>Powerplayer:</h3><p> Každý hráč, ktorý zakladá svoje podlé úspechy na dierach v pravidlách bude označený za powerplayera a nemilosrdne potrestaný. Tieto nechutné praktiky niektorých hráčov len kazia zážitok druhým!!! Bezpochyby jedným z najväčších príznakov powerplayerstva je nerátanie si životov lebo „niekto“ si chce dokázať že je lepší, neporaziteľný v mnohých prípadoch až „nesmrteľný“ !!! A namiesto zlepšovania svojho šermu si len donekonečna pripočítava životy. Bohužiaľ takýchto prípadov je čoraz viac a preto budú za tieto činy kruto odsudzovaný a opovrhovaný!!!</p><h3>Role play:</h3><p> Je to schopnosť hráča vžiť sa do svojej postavy, konať a rozprávať tak, akoby iný než herný svet neexistoval, a správanie jeho postavy v tomto svete dokonale splynulo. Dosť dôležité je dobre zahrať niektoré situácie akoby boli skutočné, napríklad smrť, bolesť, strach,  mučenie a podobne. Takže pokiaľ máte stretnúť na ceste draka a namiesto neho tam uvidíte niekoľko ľudí ktorý zo seba vydávajú rozličné zvuky a možno ako drak ani nevyzerajú, pre vás je to drak a treba sa podľa toho správať (nejaký ten strach by bol na mieste) a nerobiť si z toho srandu a mať blbé poznámky!!! Taktiež nepoužívať neherné informácie (keď ste sa nejakú vec dozvedeli v nehernom čase, prostredí alebo neherným spôsobom!!!!) a veci (napr. mobilné telefóny, baterky,...)!!!! Pokiaľ bude hráč prezentovať veľmi dobrý role play určite za to získa nejaký ten skúsenostný bodík!</p><h3>Sprievodná listina:</h3><p> Každý hráč ktorý si podľa pravidiel (alebo pripadne po dohode s organizátormi) spraví svoju postavu je povinný ju zaznamenať na papier, priniesť ju so sebou a po celý čas hry nosiť pri sebe!!! Takýto zvitok papiera bude považovaný za sprievodnú listinu na ktorej musí byť uvedené: meno hráča, meno postavy, rasa, povolanie, presvedčenie, životy, schopnosti, kúzla (ak ich má), úroveň, magické predmety, peniaze, šperky, drahokamy a prípadne iné veci, ktoré považuje za potrebné. Na konci hry sa tieto listiny buď pozbierajú, alebo sa spraví samostatná registrácia postáv (prípadne iný spôsob podľa rozhodnutia organizátorov), aby hráč mohol v nasledujúcom ročníku za svoju postavu pokračovať.</p><h3>Kostýmy:</h3><p> Je potrebné, aby si každý hráč doniesol aspoň aký-taký kostým (pokiaľ nemáte zatiaľ vlastný, vždy sa dá od niekoho požičať, len sa treba pýtať!!). Chceme tým zvýšiť úroveň a zážitok z hry. Ono je predsa len problém predstaviť si niekoho v teplákovej súprave, maskáčoch či nebodaj v rifliach ako mocného kúzelníka či paladina! Doporučujeme aby si hráči so sebou priniesli aj mešce , prípadne nejaké taštičky, na herné predmety. Za pekný kostým budú organizátori udeľovať aj životy na viac, prípadne aj skúsenostné body.</p><h3>Herné predmety:</h3><p> Herným predmetom sa rozumejú všetky predmety ktoré súvisia s herným svetom. Hráč je povinný so sebou neustále nosiť sprievodnú listinu, herné peniaze a šperky, artefakty, lektvary, amulety, proste všetky veci ktoré počas hry nadobudol a nieje možné ich niekam odkladať, zakopávať, skovávať!!! Výnimku môže udeliť len organizátor!</p><h3>Družina:</h3><p> Hráči sa môžu spájať do skupiniek ktoré môžu mať maximálne 5 členov!!! Skupiny sa nemôžu dohadovať na spoločných útokoch pokiaľ to ako zvyčajne neschvália organizátori, alebo si to priamo nevyžaduje dej!</p><h3>Boj:</h3><p> Bojovať je možné len so schválenými zbraňami a so štítom nieje možné útočiť!!! Taktiež nemožno útočiť s s palicami ktoré používajú kúzelnícke povolania, s nimi je možné sa len brániť!!!  Je zakázané používať akúkoľvek formu fyzického násilia (údery, kopy, zvalenie na zem a pod.) a bodať so zbraňami (okrem výnimky pri tyčových zbraniach, ktoré na to musia byť bezpečnostne prispôsobené)!!! Pri útoku je zakázané zbraň akýmkoľvek spôsobom zachytávať (rukou, plášťom, prípadne ináč), držať, či zobrať protivníkovi (okrem schopnosti a kúziel na to určené)!!! Počas boja je prvoradá bezpečnosť a povinnosťou každého hráča je prerušiť boj pokiaľ sa jeho protivník zranil, spadne na zem, alebo by sa mal dostať do nebezpečného terénu (mal by naraziť do stromu, zakopnúť o kameň, spadnúť do jamy a pod.)!!!Každý útok musí byť vedený viditeľným náprahom od ramena a nielen lakťom alebo zápästím (takže kordikáry radšej zostaňte doma!!), takéto zásahy sú neplatne!!! Úder musí byť brzdený včas a nie až na tele protivníka (ako to niektorý „odborníci“ praktizujú)!!! Medzi zásahové plochy nepatria a je na ne zakázané útočiť alebo naznačovať útok: ruky od zápästia nižšie, nohy od členkov nižšie, kĺby (kolená, lakte), krk, hlava a genitálie ktorými je aj zakázané vykrývať útoky!!!!! Hráč ktorý útočí oznamuje (na hlas) silu zásahu, teda za koľko životov zraňuje! Platnosť zásahu určuje vždy (na hlas) ten hráč, ktorý zásah dostal!! Ten si musí odpočítať životy buď s tela alebo zbroje (ak ju má)! Vzájomný súsek súpera sa ráta do 1 sekundy a životy si odrátajú obi dvaja! Jeden hráč nemôže dať za sebou viac rýchlych úderov, alebo použiť techniku „vlnitého plechu“ – prejdenie jedným ťahom zbrane po viacerých protivníkoch!!! Počas celej hry je fyzický kontakt zakázaný s výnimkou role play-ových scén!!! Napriek tomu že je používaný „životový systém“ je každý hráč povinný hrať zranenia (a to nielen od zbraní ale aj od útočných kúziel).<br /><br /><b>Hranica vyradenia</b> – v prípade že hráč príde o všetky svoje životy a dostane sa na nulu, nezomiera, ale upadá do stavu v ktorom padá na zem, chvíľku (pár sekúnd) sa zvíja vo veľkých bolestiach a upadá do bezvedomia. V tomto stave sa nesmie akýmkoľvek spôsobom brániť!!! V Prípade, že do pol hodiny nebude ošetrený, vyliečený alebo akýmkoľvek spôsobom sa počet jeho životov nezvýši minimálne na 1 (neráta sa zbroj!!) zomiera na vykrvácanie!</p><h3>Nočný boj:</h3><p> Počas nočného boja sa môžu používať všetky zbrane, šípy, zbroje, štíty, kúzelnícke palice, a schopnosti ako cez deň, takže sa počas noci vôbec nič nemení!! Akurát treba ešte viac zvýšiť opatrnosť a bezpečnosť pri súbojoch!!!</p><h3>Podrezávanie a omráčenie:</h3><p><i>Podrezávať</i> môže ktokoľvek a kohokoľvek avšak nesmie to byť počas boja a obeť sa nesmie brániť (buď je omráčená, na hranici vyradenia, o útočníkovi nevie alebo mu dôveruje). Útočník musí obeti prejsť veľmi zľahka po krku alebo kľúčnej kosti dýkou (prípadne mečom, alebo inou podobnou zbraňou) a obeť musí mať nechránený krk (šatka sa neráta ako ochrana krku)! Ak sú splnené všetky tieto podmienky a (pokiaľ nebol dorazený) do pol minúty nieje podrezanému poskytnutá pomoc zomiera!Aby sa z hry nestal vyvražďovací masaker, každý hráč (ak mu nieje udelená výnimka)  môže podrezať len raz za 24 hodín, pokiaľ organizátori nestanovia ináč!!!!<br /><i>Omráčenie</i> veľmi dobre poslúži v prípade keď chcete niekoho uniesť živého alebo ho proste nechcete nezabiť. Omračovať môže každý, priložením ruky na hlavu obete a vyslovením „omračujem Ťa“ a tá musí upadnúť do bezvedomia na dobu 5 minút. Omráčiť postavu je možné len v prípade, že je na hranici vyradenia (výnimku tvoria schopnosti) a nemá chránenú hlavu prilbou alebo drátenou kuklou!!!</p><h3>Schopnosti:</h3><p> Každé povolanie má svoje špecifické schopnosti ktoré môže po čas hry využívať. Pri postupe na vyššiu úroveň získava postava nové schopnosti. Každá schopnosť ma kritéria na svoje použitie. V prípade že by protihráč na ktorého je schopnosť použitá nevedel čo daná schopnosť robí, zosielajúci je povinný mu schopnosť popísať (na chvíľu prerušia hru, a po vysvetlení pokračujú) a vysvetliť jej účinok. Pokiaľ sa schopnosť môže použiť len niekoľkokrát za deň, myslí sa tým do 24 hodiny toho dňa. Pokiaľ ju môže použiť 2 krát a použije len 1 krát za deň, nemôže si ju do ďalšieho dňa presunúť!!!</p><h3>Kúzlenie:</h3><p> Všetky kúzelnícke povolania majú na čarovanie manu. Pri vyvolaní kúzla sa im z tejto many odpočíta potrebný počet. Pri prestupe na vyššiu úroveň sa mana zvyšuje. V prípade, že sa hráčovi mana minie môže si ju doplniť meditáciou (buď u svojho majstra, niektorého z CP, alebo na určenom mieste, prípadne lektvarom a pod.) ktorá musí trvať minimálne 20 minút v absolútnom kľude a maximálne 3 krát za deň a mana sa tiež doplní po neprerušovanom spánku 4 hodín (počas týchto 4 hodín si môže odbehnúť na záchod). Ak by vás niekto pri meditácii vyrušil, musíte začať znovu!!! To isté platí aj pri vyvolávaní kúziel (napríklad vám dá v tej chvíli niekto zásah a pod) avšak manu si odpočítavate. Je potrebné, aby si každý hráč, ktorý bude hrať za niektorého z kúzelníkov doniesol so sebou na akciu aj niekoľko nosičov (je to penová, alebo z iného mäkkého materiálu vyrobená loptička o priemere asi tak 5 – 7 cm) pomocou ktorých sa zosielajú niektoré kúzla. Formulka uvedená pri kúzlach je NUTNÉ MINIMUM, ktoré musí kúzelník povedať prípadne aj vykonať určitú!! Kúzelníci by mali svoje kúzlenie okrášľovať rôznymi gestami, pózami či riekankami (V tomto je im ponechaná absolútna voľnosť). Kúzla s dlhšími účinkami (posilnenia zbraní a pod.) sa od jedného povolania nedajú kumulovať!! (Napr. žeby dvaja mágovia zoslali na jednu  zbraň Posilnenie).</p><h3>Smrť:</h3><p> Pokiaľ hráč počas hry stratí všetky svoje životy a dostane sa až pod nulu (čiže do mínusu) nastáva smrť a jeho postava zomiera! Je však možné ju do 4 hodín niektorým z herných spôsobov oživiť (lektvar života, schopnosť vzkriesenie, a pod.) a hráč môže pokračovať ďalej s tým, že posledných 20 minút svojo života si nepamätá a stráca určitý počet skúsenostných bodov (podľa uváženia organizátorov, ktorých treba ihneď s touto skutočnosťou oboznámiť)!!! V prípade, že by sa do tohto času nepodarilo postavu oživiť, hráč musí vyhľadať organizátora a začať s úplne novou postavou na nultej úrovni.</p>";

var zsz="<h2 onclick=\"document.getElementById('zsz').innerHTML=zsza\">Zbrane, štíty, zbroje:</h2><p><b><u>Zbrane:</u></b><br />Všetky zbrane musia byť <b>bezpečné a obalené</b>a mali by mať <b>primeranú váhu</b>(nie moc ťažké ani moc ľahké)!!! To isté sa týka aj štítov!!!  Každú zbraň aj štít budú schvaľovať organizátori!!! <br />Všetky zbrane (aj strelné) zraňujú za 1 život okrem ťažkých, tie zraňujú za 2 životy.<br /><b>Vrhacia dýka</b>– miranolová trubka o dĺžke 10-20 cm, bez drevenej rúčky alebo záštity (môžu byť však z miranolu ) a bez drevenej výplne!! môže byť však vyplnená (zaťažená) vatou alebo látkou. <br /><b>Kuše a luky</b>majú <b>max. náťah 10 kg</b> a šípy musia mať na konci bambuľu s minimálnym priemerom 5 cm!!!!!!Kúzelnícke povolania môžu používať palicu avšak <b>len na obranu!!!!!</b><br /><br /><br /><table cellpadding=\"5px\"><tr><td>Krátke:</td><td>dýka</td><td>40 cm</td></tr><tr><td></td><td>tesák</td><td>60 cm</td></tr><tr><td></td><td>krátky meč</td><td>90 cm</td></tr><tr><td>Stredné:</td><td>šabla</td><td>95 cm</td></tr><tr><td></td><td>meč</td><td>105 cm</td></tr><tr><td></td><td>sekera</td><td>90 cm</td></tr><tr><td></td><td>kladivo</td><td>90 cm</td></tr><tr><td></td><td>biják</td><td>40+30 cm</td></tr><tr><td></td><td>palcát</td><td>80 cm</td></tr><tr><td>Ťažké</td><td>bastard</td><td>120 cm</td></tr><tr><td></td><td>obojručák</td><td>150 cm</td></tr><tr><td></td><td>veľké kladivo</td><td>125 cm</td></tr><tr><td></td><td>veľká sekera</td><td>125 cm</td></tr><td></td><td></td><td></td></tr><tr><td>Tyčové:</td><td></td><td>180-200 cm</td></tr></tr><td></td><td></td><td></td></tr><tr><td>Strelné:</td><td>kuše</td><td>10 kg</td></tr><tr><td></td><td>luky</td><td>10 kg</td></tr><tr><td></td><td></td><td></td></tr><tr><td>Vrhacie:</td><td>vrhacia dýka</td><td>10-20 cm</td></tr><tr><td></td><td></td><td></td></tr><tr><td><b><u>Štíty:</u></b></td><td>malý</td><td>do 40 cm</td></tr><tr><td></td><td>stredný</td><td>do 60 cm</td></tr><tr><td></td><td>veľký</td><td>nad 60 cm</td></tr></table><br />Strelné:	kuše		10 kg<br />luky		10 kg<br /><br />Vrhacie:	vrhacia dýka	10-20 cm<br /><br />Štíty: 		malý		do 40 cm<br />stredný		do 60 cm<br />veľký		nad 60 cm<br /><br /><b><i>Zbroje:</i></b><br /><br />V prípade že si niekto donesie k zbroji nejaké iné doplnky (ako rukavice, nohavice) môže dostať životy navyše podľa uváženia oranizátorov.<br />Body za zbroj sa odrátavajú podobne ako životy a hráč si po zásahu (ktorý dostal) odpočíta životy najprv zo zbroje a až je zbroj úplne zničená, začne si odpočítavať vlastné životy, pokiaľ nieje stanové kúzlom, schopnosťou alebo magickou zbraňou že si musí odpočítať priamo zo životov či zbroje.<br />Zbroj po poškodení je možné za určitý poplatok si dať opraviť u kováča prípade inými hernými možnosťami.<br />Náhražková zbroj – hráč si kľudne môže vyrobiť napríklad plátovú zbroj (alebo ktorúkoľvek inú) z linolea, alebo iného materiálu, podmienkou je aby táto zbroj aspoň nejako vyzerala a na zbroj sa podobala. Náhražková zbroj sa bude hodnotiť podľa prevedenia a podľa toho akú zbroj má nahrádzať a podľa jej váhy. Napríklad plátová zbroj s prilbou ma 14 životov, náhražková plátová zbroj s prilbou má 11 životov (14 – 3 = 11). Vždy aj pri reálnych zbrojach posudzujeme prevedenie, čiže tieto body sú len orientačné!<br /><table cellpadding=\"5px\"><tr><td></td><td></td><td>hlava</td><td>telo</td><td>spolu</td></tr><tr><td>ľahká</td><td>kožená</td><td>2</td><td>4</td><td>6</td></tr><tr><td></td><td>vypchávaná</td><td>2</td><td>4</td><td>6</td></tr><tr><td></td><td></td><td></td><td></td><td></td></tr><tr><td>stredná</td><td>drátená</td><td>3</td><td>8</td><td>11</td></tr><tr><td></td><td>doštičková</td><td>3</td><td>8</td><td>11</td></tr><tr><td></td><td></td><td></td><td></td><td></td></tr><tr><td>ťažká</td><td>šupinová</td><td>4</td><td>10</td><td>14</td></tr><tr><td></td><td>plátová</td><td>4</td><td>10</td><td>14</td></tr><tr><td></td><td></td><td></td><td></td><td></td></tr><tr><td>náhražková</td><td>akákoľvek</td><td>-1</td><td>-2</td><td>-3</td></tr></table></p>";

var sau="<h2 onclick=\"document.getElementById('sau').innerHTML=saua\">Skúsenosti a úroveň:</h2><p>Každý hráč (aj CP hráč) môže počas hry získať skúsenosti ktoré mu pomôžu prejsť na vyššiu úroveň. Skúsenosti môže udeliť len organizátor (v niektorých situáciach po dohovore aj CP ak ho tým organizátor poverí!!)!! Skúsenosti možno získať za splnenie úlohy, zabitie beštie (prípadne iného hráča alebo CP), získanie artefaktu, dobrý roleplaying (za hranie postavy), alebo podla uváženia organizátora za vykazovanú aktivitu.<br />Keď hráč dosiahne dostatočný počet skúsenosti aby mohol postúpiť na ďalšiu úroveň, musí prísť za svojim majstrom (vodcom alebo kto je kompetentný dané povolanie vyvinúť) a ten ho po krátkom výcviku alebo skúške povýši na ďalšiu úroveň. <br /><table cellpadding=\"5px\"><tr><td>úroveň</td><td>1.</td><td>2.</td><td>3.</td><td>4.</td><td>5.</td><td>6.</td><td>7.</td><td>8.</td><td>9.</td><td>10.</td> </tr><tr><td>počet skús.</td><td>5</td><td>20</td><td>45</td><td>80</td><td>120</td><td>165</td><td>215</td><td>270</td><td>330</td><td>395</td> </tr><tr><td>prírastok</td><td>5</td><td>15</td><td>25</td><td>35</td><td>40</td><td>45</td><td>50</td><td>55</td><td>60</td><td>65</td> </tr></table></p>";

var pre="<h2 onclick=\"document.getElementById('pre').innerHTML=prea\">Presvedčenie:</h2><p>Pri tvorbe postavy si musí hráč vybrať presvedčenie ktorým sa počas hry musí riadiť! Presvedčenie je nemeniteľné (výnimku tvoria prekliatia a podobné herné situácie) !!!<br /><br /><b>1. Absolútne dobro</b><br />Toto presvedčenie je typické pre fanatických bojovníkov za dobro, ako sú napríklad paladinovia, rytieri, bieli mágovia. Postavy s takýmto presvedčením by za žiadnych okolnosti vedome nevykonali nijaké zlo! Sú veľmi čestné, ohľaduplné a v mene dobra ochotne položiť aj svoj život za správnu vec! Ich hlavným nepriateľom je zlo ktoré kruto strestajú hnevom spravodlivosti.<br /><br /><b>2. Dobro</b><br />Tiež veľmi kladné presvedčenie a keď nieje také ortodoxné ako absolútne dobro. Dalo by sa povedať že sú v podstate rovnaké, až na to, že postavy si pri všetkom tom dobre zachovávajú zdravý rozum, to znamená že sa na stádo drakov nevyrútia s kuchynským nožom a konajú oveľa viac s rozvahou.<br /><br /><b>3. Relatívne dobro</b><br />Aj relatívne dobré postavy sú dosť naklonené veci dobra a pomerne ochotne za neho bojujú, avšak vo chvíli keď je ohrozený ich život alebo majetok, ich nadšenie značne opadá. Celkovo sa dá povedať, že pre toto presvedčenie je veľmi ťažké klamať, podvádzať alebo zradiť priateľa, ale niekedy sú dôvody pre to tak silné, neodolajú a za tučný obnos peňazí alebo šľachtický titul vykonajú nejakú tu nekalosť. Tieto postavy však môžu byť oddanými priateľmi či vernými spolubojovníkmi v dobrých a možno aj zlých časoch.<br /><br /><b>4. Neutralita</b><br />Slovo neutralita hovorí asi za všetko. Týmto postavám je ľahostajné že vôbec nejaké dobro alebo zlo existuje. Jediné čo ich zaujíma sú oni sami a ich prospech. Nezamýšľajú sa nad tým či konajú dobro alebo zlo, keď budú mať niečo z toho že v danej situácii budú konať dobro tak to spravia, bez ohľadu na to, že o chvíľu príde niekto iný a zaplatí im väčšiu sumu aby mu pomohli na strane zla. Toto presvedčenie je typické pre žoldnierov. Kvôli ich sebeckosti nebývajú veľmi obľúbený a možno práve to im pomáha prežiť v ťažkých časoch.<br /><br /><b>5. Relatívne zlo</b><br />Postavy sú síce naklonené bojovať za zlo a šíriť ho ďalej, ale aj tak sa stane, že občas robia niečo iné, do svojich vreciek si ulievajú viac než je zdravé a vôbec robia veci na ktoré by správne zlý dobrodruh nemal  ani pomyslieť. Pokiaľ ich však niekto požiada o nejakú zlú vec, tak ju vykonajú a možno za to ani nebudú chcieť tak vysokú odmenu. V družine sa tieto postavy môžu chovať rôzne, napríklad si môžu arogantne uťahovať z každého, byť krutý k ostatným a v družine roznecovať spory, prípadne sa hrať na dobrého priateľa nejakej dobrej postavy a neustále ju štvať proti ostatným členom skupiny.<br /><br /><b>6. Zlo</b><br />Nositelia tohto presvedčenia bývajú z pravidla veľmi prešibaný a v konaní zla niesu tak šialený ako postavy s absolútnym zlom, dokážu sa perfektne skrývať a v pravý čas uderiť. Nič ich tak nepoteší ako dlho pripravovaná zrada alebo majstrovsky nafúknuté klamstvo. Zhromažďujú peniaze, pokiaľ ich potrebujú pre svoje temné ciele, ale im na nich v podstate nezáleží. Je lepšie sa vyvarovať ich prítomnosti, ale oni sa dokážu dobre skrývať!<br /><br /><b>7. Absolútne zlo</b><br />Je vlastne opakom absolútneho dobra. U takejto postavy môžeme hovoriť o posadlom konaní zla. Je to úplný fanatik, ktorý je schopný zastaví len preto aby mohol s veľkým potešením rozšliapnuť mravca. Absolútne zlý bývajú napríklad nekromanti, čiernokňažníci, padlý paladinovia. Pokiaľ sú navyše veľmi mocný, je lepšie sa im radšej z diaľky vyhnúť. Sú schopný obetovať všetko (aj svoj život) pre konanie zla a rozhodne sa im nedá veriť alebo ich mať za priateľov (iba ak by ste boli rovnako zlý).</p>";

var rs="<h2 onclick=\"document.getElementById('rs').innerHTML=rsa\">Rasy:</h2><p>Rasy ako horali, nixovia, droubovia, lesný a temný elfovia, amazonky a zorxovia, budú pravdepodobne žiť na okraji mesta, prípadne na úplne inom mieste. To sa týka aj určitých povolaní,  ako: hraničiar, lovec, barbar/berserk, lovec skalpov, zbojník, šaman, druid.<br /><br /><b><u>Popis rás:</b></u><br /><br /><b>Človek</b>– Ľudia sú najrozšírenejšou rasou na svete. Sú veľmi všestranný a nachádzajú uplatnenie vo všetkých povolaniach.<br />Presvedčenie: 1-7<br />ZR (Zvláštnosť Rasy): Vďaka všestrannosti ktorou človek oplýva je bez obmedzenia na povolanie, to znamená že môže vykonávať ktorékoľvek povolanie.<br /><br /><b>Horal</b>- Žijú prevažne v horských oblastiach v drevených chatrčiach a  pokiaľ možno sa vyhýbajú styku s civilizáciou. Živia sa lovom a  pastierstvom. Výborne sa orientujú v domovskom prostredí. S  trpaslíkmi sa nemajú moc v láske. V porovnaní s ľuďmi sú dosť  naivní. Vynikajú silou, odolnosťou a ich šikovnosť a obratnosť v  boji je preslávená. Ideálnym povolaním pre horala je barbar/berserk, zbojník, bojovník, lovec skalpov ale zvláda aj iné.<br />Presvedčenie: 3-7<br />ZR: V prípade, že by na horala niekto použil ľahký jed alebo ľahké uspávadlo sa mu vďaka jeho vysokej odolnosti nič nestane. Pokiaľ by však boli tieto látky na ňom následne použité druhý krát v ten istý deň, jeho imunitná obrana je vyčerpaná a látky zapôsobia. S každým novým dňom sa táto imunita automaticky obnovuje.<br /><br /><b>Nix</b>- Väčšinou sa vyskytujú ako samotári, alebo v malých skupinkách pri okrajoch miest. K ostatným rasám chovajú rasovú nenávisť (najmä ku kentaurom a amazonkám) a vyhľadávajú konflikty. Ako tak vychádzajú s ľuďmi, dulonmi, horalmi. Keďže nixovia nemajú ženy, rozmnožujú sa s ľudskými ženami a ich potomkovia sú vždy nixovia. Ich najčastejšie povolanie býva bojovník, barbar, žoldnier, zbojník. Vôbec im nerastú vlasy!<br />Presvedčenie: 4-7<br />ZR: Počas súboja s inými rasami okrem človeka, horala a dulona má +1 do útoku, to vďaka jeho neznášanlivosti ktorú k ostatným rasam chová. Túto schopnosť môže využiť max. 1x za deň a to na celý súboj. Pri súboji s kentaurom alebo amazonkou má +1 do útoku vždy a bez obmedzenia.<br /><br /><b>Droub</b>- Sú preslávený svojou veľkou silou a odolnosťou ktoré vychádzajú z ich fyzických daností. Žijú veľmi jednoduchým a prostým životom v odľahlých dedinkách vysoko v horách. Preto v ostatných  rasách vzbudzujú rešpekt. Ich inteligencia a múdrosť je však veľmi  nízka. Preto ich najčastejšie povolanie je barbar/berserk. Pleť majú zelnej alebo bielej farby.<br />Presvedčenie: 2,3/5,6<br />ZR: Kvôli drsným podmienkam v ktorých droubovia prežívajú sa im časom vytvorila oveľa hrubšia pokožka ako u ostatných rás. Táto sa ráta ako prirodzená zbroj +3 a po jej zničení sa vždy na konci dňa sama automaticky obnoví. <br /><br /><b>Hobit</b>- Prevažne obývajú lesy a pasienky, ale často ich nájdeme aj v mestách. Svojou postavou pripomínajú  deti. Preto sú veľmi nenápadní a obratní. Ich najčastejšie povolanie  býva zlodej, strelec, mág. Práve kvôli ich vlastnostiam  ich ostatné rasy nemajú v láske a správajú sa voči nim nedôverčivo.<br />Presvedčenie: 2-5<br />ZR: Každý hobit vďaka svojej obratnosti a nenápadnosti vie kradnúť nech už vykonáva ktorékoľvek povolanie (v prípade, že by si vybral povolanie ktoré túto schopnosť má a dosiahol by potrebnú úroveň, tak môže túto schopnosť použiť každú hodinu). V prípade, že chce hobit postave ukradnúť niektorú z jej vecí, napríklad, mešec, artefakt, magickú zbraň, amulet a podobne (nemôže kradnúť neherné veci, časti kostýmu alebo zbroje, štít, normálne zbrane), musí na túto vec nenápadne pripevniť štipec (kolíček na prádlo) tak, aby si to obeť nevšimla, a následne si to nesmie všimnúť ani do 30 sekúnd po pripnutí štipca. Po tomto uplynutom čase oznámi hobit postave „okrádam Ťa, daj mi čo je moje“ a ukáže na pripnutý štipec. Postava mu musí okamžite bez reptania danú vec vydať!! Túto schopnosť môže využívať 2x deň.<br /><br /><b>Sorp</b>- Najčastejšie sa vyskytujú v odľahlých dedinách, chatrčiach, alebo  v odľahlých častiach mesta. Ostatné rasy ich podceňujú. Svojim  vzhľadom nevzbudzujú rešpekt.  Ich najčastejšími povolaniami sú  zaklínač, čarodejník. Sú o niečo nižší ako ľudia a mierne zhrbený.  Ich vlasy majú tmavo hnedú alebo čiernu farbu a ich pokožka je mierne (!!!) zafarbená do hneda (nie vždy, ale zväčša). Radi sa obliekajú do dlhých čiernych hábitov s kapucňami.<br />Presvedčenie: 2-6<br />ZR: Ako ktorékoľvek povolanie môže používať tesák a vrhaciu dýku.<br /><br /><b>Dulon</b>- Patria medzi najcivilizovanejšie rasy, z veľkej časti sa podobajú  ľuďom.. Obývajú veľké mestá v ktorých bývajú váženými mešťanmi a tvoria šľachtické triedy. Sú veľmi zruční a živia sa najmä  remeslami. Nevyhľadávajú spory a s ostatnými rasami vychádzajú  dobre. Povolania majú rôzne, ale najčastejšie klerik, mág. Bývajú vždy slušne upravený (umytý, oholený a žiadne extravagantné účesy nenosia).<br />Presvedčenie: 1-7<br />ZR: Duloni sú veľmi obozretný a ostražitý, pre prípad že by ich chcel niekto okradnúť. Túto vlastnosť si vypestovali vďaka dlhým skúsenostiam pri živote v meste plnom zlodejov a podobných nežiadúcich živlov. Takže pokiaľ vám niekto oznámi že vás okráda, jednoducho mu poviete ,,moja obozretnosť si to všimla, mňa neokradneš“ a následne je zlodej odhalený (neplatí na kúzla, magické artefakty a v noci) a už ho aj môžete za jeho opovážlivosť strestať svojim mečom či mocným kúzlom.<br /><br /><b>Lesný elf</b>– Všetci elfovia žijú večne, pokiaľ niesu zabitý, nezomrú od žialu alebo už neunesú tiahu života. Majú svetlú kožu ako ľudia prípadne môže byť ľahko zelená. Ich dlhé vlasy sú väčšinou zelené, rovnako ako obočie ale môžu byť aj svetlé alebo žlté. Rozhodne nemajú žiadne veľké alebo oslie uši. Od ľudských sa líšia miernym zašpicatením. Chovajú veľkú lásku k prírode, ktorej sú veľkými zástancami, a preto si najčastejšie stavajú príbytky v lesoch a korunách stromov. Sú veľmi čestný a bojujú proti zlu. Radi sa priúčajú mágii a vedia veľmi dobre narábať s lukmi. Typické povolanie pre lesných elfov je hraničiar, strelec, klerik (lovec, druid).<br />Presvedčenie: 1-3<br />ZR: Lesný elf vďaka tomu že väčšinu života trávi v lese pozná veľa liečivých bylín. V prípade, že je ranený alebo potrebuje vyliečiť niekto z jeho okolia, vyberie sa pohľadať nejaké liečivé bylinky, ktoré zranený musí zjesť (stačí symbolicky, kúsok). Takto dokáže vyliečiť 3 životy ale byliny môže hľadať len 1x za deň. V prípade že by sa stal hraničiarom platí schopnosť hraničiara.<br /><br /><b>Zlatý elf</b>– Tento názov získali podľa dlhých zlatých vlasov, ktoré sú znakom ich rasy. Žijú v lesoch ale často krát sa usídlujú v mestách ľudí. Na rozdiel od ich lesných bratov, nemajú taký vrúcny v sťah k prírode. Ich rasa tvorí väčšinu elfskej šľachty, ale napriek tomu sa nad ostatných elfov nepovyšujú. Pôsobia vznešenejšie a na prvý pohľad dosť formálne, no napriek tomu bývajú veľmi dobrými priateľmi. Majú pomerne vysokú postavu (asi ako ľudia), ich vlasy majú vždy zlatú farbu a žiaria na slnku. Aj ich koža má zlatý nádych. Ako všetci elfovia ani oni nezarastajú. Ich v sťah k mágii je veľmi silný. Typickými povolaniami pre nich sú mág, čarodejník, klerik, (druid, zaklínač), ale bývajú aj veľmi dobrými diplomatmi či strelcami.<br />Presvedčenie: 1-4<br />ZR: Zlatý elfovia sú jedny z najvhodnejších adeptov na kúzelníkov. Takže pokiaľ sa rozhodne vybrať si ktorékoľvek z kúzelníckych povolaní priráta si k mane +3 body (každou ďalšou párnou úrovňou si priráta k tomuto číslu +1).<br /><br /><b>Derkánsky elf</b>– Pochádzajú z veľkého štátu Derkánia, kde je ich zastúpenie je značne početné. Prevažne žijú v mestách. Sú výborný jazdci. Ich šikovnosť je  preslávená a radi vyrábajú kúzelné predmety. Bývajú veľmi rozvážny a  čestný. Majú modro-šedivú kožu a buď biele, strieborné alebo svetlo šedivé vlasy. <br />Presvedčenie: 1-5<br />ZR: Derkánsky elfovia sú veľmi dobrý obchodní  a preto môžu túto schopnosť (obchodovanie - zjednávanie) použiť ako ktorékoľvek povolanie (v prípade, že by si vybrali povolanie ktoré túto schopnosť má a dosiahli by potrebnú úroveň, cena ktorú by zjednávali by sa namiesto 20% zmenila o 25%). Preto ak sa mu zdá, že dostáva málo peňazí za službu alebo nejakú vec či zbraň, jednoducho začne kupujúceho presviedčať (treba to veľmi dobre zahrať) aby na cene pridal, alebo naopak ak kupuje aby z ceny zhodil a následne povie „zjednávam a obchodujem“ a cena sa musí o 20% zmeniť tak aby vyhovovala derkánskemu elfovi a jeho náprotivok už nemôže cúvnuť!!! Možno použiť 2 x za deň.<br /><br /><b>Targónsky elf</b>- Sú jedny z rady elfov, ale nemajú s nimi moc spoločného. Pochádzajú z bohatej krajiny Targónia kde sú ich počty vysoké, avšak v ostatných krajinách sa vyskytujú len veľmi zriedka. Bývajú v  civilizovaných mestách, kde vytvárajú samostatné komunity.  Podobne ako väčšina zlatých elfov aj oni sú považovaný za elfskú šľachtu. Ostatnými rasami opovrhujú. Sú veľmi namyslení a hrdí. Práve kvôli ich namyslenosti ostatný elfovia ich nemajú príliš v láske a ich šľachtické práva im tvrdo odopierajú. V skupine sa snažia byť vodcom a nedokážu byť pod niekoho  velením. Typické povolania pre túto rasu sú paladín, vojvodca, mág. Pokožka má svetlú farbu (ako u ľudí) a vlasy mávajú svetlé (blonďavé), alebo bledo hnedé.<br />Presvedčenie: 1-7<br />ZR: Pokiaľ by chcel niekto na Targónskeho elfa použiť schopnosť charizma, určite neuspeje (neplatí pre kúzla a magické artefakty) práve kvôli ich hrdosti a nespútanosti.<br /><br /><b>Temný elf</b>- Vyskytuje sa v temných lesoch, v podzemných jaskyniach,  civilizáciu v zásade nenavštevujú. Sú samotári a s ostatnými rasami  moc nevychádzajú. Obzvlášť nenávidia trpaslíkov a škretov. Ich najčastejšie povolanie je strelec, lovec, mág,  čarodejník, černokňažník. Farba ich pokožky je tmavo olivovo-šedá, oči sú čerené a vlasy prevažne čierne alebo tmavo šedé.<br />Presvedčenie: 3-7<br />ZR: Temný elfovia vidia zo všetkých rás v tme najlepšie, preto pri použití strelných a vrhacích zbraní v noci si môžu prirátať +1 k útoku avšak povolanie ktoré vykonávajú, nemôže mať tieto zbrane zakázané a môže túto schopnosť použiť 2x za noc na streľbu a 1x za noc na vrhanie!!!<br /><br /><b>Trpaslík</b>– Sú ďalšou pomerne rozšírenou rasou. Najradšej sa usídlujú vo vysokých horách alebo jaskyniach, ktoré sami vykopali, často pri dolovaní diamantov či drahých kovov. Sú tiež veľmi zručnými remeselníkmi a obchodníkmi. Bývajú dosť uzavretý do seba a priatelia sa len neradi. Dávajú prednosť samote alebo členom svojho rodu. Prejavuje sa u nich chamtivosť a tvrdohlavosť. Majú malé podsadité postavy oplývajúce veľkou silou a odolnosťou. Bez výnimky majú dlhé brady (okrem trpaslíčok), na ktoré sú veľmi pyšný! Najlepšie sa uplatnia v niektorom z bojových povolaní.<br />Presvedčenie: 3-5<br />ZR: Všetci trpaslíci oplývajú špeciálnou schopnosťou zvanou regenerácia. Pokiaľ je trpaslík zranení za každé 4 hodiny sa mu automaticky vylieči 1 život.  <br /><br /><b>Amazonka</b>– Žijú v divočine ďaleko od ľudí, kde si stavajú veľké dediny. Chovajú veľkú nenávisť k mužom a vo všeobecnosti k iným rasám najmä však ku nixom a kentaurom. Ich spoločnosti vládnu ženy. Žiadnou bežnou prácou sa nezaťažujú a všetko sú za nich nútený robiť muži, ktorých držia ako otrokov. Oni sami potom vyrážajú na vojnové výpravy na ktorých drancujú a domov sa vracajú s bohatými úlovkami. Z ľudského hľadiska sa môže zdať že sú dosť primitívne a tomu odpovedá ich chovanie a celkový odpor ku všetkému civilizovanému. Obliekajú sa dosť sporo a často bývajú ovešané šperkami nakradnutými šperkami. Ich povaha nieje príliš dobrá takže moc dobroty sa od týchto drsných ženštin nedočkáme. Sú veľmi silne, obratné a ani odolnosť im nechýba a preto najväčšie uplatnenie získajú v bojových povolaniach. <br />Presvedčenie: 3-7<br />ZR: Počas súboja s mužským pohlavím má +1 do útoku, to vďaka jej neznášanlivosti ktorú k ním chová. Túto schopnosť môže využiť max. 1x za deň a to na celý súboj. Pri súboji s kentaurom alebo nixom má +1 do útoku vždy a bez obmedzenia.<br /><br /><b>Zorx</b>- Sú považovaný za vznik kríženia ľudskej rasy so skurutmi. Táto teória vychádza hlavne s ich výzoru, no opak je pravdou. S ľuďmi a ani so škretími rasami nemajú nič spoločné. Dlho žili v osamelých jaskyniach a preto o nich nikto nevedel. Ich najbližšími príbuznými sú tulpovia. No na rozdiel od tulpov zorxovia nenávidia škretov a im podobné rasy. Ani s ľudmi si moc nerozumejú. Ich najsilnejšou zbraňou sú ich zmysli. Nerobí im žiadny problém zjesť surové ľudské mäso. Najväčšie uplatnenie získajú ako bojovníci.<br />Presvedčenie: 3-6<br />ZR: Pokiaľ zorx nájde čerstvú mŕtvolu alebo sám práve niekoho zabil môže sa z jeho mäsa najesť a tým sa mu doplnia 3 životy.<br /><br /><br /><br /><b><u>Prístup k povolaniam:</b></u><br /><br /><b>Človek</b>– všetky povolania<br /><b>Horal</b>– nesmie byť rytier, strelec, zlodej, mág, čarodejník, klerik, druid, zaklínač, .<br /><b>Nix </b>– nesmie byť rytier, hraničiar, strelec, zlodej, mág, čarodejník, klerik, lovec, druid, zaklínač, šaman .<br /><b>Droub</b>– nesmie byť rytier, hraničiar, strelec, lovec odmien, zlodej, mág, čarodejník, klerik, lovec, zbojník, druid, zaklínač, šaman.<br /><b>Hobit</b>– nesmie byť rytier, žoldnier, vojak, hraničiar, lovec odmien, barbar/berserk, bojovník, lovec, lovec skalpov, zbojník.<br /><b>Sorp</b>– nesmie byť rytier, žoldnier, vojak, hraničiar, strelec, lovec odmien, barbar/berserk, bojovník, lovec, lovec skalpov, zbojník.<br /><b>Dulon</b>– nesmie byť hraničiar, barbar/berserk, lovec, lovec skalpov, zbojník, šaman, druid<br /><b>Lesný elf</b>– nesmie byť žoldnier, vojak, rytier, lovec odmien, barbar/berserk, bojovník, lovec skalpov, zbojník<br /><b>Zlatý elf</b>– nesmie byť žoldnier, vojak, rytier, lovec odmien, hraničiar, barbar/berserk, bojovník, lovec, lovec skalpov, zbojník, druid, šaman.<br /><b>Derkánsky elf</b>– nesmie byť rytier, vojak, barbar/berserk, bojovník, zbojník<br /><b>Targónsky elf </b>– nesmie byť barbar/berserk, lovec, lovec skalpov, zbojník, šaman, druid.<br /><b>Temný elf</b>– nesmie byť rytier, vojak, žoldnier, barbar/berserk, bojovník, druid. <br /><b>Trpaslík</b>– nesmie byť mág, čarodejník, klerik, zlodej, hraničiar, strelec, rytier, lovec, šaman, druid, zaklínač. <br /><b>Amazonka</b>-  nesmie byť mág, čarodejník, klerik, zlodej, rytier, druid, zaklínač.<br /><b>Zorx </b>-  nesmie byť rytier, lovec odmien, zlodej, strelec, mág, čarodejník, klerik, druid, zaklínač.<br /><br /><b><u>Požiadavky:</b></u><br /><br /><b>Človek</b>– žiadne<br /><b>Horal</b>– musí byť, veľký, pevnej stavby, neupravený!!!<br /><b>Nix </b>– len mužské pohlavie, nesmie mať vlasy!! a mal by byť vyššej a pevnej postavy!<br /><b>Droub</b>– musí mať min 190 cm, 85 kg, jemne zelenú pleť, neupravený! <br /><b>Hobit</b>– musí byť malej útlej postavy s kučeravími vlasmi!<br /><b>Sorp</b>– musí byť mierne zohnutý, farbu pleti mierne hnedú!!!<br /><b>Dulon</b>– musí byť upravený!!!<br /><b>Lesný elf </b>– musí byť oholený, chudý, mať dlhé vlasy (zelene/hnedé) a špicaté uši!!!<br /><b>Zlatý elf </b>-  musí byť oholený, chudý, mať dlhé vlasy (blond/zlaté) a špicaté uši!!!<br /><b>Derkánsky elf </b>– musí byť oholený, chudý, mať dlhé vlasy (biele/svetlo šede) a špicaté uši a farbu pokožky mierne modro-šedú!!!<br /><b>Targónsky elf</b>– musí byť oholený, chudý, mať dlhé vlasy (blond/bledo hnedé) a špicaté uši!!! <br /><b>Temný elf</b>- musí byť oholený, chudý, mať dlhé vlasy (čierne/tmavošedé) a špicaté uši a farbu pokožky tmavo-olivovo-šedú, pokiaľ možno červené oči :) !!!<br /><b>Trpaslík </b>- musí byť, malý, pevnej stavby, s bradou!!!<br /><b>Amazonka </b>– len ženské pohlavie, najlepšie v kožených kostýmoch, sú feministky!!!<br /><b>Zorx –</b>musí byť neupravený s desivým výzorom podobným skurutom (doporučujem použiť masku) a s farbou pokožky bledo zelenou alebo bledo hnedou!!!<br /></p><br />";

var ryt="<h3 onclick=\"document.getElementById('ryt').innerHTML=ryta\">Rytier:</h3><p>Rytierom sa v dávnych časoch nemohol stať len tak niekto. Sú to veľmi oddaný bojovníci za svoje presvedčenie, vieru, či svojho pána dokážu položiť aj život. Zdobia ich také vlastnosti ako sú vernosť, čestnosť, odvaha ku ktorým sú od malička vedený! Značne opovrhujú žoldniermi pre ich sebeckosť, mamonárstvo a nemorálne správanie. Kvôli ich zapálenosti pre konanie dobra sú tŕňmi v oku rôznych čiernokňažníkov, nekromantov a podobnej temnej hávede. Už veľa krát sa stalo že svojimi podlými trikmi zviedli nejedného rytiera či dokonca paladina na stranu temnoty (padlý paladinovia, lúpeživý rytieri a pod) . Takže rytieri, dávajte si pozor a nerobte hanbu dobrému menu rytierstva!!Každá postava ktorá sa chce stať rytierom začína na nultej úrovni ako panoš a na prvej úrovni je pasovaný do stavu rytierskeho. Na vyšších úrovniach môže byť za svoju oddanú službu povýšený až na samotného paladina.<br /><br />Životy: 8, za úroveň +4 na každej párnej +5<br />Zbrane: používa krátke, stredné, ťažké, iné nepoužíva!<br />Špecializácia: na ťažké zbrane<br />Zbroje: všetky<br />Štíty: všetky<br />Presvedčenie: 1, 2<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – ťažké zbrane +1 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />1. úroveň<br />Odhaľ zlo<br />Rytier vďaka svojmu boju za dobro dokáže zistiť či jeho protivník je zlý alebo absolútne zlý. Pokiaľ je rytier dobro dokáže zistiť len absolútne zlo. Rytier je chvíľu ticho a sústredí sa zhruba po 2 minútach ukáže prstom na postavu, ktorej chce vedieť presvedčenie a povie „odhaľujem absolútne zlo, ak sa v Tebe skrýva“. V tej chvíli postava ak je absolútne zlá musí to povedať! V prípade, že je rytier absolútne dobro, dokáže zistiť aj zlo. V tom prípade povie „odhaľujem zlo, ak sa v Tebe skrýva“ a vtedy ak je postava zlá alebo absolútne zlá musí to povedať. Schopnosť možno využiť raz za 2 hodiny.<br /><br />Obeta<br />Pokiaľ rytier chce tak môže na seba zobrať zásah ktorý dostal niekto iný. Napríklad jeho spolubojovník dostane zásah za 2 životy, rytier sa ho musí hneď na to dotknúť a povedať „Tvoje zranenie je moje“ a životy si odpočíta on. Môže to použiť 5 x za deň. <br /><br />2.úroveň<br />Oprav zbroj<br />Počas častých bojov sa rytieri naučili opravovať zbroje. Túto schopnosť môže využiť len mimo boja. Zbroj si musí vyzliecť a veľmi dobre zahrať jej opravu (aspoň 15 minút). Opravou sa doplní polovica bodov z pôvodného počtu. Opravovať môže 2x za deň.<br /><br />Odzbrojenie <br />Touto schopnosťou dokáže rytier protivníka odzbrojiť. Svojou zbraňou sa pri tom musí dotknúť jeho zbrane a povedať „odzbrojujem Ťa“ . Protivník musí následne zbraň odhodiť minimálne 4 metre od seba pokiaľ je 1 ručná ak má 2 ručnú (čiže všetky ťažké, bastard musí byť v dvoch rukách, tyčové luky a kuše) musí ju odhodiť 2 m. Odzbrojenie môže použiť 1 x za 2 hodiny.<br /><br />3. úroveň<br />Svätý úder<br />Vďaka rytierovej odhodlanosti byť sa za vieru, mu boh posvätí zbraň a najbližším úderom zraní protivníka o 5 životy naviac ako zraňuje jeho zbraň (ak zraňuje za 2 + svätý úder 5 výsledná hodnota bude 7 životov). Rytier sa musí nahlas alebo po šepky modliť (asi tak minútu si brble nejakú modlitbu, môže aj počas boja), následne zdvihne zbraň k nemu a zakričí „pocíť hnev boží“ a následným platným zásahom ho zraní. Schopnosť môže použiť 1 x za 6 hodín.  <br /><br />Svätá ochrana <br />Ešte pred samotným bojom si rytier na chvíľu (asi tak 1-2 minúty)  pokľakne a v tichosti sa modlí. V následnom boji je imúnny voči prvému zásahu, kúzlu či schopnosti, ale musí na to reagovať okamžitým vykríknutím „boh ma ochráni“. Môže to použiť 1 x za 3 hodiny.<br /><br />4. úroveň<br />Drakobíjec<br />Rytieri sú veľmi skúsený lovci drakov. Preto si časom vytvorili čiastočnú imunitu na dračí plameň a ten ich zraňuje len za polovicu a neplatí na nich dračie zastrašenie. Taktiež pri útoku na draka majú bonus +2 do útoku. Schopnosť je automatická a neobmedzená pri boji s drakom.<br /><br />Jazdectvo<br />Vďaka tejto schopnosti dokáže rytier vysadnúť na koňa a bojovať z neho. (každopádne najprv musí nejakého mať). Každý hráč ktorý chce používať túto schopnosť si musí na akciu koňa doniesť.<br />Kôň – je to klasické zviera ktoré môže hráč v hre získať, avšak môže ho používať len v prípade pokiaľ má schopnosť jazdectvo (v nehernom ponímaní je to drevená palica o dĺžke 100 – 120 cm kde v prednej časti musí mat spravenú hlavu (primerane veľkú) a v zadnej chvost. Keď chce postava jazdiť na koni musí mať palicu umiestnenú medzi nohami a musí ju držať rukou alebo ju mať ináč upevnenú ). Akékoľvek prvé tri útoky zbraňou na jazdca vykryje kôň a potom umiera. V prípade že kôň dostal len dva zásahy môže sa neskôr herne vyliečiť. Taktiež môže kôň raz za boj uštedriť nepriateľovi nepríjemne zranenie. V prípade že sa jazdec s hlavou koňa dotkne súpera a zakričí ,,kusnutie“ postava je zranená za 2 životy ale nesmi mať na sebe strednú alebo ťažkú zbroj. Pokiaľ ja jazdec dotkne postavy zadnou časťou koňa a zakričí ,,kopnutie“ je postava zranená za 3 životy ( platí na všetky zbroje okrem plátovej, v tedy by bola postava zranená len za jeden život). <br />Kôň má taktiež schopnosť ,,cval“, ktorú rytier ocení v situácii z ktorej sa potrebuje čo najrýchlejšie dostať preč. Napríklad sa ocitne proti presile nepriateľov, tak jednoducho zakričí ,,koník môj, cválaj rýchlo preč“ a pritom ho buchne dva krát po tele (čiže po palici), a začne bežať smerom preč od nepriateľov. Tí ho však nesmú prenasledovať a musia ho nechať utiecť. Prenasledovať by ho mohli len v prípade že by tiež mali kone. Túto schopnosť možno použiť len v prípade že je kadiaľ utiecť (to znamená, že jazdec nesmie byť obkľúčený, alebo zatvorený medzi hradbami a pod.) a len 1 x za 4 hodiny. Na koni sa tiež môžu viesť dvaja (nie viac!!) ľudia, avšak s tým že aspoň jeden musí mať jazdectvo (aj pri dvoch jazdcoch možno využiť schopnosť cval).<br /><br />5. úroveň<br />Špecializácia na zbraň – ťažké zbrane +2 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />Čestný súboj<br />Rytier na tejto úrovni môže na čestný súboj vyzvať akéhokoľvek nepriateľa (nie však beštie) a ten mu tento súboj nemôže odoprieť hoc by sám nechcel. Stačí ak rytier ukáže na nepriateľa svojou zbraňou a povie: „vyzývam Ťa na četný súboj“ a nepriateľ je povinný s rytierom bojovať až na smrť alebo pokiaľ sám rytier súboj neukončí. Pri tomto súboji však nesmie ani jeden so súperov používať akékoľvek schopnosti, jedy, uspávadlá, lektvari, schopnosti zbrani, amuletov a pod. Jedinú výnimku tvoria kúzelnici ktorý môžu pri súboji kúzliť (vzhľadom k tomu že kúzlenie je jediný spôsob ich boja). Túto schopnosť môže použiť 3x za deň.<br /><br />6.úroveň<br />V mene dobra<br />V prípade, že rytier ide bojovať za nejakú dobrú vec alebo je sám napadnutý, a v jeho blízkosti sa pohybuje osoba ktorá je dobrá alebo absolútne dobra a evidentne sa do situácie nechce zapojiť, môže rytier ku nej prísť, položí ruku na jej rameno a pošepne do ucha: „v mene dobra, pomôž mi“. Na toto vyzvanie musí každá postava ktorá je dobrá alebo absolútne dobrá rytierovi pomôcť (hoc by aj sama nechcela). Túto pomoc musí vykonávať najbližších 20 minút (alebo aj menej ak vykonanie úlohy bude trvať kratšie), alebo pokiaľ jej životy nepadnú pod základné životy na 0.úrovni. Schopnosť môže rytier využiť 1x za 4 hodiny.</p>";

var zld="<h3 onclick=\"document.getElementById('zld').innerHTML=zlda\">Žoldnier:</h3><p>Veľmi zručný bojovníci hlavne čo sa týka tyčových zbraní. Zakladajú samostatné spolky v ktorých ponúkajú svoje služby a vojenské umenie. Za slušný balík peňazí sú schopný vykonať čokoľvek a vôbec ich netrápi či pracujú pre stranu dobra alebo zla. Jediné na čom im záleží sú oni sami a ich riadne plný mešec peňazí či šperkov ktoré získali popri výkone ich práce (prešacovanie mŕtvol a pod.). Dá sa povedať že ich hodnoty sú presne opačné ako u rytierov a preto sa nemajú moc v láske.<br /><br />Životy: 7, za úroveň +4<br />Zbrane: používa krátke, stredné, tyčové, luky, kuše, vrhacie, iné nepoužíva! Špecializácia: na tyčové zbrane<br />Zbroje: používa ľahké a stredné<br />Štíty: nepoužíva<br />Presvedčenie: 3-5<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – tyčové zbrane +1 (od útoku).<br /><br />1. úroveň<br />Úskok<br />Žoldnier sa svojou obratnosťou dokáže zásahu uhnúť. Pokiaľ dostane zásah od protivníka ktorého vidí (nedá sa použiť pri útoku od chrbta a pod.), zakričí „uskakujem“ odskočí tak meter dozadu a životy si jednoducho neodpočíta. Toto neplatí na kúzla ani schopnosti. Úskok môže použiť každé 1 x za 2 hodiny.<br /><br />Prerazenie štítu<br />Pri útoku žoldniera na protivníka so štítom (platí len na súpera so štítom), žoldnier zakričí „prerážam Tvoj štít“ dotkne sa jeho štítu svojou zbraňou a protivníka proste zraní. Schopnosť môže použiť každé 4 hodiny.<br /><br />2. úroveň<br />Obchodovanie – zjednávanie<br />Žoldnieri vedia veľmi dobre zjednávať obchody. Preto ak sa mu zdá, že dostáva málo peňazí za službu alebo nejakú vec či zbraň, jednoducho začne kupujúceho presviedčať (treba to veľmi dobre zahrať) aby na cene pridal, alebo naopak ak kupuje aby z ceny zhodil a následne povie „zjednávam a obchodujem“ a cena sa musí o 20% zmeniť tak aby vyhovovala žoldnierovi a jeho náprotivok už nemôže cúvnuť!!! Možno použiť 3 x za deň.<br /><br />Sebavedomie<br />Počas boja sa zodvihne žoldnierovi sebavedomie tak, že keď dá platní zásah, odpočíta si 1 bod z útoku a „zakričí, tvoja bolesť ma posilní“ môže si pridať 1 život. Napríklad zraňuje za 3 životy, použije túto schopnosť (zakričí za 2 životy), protivník si odpočíta 2 životy a žoldnier si 1 pridá. Schopnosť môže použiť 1 x za 2 hodiny.<br /><br />3. úroveň<br />Odtlačenie<br />Pri tejto schopnosti musí mat žoldnier v ruke tyčovú zbraň a pokiaľ sa k nemu dostane protivník príliš blízko, tak sa ho ňou dotkne a zakričí „odtláčam Ťa“. Vtedy musí súper ustúpiť o 3 metre dozadu. V každom boji to môže použiť len raz.<br /><br />Chladnokrvnosť<br />V prípade, že žoldnier utrpí zranenie (jedným úderom) za 4 životy a viac, jeho nasledujúci útok bude mať + 4 k jeho zbrani a musí zakričať „teraz okúsiš môj hnev“ (ak zbraň zraňuje za 2, útok bude za 6 životov). Môže to použiť raz za boj v ktorom dostal taký zásah, maximálne však 5 x za deň.<br /><br />4. úroveň<br />Najatie <br />Pokiaľ nejaká postava hľadá ľudí na určitú prácu alebo výpravu tak žoldnier dokáže túto postavu presvedčiť o tom, že on je ten pravý pre túto robotu a postava ho musí najať hoc by to aj nechcela. Stačí ak žoldnier danú postavu aspoň 3 minúty presviedča o jeho kvalitách a na konci rozhovoru povie: „najmi ma na tento kšeft“. Ukončenie tohto záväzku môže len dokončenie roboty na ktorú bol najatý, alebo kedykoľvek sa sám žoldnier rozhodne prípadne aj postava ktorá ho najala ak by počas úlohy zistila že žoldnier nejedná v prospech kladného dokončenia úlohy alebo celu úlohu nejako ohrozuje svojim konaním. Najatie môže použiť len jeden krát za deň (neplatí to však na osobu ktorá ho v minulosti už najala a z práce následne odvolala z dôvodov vyššie uvedených).<br /><br />Alkohol <br /> Žoldnieri sú povestný s vojov láskou k alkoholu ktorého za svoj život vypijú nespočetné množstvo. Preto vie žoldnier dobre rozpoznať kvalitu alkoholu, jeho silu, prípadne aj to, či mu niekto do alkoholického (len!!) nápoja nalial nejaký jed, uspávadlo, lektvar, prípadne či krčmár riedi alkohol čistou vodou  a pod. Táto časť schopnosti je automatická, stačí ak si žoldnier pričuchá k alkoholu a omočí pery.V prípade že sa žoldnier pred bojom posilní alkoholom (herným!!) a zakričí: „lepšie umrieť opitý než triezvy“ a počas celého boja má +1 do útoku a +3 životy. Navyše ak by mal nejaké vážne zranenie ktorejkoľvek časti tela (okrem hlavy), dokáže potlačiť bolesť (čiže ak ma počas boja zranenú nohu tak nebude krívať, ak má napríklad zranenú ruku kľudne v nej môže držať zbraň a bojovať).<br />Schopnosť platí len počas boja a môže je použiť 1x za 4 hodiny.<br /><br />5. úroveň<br />Špecializácia na zbraň – Tyčové zbrane +2 (od útoku). Navyše pokiaľ zasiahne tyčovou zbraňou koňa tak ten umiera po prvom zásahu.<br /><br />Žoldnierova pýcha<br />Žoldnieri sú veľmi pyšný a preto na nich nepôsobia podobne schopnosti ako je charizma, nedajú sa len tak ovplyvniť či nanútiť im iný názor. Navyše na takto vysokej úrovni žoldnier predstavuje pre žoldnierov na nižších úrovniach akýsi vzor, a v prípade že tento žoldnier potrebuje s niečím pomôcť stačí ak o túto pomoc požiada ktoréhokoľvek žoldniera na nižšej úrovni ako je sám (samozrejme že nemôže žiadať postavy ktoré majú medzi sebou herne spory či bojujú na opačnej strane). Na pomoc môže prehovoriť len toľko žoldnierov akú má sám úroveň (napríklad je na úrovni 5 tak môže ovplyvniť max. 5, s každou ďalšiou úrovňou číslo narastá). Pomáhať mu budú maximálne deň, alebo pokiaľ v ich očiach nespraví niečo proti čomu by sami boli, alebo ich sám nerozpusti. Schopnosť teda môže používať toľkokrát za deň, aká je vysoká jeho úroveň samozrejme s tým že nemôže mat okolo seba viac žoldnierov než je jeho úroveň. Na použitie schopností stačí ak danému žoldnierovi (alebo skupinke) bude 5 minút rozprávať a svojich (aj vymyslených) udatných skutkoch a v podstate ich namotávať aký je dokonalý  a na konci povie: „tak a teraz ma nasledujte“, a oni pôjdu za jeho príkazmi. Avšak tú istú postavu môže ovplyvniť max. 1x za 3 dni.<br /><br />6.úroveň<br />Pes<br />Mnohý žoldnieri si na svoje výpravy brávajú aj svojich bojových psov. Pri tejto schopnosti je potrebné aby si hráč na akciu doniesol nejakého plyšového psa o rozmeroch okolo 15 – 20 cm, ktorý musí byť priviazaný na špagáte dlhom maximálne 5 metre a druhý koniec špagátu musí mať žoldnier priviazaný k svojmu telu. V prípade, že chce psa použiť, stačí ak ho po súperovi hodí (len nie do hlavy a genitálií!!) a zakričí „trhaj“. V prípade že súpera trafil je zranený za 4 životy. Ak by  však súper trafil psa v lete (skoku) zbraňou, pes je mŕtvy. Inak sa na psa útočiť nedá!! Pokiaľ hraničiar príde o svojho psa, musí si zohnať druhého (organizátor vám povie ako). Psa možno použiť 1 x za 2 hodiny.</p>";

var voj="<h3 onclick=\"document.getElementById('voj').innerHTML=voja\">Vojak:</h3><p>Vojaci prechádzajú veľmi ťažkými výcvikmi a preto dokážu veľmi obstojne narábať so všetkými zbraňami okrem strelných. Preto po skončení výcviku sa veľmi často stávajú hlavným oddielom armád, obrancami pevnosti, či sa len tak rozhodnú vydať na cestu potulných dobrodruhov. Na vyšších úrovniach za ich činy môžu byť povýšený na veriteľov pevnosti alebo vojvodcami vojsk. Je len a len na nich ako vysoko dotiahnú svoju vojenskú kariéru.<br /><br />Životy: 8, za úroveň +4 na každej párnej +5<br />Zbrane: používa krátke, stredné, ťažké, tyčové, vrhacie, iné nepoužíva!<br />Špecializácia: na ťažké zbrane<br />Zbroje: všetky<br />Štíty: malý, stredný<br />Presvedčenie: 1-7 <br />Schopnosti:<br /><br /><br />0. úroveň<br />Špecializácia na zbraň – ťažké zbrane +1 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />1. úroveň<br />Odhad životov<br />Vojak vie veľmi dobre zhodnotiť súperove sily. Stačí ak sa na neho chvíľu sústredene pozerá (asi tak 1 minútu) a potom ukáže prstom na postavu a povie „zisťujem Tvoje životy“. Tá mu následne musí povedať, koľko má životov. Schopnosť môže použiť raz za hodinu.<br /><br />Liečenie životov<br />Každý vojak si musí vedieť obviazať svoje zranenie, alebo zranenia svojich druhov. K tejto schopnosti potrebuje obväzy a symbolicky obviazať niektorú časť tela sebe alebo ostatným. Po obviazaní sa životy doplnia až za 30 minút. Po túto dobu je potrebné obväzy nosiť! Vojak dokáže vyliečiť  max. 3 životy a schopnosť môže použiť raz za 2 hodiny.<br /><br />2. úroveň<br />Fiktívny život<br />V prípade, že vojakovi dojdú životy a mal by byť už v mínuse 2 životy (ak je to viac automaticky zomiera) dokáže zhromaždiť zvyšky svojich síl a nasledujúcich 30 minút ešte žiť. Počas tejto doby nemôže bojovať, je malátny, predstiera bolesť apodobne. V prípade, že by nebol do tohto času ošetrený (vtedy sa sám nemôže) zomiera. Schopnosť môže použiť raz za 4 hodín.<br /><br />Nabrúsenie zbrane<br />Na tejto úrovni sa vojak dokáže naučiť špeciálne brúsiť zbrane. Pri nasledujúcom útoku ma jeho zbraň + 1 do útoku a platí na dva platné zásahy a potom zraňuje ako normálne (čiže bez bonusu). Nedá sa kumulovať! Nabrúsiť zbraň si môže 1 x za 2 hodiny.<br /><br /><br /><br />3. úroveň<br />Prerazenie krytu<br />Aj keď protivník vykryje vojakov útok, stále ho môže zraniť. Stačí ak pri útoku zakričí „prerážam Tvoj kryt“ a napriek protivníkovmu vykrytiu je zranený v plnom rozsahu. Schopnosť môže použiť 1 x za 4 hodiny. Nemožno ju použiť na bojovníka.<br /><br />Magický odpor<br />Je to schopnosť, vďaka ktorej sa vojak stáva po dobu 5 minút imúnny voči všetkým útočným kúzlam (pod útočným kúzlom sa rozumejú firebally). Stačí keď si predtým 3 x vyskočí na mieste do vzduch a pokaždé povie „mágia ma nezraní“. Ak bude zasiahnutý útočným kúzlom (ostatné totiž platia) musí povedať „Tvoje kúzla sú na mňa krátke“. Schopnosť môže využiť 1 x za 4 hod.<br /><br />4. úroveň<br />Zohranosť<br />Vojaci sú vycvičený, aby bojovali v armádach a vojskách, preto sú zvyknutý na tímovú prácu. Stačí ak pred bojom bude 10 minút trénovať s postavami ktoré si vyberie (platí len na povolania vojak, bojovník a žoldnier) a povie „toto sú moji bratia v zbrani“ a potom majú všetci počas celého boja +1 k útoku ale musia útočiť ako formácia, prípadne sa držať pre sebe (nemôžu byť od toho čo ich trénoval viac než 5 metrov). Boj musí nastať najneskôr hodinu po tréningu, inak musia trénovať nanovo. Takýto tréning môže spraviť vojak max. 1x za 6 hodín a trénovať môže toľko postáv aká je sám úroveň (čiže na 4tej úrovni môže trénovať so štyrmi na 6tej so šiestimi,...).<br /><br />Ľahký spánok<br />Aj keď vojak spí, je to len veľmi ľahký spánok pre prípad, že by sa ho niekto v noci pokúsil zabiť či okradnúť. Stačí ak si pred spaním na niektorú z rúk viditeľne uviaže žltú šatku či kus látky. V prípade, že v noci príde nechcený návštevník a uvidí tento symbol, musí odísť, alebo zobudí vojaka a musí počkať, kým sa pripraví na boj (napr. mimo stanu), alebo by mu chcel niečo ukradnúť musí ho najprv zobudiť!!! V prípade, že vojak takto označený nebude, nemusí ho budiť a môže spraviť čo chce, ale ak je označený a o niečo sa pokúsi je to neplatné!!! Schopnosť ne neobmedzená, automatická (po uviazaní látky) a platí len počas spánku.<br /><br />5. úroveň<br />Špecializácia na zbraň – ťažké zbrane +2 (od útoku), (bastard musí byť v 2 rukách!!!).<br /><br />Výcvik zbraní<br />Keďže sa vojak celý život zaoberá výcvikom s rôznymi zbraňami a štítmi tak na tejto vysokej úrovni vie vojak používať všetky štíty a všetky zbrane. Navyše okrem špecializácie na ťažké zbrane sa začína špecializovať aj na tieto: krátke, stredné, tyčové, vrhacie a meč bastard (v jednej ruke), preto má od tejto úrovne pri ich použití +1 (do útoku). Taktiež sa časom zdokonalilo aj vojakové brúsenie zbrane. Stačí ak si pred súbojom nabrúsi poriadne zbraň a počas boja bude mať jeho zbraň + 2 do útoku a platí na dva platné zásahy a potom zraňuje ako normálne (čiže bez bonusu)! Nabrúsiť zbraň si môže 1 x za 2 hodiny.<br /><br />6.úroveň<br />Bojový ošiaľ<br />V zápale boja sa u vojaka nakopí veľká sila, ktorú potom môže uvolniť v jedinom údere. Tento úder však nemôže byt prvým v súboji ktorý vojak dal (aspoň raz už musel vojak nepriateľa zraniť). Pri následnom platnom zásahu bude mať vojak + 5 k jeho zbrani a musí zakričať „boj ma napĺňa silou“ a číslo akým súpera zranil (ak zbraň zraňuje za 2, útok bude za 7 životov). Môže to použiť 1x za 3 hodiny.</p>";

var hrn="<h3 onclick=\"document.getElementById('hrn').innerHTML=hrna\">Hraničiar:</h3><p>Ich život sa z väčšej časti odohráva v lesoch. Preto sa v hraničiarskych školách učia  prežiť v divočine a ako najlepšie čerpať z darov prírody. Na oplátku ju ochraňujú a dá sa povedať že robia strážcov lesného poriadku. Dávajú pozor na pytliakov, drevorúbačov, strážia lesné hranice pred pašerákmi, ošetrujú zvieratá a veľa iných užitočných vecí. Majú veľa podobného s druidmi a lovcami a často ich môžeme vidieť spolu ako si pomáhajú a navzájom vymieňajú skúsenosti.<br /><br />Životy: 6, za úroveň +3 na každej párnej + 4<br />Zbrane: používa krátke, stredné, luky, vrhacie, iné nepoužíva!<br />Špecializácia: stredné zbrane<br />Zbroje: používa ľahké a stredné<br />Štíty: nepoužíva<br />Presvedčenie: 1-4<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – stredné zbrane +1 (od útoku).<br /><br />1. úroveň<br />Liečivé byliny<br />Hraničiar pozná veľa liečivých bylín. V prípade, že je ranený alebo potrebuje vyliečiť niekto z jeho okolia, vyberie sa pohľadať nejaké liečivé bylinky, ktoré zranený musí zjesť (stačí symbolicky, kúsok). Takto dokáže vyliečiť 2 životy za hodinu.<br /><br />Odrazenie šípu<br />Jednou so silných stránok hraničiara je postreh a v prípade, že ho trafí šíp, jednoducho strelcovi oznámi „odraziť Tvoj šíp nieje pre mňa problém“ (životy si samozrejme neodráta). Túto schopnosť môže využiť v každom boji len raz a len v prípade že o strelcovi vie.  <br /><br />2. úroveň<br />Maskovanie<br />V prípade, že hraničiara niekto sleduje, alebo sa sám potrebuje niekde ukryť, použije maskovanie. Samozrejme že to nefunguje v meste, pokosenej lúke a podobne. Proste sa musí byť za čo skovať a musí zakričať „maskujem sa“ a hráči musia predstierať, že ho nevidia! Vo chvíli keď však chce túto schopnosť použiť musí byť aspoň 10 metrov od postáv pred ktorými sa chce skovať. V opačnom prípade ho budú vidieť. Aby nebol odhalený musí sa skrývať v tichosti a nemôže sa hýbať. Maskovanie môže využiť 4 x za deň. <br /><br />Pes<br />Mnohý hraničiari si na svoje obchôdzky lesom brávajú aj svojich verných psov. Pri tejto schopnosti je potrebné aby si hráč na akciu doniesol nejakého plyšového psa o rozmeroch okolo 15 – 20 cm, ktorý musí byť priviazaný na špagáte dlhom maximálne 4 metre a druhý koniec špagátu musí mať hraničiar priviazaný k svojmu telu. V prípade, že chce psa použiť, stačí ak ho po súperovi hodí (len nie do hlavy a genitálií!!) a zakričí „trhaj“. V prípade že súpera trafil je zranený za 3 životy.<br />Psa možno použiť 1 x za 2 hodiny.<br /><br />3. úroveň <br />Hnev prírody<br />V tomto prípade hraničiar požiada o pomoc prírodu. Stačí ak sa skloní k zemi, naberie do rúk lístie, trávu alebo zem, vyhodí ich do vzduchu a zvolá „ó mocná príroda, zošli mi svoju pomoc“. V tej chvíli sa spustí silný vietor, zem sa začne triasť a všetci v okruhu 5 metrov musia popadať na zem a zhruba 2 minúty sa nemôžu postaviť. Môžu sa však pohybovať po štyroch alebo sa brániť! Túto schopnosť môže využiť 1 x za 6 hodín a nemožno ju použiť na hraničiara ani druida.<br /><br />Drevorúbač<br />Hraničiar tiež môže na niekoho zhodiť strom, avšak tento strom tam musí reálne byť a musí to spraviť sekerou alebo mečom. Postaví sa pri strom ktorý chce zoťať a zažne do neho sekať. Ak ma sekeru stačí 7 krát ak meč 12 krát. V prípade ak sa nepriateľ nachádza v blízkosti 5 metrov hraničiar na neho ukáže prstom a zakričí „padá strom“. Pokiaľ je nepriateľov v blízkosti viac, sám určí na koho padne Padajúci strom spôsobí zranenie za 8 životov. A možno ho použiť 1 x za 8 hodín. <br /><br />4. úroveň<br />Plíženie<br />Každý skúsený hraničiar sa vie k svojmu cieľu potichu a nenápadne priblížiť. Samozrejme pri tom musí využívať vhodne podmienky ako napríklad tmu, vysokú trávu, tmavý les a pod. Stačí ak si na hlavu uviaže zelenú šatku, potrie si farbou, popolom alebo blatom tvár, a začne sa pomaly a potichu plížiť smerom k svojmu cieľu a pre tento cieľ sa stane taký nenápadný že sa k nemu môže nepozorovane prikradnúť až na blízkosť 5 metrov samozrejme ak to vyššie uvedené podmienky dovoľujú. Avšak nepozorovateľným sa stáva len pre danú postavu (či skupinku) ku ktorej sa plíži a tá sa musí tváriť že si ho nevšimla (samozrejme ak bude napadne hlučný, či sa nebude zakrádať tak si ho všimnú). Ak by bol niekto iný v okolí tak je šanca že tí ho uvidia. Schopnosť môže použiť 1x za 6 hodín. <br /><br />Obozretnosť<br />Hraničiar sa svojimi skúsenosťami stáva čoraz obozretnejší a v prípade že je niekde nastražená pasca (napr. nejaká nášľapná pasca) alebo nebezpečne miesto v prírode (napr. kde hrozí zavalenie skalami) tak to vie vycítiť a toto miesto obíde (keď napr. skočí na pascu, tak sa mu jednoducho nič nestane) alebo na dané miesto proste nepôjde. Táto schopnosť je automatická a neobmedzená.<br /><br />5. úroveň<br />Špecializácia na zbraň – Stredné zbrane +2 (od útoku).<br /><br />Bylinky a lesné plody<br /> Svojim životom v lese sa hraničiar naučil využívať všetky možne byliny a plody ktoré mu les dáva. Stačí ak v správnej kombinácii 30 minút povarí dané ingrediencie (samozrejme že zvlášť ingrediencie na jed zvlášť na liečenie a pod.) a z tých následne vytlačí príslušný extrakt stredne silný.Liečivý extrakt (z bylín) (1 dávka = 3 použitia) -  ak ho ranený vypije tak sa mu behom 30 minút doplní 8 životov alebo si ho môže naliať priamo do rany a tým sa mu doplnia za 5 minút  4 životy.<br />Jedový extrakt (z plodov) (1 dávka = 2 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane čí hrot šípu (žiadne kladivá a palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). V jedle či vode účinkuje za 5 minút ak je na zbrani, tak okamžite. Obeť si po dobu 10 minút za každé uplynuté dve minúty odpočíta 1 život (ak bola použitá zbraň tak si na začiatku odpočíta aj jej zranenie). Obeti však treba oznámiť že ste na ňu použili stredný jed a jeho účinky.<br />Uspávací extrakt (z ihličia) (1 dávka = 2 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla alebo pitia,  (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 5 minút ak sa vypije samostatne, tak okamžite. Obeť si následne pospí zhruba 30 minút. Treba jej však oznámiť že ste na ňu použili uspávadlo strednej sily a jeho účinky.<br />Halucinogénny extrakt (z hríbov) (1 dávka = 3 použitia) - použiť sa dá samostatným vypitím, pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať). V jedle či vode účinkuje za 10 minút ak sa vypije samostatne, tak za 5 minút. Obeť následne musí zhruba 20 minút predstierať najrôznejšie vidiny či halucinácie. Treba jej však oznámiť že ste na ňu použili halucinogén strednej sily a jeho účinky.<br /><br />Každý deň môže hraničiar navariť max. jednu dávku z každého extraktu.<br /><br />6.úroveň<br />Pes strážca<br />Hraničiar sa môže nechať strážiť svojim psom (ktorého získal na druhej úrovni a má jeho rekvizitu na hre - minimálne rozmery psa sú 15x20 cm) napríklad počas spánku, oddychu, jedenia a pod. (je jedno či cez deň alebo v noci). Tento pes potom vykonáva stráž aby sa jeho pánovi nič nestalo, resp. keby ho chcel niekto okradnúť, prepadnúť či zabiť, pes ho včas varuje. Pokiaľ teda chce dať hraničiar psa na stráž, musí jeden koniec špagátu uviazať o svoj príbytok alebo seba a na druhý koniec uviazať psa. Špagát však môže byť dlhý max. 5m. a pes musí byť niekde viditeľne položený! V prípade že by sa ktokoľvek priblížil na vzdialenosť menšiu než 10 m ku psovi (vrátane neviditeľných) musí v tom momente hlasno 5x zaštekať (musí to byť naozaj hlasno, lebo v podstate tento váš štekot predstavuje štekot psa na stráži!!). Psa je tiež možné zastreliť (prípadne zabiť vrhaciou zbraňou alebo nosičom útočného kúzla), avšak ak ho netrafíte prvým nanajvýš druhým šípom (dva pokusy platia aj pre vrhaciu zbraň a nosič útočného kúzla) začne (respektíve vy začnete!) automaticky štekať nech strieľate z akejkoľvek diaľky. Môžete ho zabiť aj zbraňou z blízka jediným úderom, ale musíte si pri tom automaticky odrátať 3 životy. Pokiaľ hraničiar príde o svojho psa, musí si zohnať druhého (organizátor vám povie ako). Schopnosť je automatická (po dosiahnutí tejto úrovne a umiestnení psa) a neobmedzená. </p>";

var str="<h3 onclick=\"document.getElementById('str').innerHTML=stra\">Strelec:</h3><p>Dobrý strelec je neodmysliteľnou súčasťou každej skupiny. Ich schopnosť narábať so strelnými zbraňami je priam úchvatná no bohužiaľ veľmi dobrých strelcov sa po svete potuluje málo. Vďaka ich zručnosti sú dosť vyhľadávaný napríklad do kráľovských vojsk či potulných skupín dobrodruhov. Už neraz sa stalo že skupinu pred istou smrťou zachránila práve presná muška strelca. Vo všeobecnosti sú strelci považovaný za kľudných a rozvážnych ľudí (alebo iné rasy), ktorý toho moc nenarozprávajú a veľa koncentrácie venujú sledovaniu okolia a prípadnej streľbe. Veľmi častými a dobrými strelcami bývajú elfovia. <br /><br />Životy: 5, za úroveň +3<br />Zbrane: používa krátke, vrhacie, luky, kuše, iné nepoužíva!<br />Špecializácia: na luky a kuše<br />Zbroje: používa ľahké a stredné<br />Štíty: nepoužíva<br />Presvedčenie: 1-7<br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – luky a kuše +1 (od útoku).<br /><br />1. úroveň<br />Slabé miesto<br />V prípade, že ma protivník na sebe zbroj, strelec dokáže v jeho zbroji nájsť slabé miesto a zraniť ho priamo na tele, to znamená že životy si treba dopočítať z tela a nie zbroje. Pri vystrelení šípu musí strelec počítať do 10 a ešte zakričať „nachádzam Tvoje slabé miesto“ a musí trafiť. Schopnosť môže využiť 1 krát v každom boji <br /><br />Šíp bolesti<br />Týmto špeciálnym šípom strelec spôsobuje zranenie o jedno väčšie ako zvyčajne. Musí však pri vystrelení šípu zakričať „tento šíp Ťa bude dlho bolieť“ Strelec ho môže použiť 1 x za 2 hodiny.<br /><br />2. úroveň<br />Pribodnutie<br />Pokiaľ strelec strieľa na niekoho kto stojí v blízkosti stromu (alebo drevenej stavby), najviac však 3 metre, môže ho k nemu na dobu 3 minút pribodnúť, stačí ak ho trafí a zakričí „pribodnem ťa ako červa“. Postrelený sa musí pritlačiť na daný strom a tu zotrvať kým neuplynie čas, stráca jeden život ale môže sa ďalej brániť. Schopnosť možno využiť 1 x za 4 hodiny.<br /><br />Svetlica<br />V prípade, že chce strelec odlákať niekoho pozornosť, vystrelí do vzduchu šíp (na ktorého hrot predtým musí uviazať aspoň 20 cm dlhú a 1 cm širokú žltú stuhu), so slovami „aha svetlica“ a všetci v okolí 10 metrov sa musia pozerať na šíp, až kým nedopadne zase naspäť. Po túto dobu môže strelec prekĺznuť stráži, utiecť alebo na niekoho zaútočiť. Ten sa však po prvom údere začne brániť a môže vyvolať rozruch na ktorý môžu zareagovať aj ostatný. Svetlicu možno použiť 1 x za 4 hodiny. <br /><br />3. úroveň<br />Mierenie<br />Je to vlastne mierením na citlivé miesto spôsobené veľmi ťažké zranenie. Strelec namieri na protivníka, ráta do 10, zakričí „mierim svojou presnou muškou“ a vystrelí šíp. V prípade že trafí, spôsobí zranenie o 5 väčšie ako robí bežne so svojím lukom.<br />Schopnosť možno využiť 1 x za 6 hodín.<br /><br />Útek<br />Ak je so strelcom už naozaj zle tak zvolí útek, pri ktorom zakričí „nôžky moje bežte preč“ utečie všetkým prenasledovateľom, respektíve, tí už ho nemôžu ďalej prenasledovať, proste im ušiel. Túto schopnosť môže strelec využiť maximálne 1 x za deň a nemôže byť pri tom zviazaný, zajatý alebo bezprostredne obkľúčený!!!<br /><br />4. úroveň<br />Ohnivý šíp<br />Strelec si dokáže spraviť zápalné šípy, ktorými dokáže podpáliť veci ktoré by sa ľahko zapálili (napr. drevené či slamené veci či stavby). Samozrejme že stavbu alebo danú vec možno včas zahasiť pokiaľ sa oheň moc nerozšíri. Stavbu za masívneho dreva treba začať hasiť do 10 minút, z jemnejšieho dreva do 5 minút a papier či seno okamžite (ostatné veci prípadne posúdi org.). Pokiaľ by však takýto ohnivý šíp trafil do nejakej bytosti ktorá nieje chránená nejakou zbrojou či prirodzenou ochranou, tak je zranená okrem normálneho zranenia od šípu ešte aj ohnivým zranením za 3 životy (postava musí byt teda bez zbroje alebo šíp túto zbroj musel preraziť). Strelec na hrot svojho šípu musí uviazať aspoň 40 cm dlhú a 2 cm širokú žltú stuhu a pri výstrele zakričať: „strieľam ohnivý šíp“. Túto schopnosť môže použiť 1x za hodinu, samozrejme nie za dažďa. <br /><br />Odstrelenie predmetu<br />Ak lukostrelec trafí postavu a zvolá „odstrelenie zbrane (prípadne, štítu, alebo nejakej konkrétnej veci čo daná postava práve drží v ruke)“ tak postava nie je zranená, ale musí odhodiť zbraň (či iný predmet), aj keby ju držala v dvoch rukách, pretože jej ju lukostrelec vystrelil z ruky. Postava pritom musí zbraň odhodiť aspoň na 3 metre od seba, nie že si ju položí k nohám! Schopnosť môže strelec použiť len 1x za 3 hodiny.<br /><br />5. úroveň<br />Špecializácia na zbraň – luky a kuše +2 (od útoku).<br /><br />Skrytie <br />V prípade, že strelca niekto sleduje, alebo sa sám potrebuje niekde ukryť, použije skrytie. Skrytie je podobne schopnosti maskovanie, s tým rozdielom že skryť sa dá aj v meste. Stačí ak sa má strelec za čo skovať (strom, dom/stan, hradby, vysoká tráva a pod.) a musí zakričať „skrývam sa“ a hráči musia predstierať, že ho nevidia! Vo chvíli keď však chce túto schopnosť použiť musí byť aspoň 10 metrov od postáv pred ktorými sa chce skovať. V opačnom prípade ho budú vidieť. Aby nebol odhalený musí sa skrývať v tichosti a nemôže sa hýbať, avšak jeden krát môže vystreliť bez toho aby si ho prenasledovatelia všimli (nezáleží na tom či niekoho z nich trafí alebo nie). Skrytie môže využiť 1x za 4 hodiny.<br /><br />6.úroveň<br />Výbušný šíp<br />Strelec si dokáže spraviť výbušné šípy, ktorými dokáže rozbiť alebo poškodiť (treba konzultovať s organizátorom) určité veci prípadne zraniť viacej postáv naraz. Ak trafí takýmto šípom priamo do nejakej postavy zraní ju za 8 životov (hoc by mala postava na sebe akúkoľvek zbroj, ak by však strelec trafil štít, tak je postava zranená len za 3 životy) a postava musí ustúpiť o 3 metre dozadu a padnúť na zem (aj v prípade že bola trafená do štítu). Ak by však strelec takýto šíp strelil do zeme pri skupinu postáv, tak všetky tieto postavy v okruhu 3m sú zranené za 3 životy a musia ustúpiť o 3m dozadu (nepadajú však na zem). Strelec na hrot svojho šípu musí uviazať aspoň 40 cm dlhú a 2 cm širokú červenú stuhu a pri výstrele zakričať: „strieľam výbušný šíp“. Túto schopnosť môže použiť 1x za 8 hodín. Aj keby však netrafil žiadnu postavu ani by šíp neskončil v blízkosti žiadnej postavy sa táto schopnosť ráta za použitú!!</p>";

var lvo="<h3 onclick=\"document.getElementById('lvo').innerHTML=lvoa\">Lovec odmien:</h3><p>Povolanie ktoré je veľmi podobné tomu žoldnierskemu. Až na to že lovci odmien pracujú v malých skupinách a v žiadnom prípade sa nenechávajú najímať do armád alebo ako osobná stráž. Oveľa viac sa zamýšľajú nad tým akú úlohu zoberú a do čoho sa to vlastne púšťajú. Ich život hrá tiež veľkú rolu sebectvo ale nie až tak veľké ako u žoldnierov, častejšie sa prikláňajú na stranu dobra či zla a v tom záujme potom aj konajú a za svoje služby ani nebudú žiadať taký veľký obnos peňazí. Často si ich najímajú rôzny, šľachtici, panovníci, alebo čarodejníci aby pre nich niekoho zajali, zabili alebo objavili vzácny artefakt. V prípade že sa pripoja na stranu dobra lovia zbojníkov, vrahov, zlodejov a podobnú háveď.<br /><br />Životy: 6, za úroveň +3 na každej párnej +4<br />Zbrane: používa krátke, stredné, vrhacie, kuše, iné nepoužíva!<br />Špecializácia: na stredné zbrane<br />Zbroje: používa ľahké a stredné<br />Štíty: malý<br />Presvedčenie: 3-5 <br />Schopnosti:<br /><br />0. úroveň<br />Špecializácia na zbraň – stredné zbrane +1 (od útoku).<br /><br />1. úroveň<br />Zviazanie<br />Lovec odmien dokáže svoju obeť zviazať tak, že pokiaľ aj má schopnosť putá (alebo niečo podobné) z jeho zviazania sa aj tak nedostane. Na zviazanie potrebuje aspoň kúsok špagátu a pri zväzovaní obete povedať „z mojich uzlov sa nedostaneš“. Túto schopnosť môže použiť 6 krát za deň. <br /><br />Mučenie<br />V prípade že sa zajatcovi nechce hovoriť príliš pravda je treba mu k tomu dopomôcť. Túto situáciu treba aby aj obeť aj lovec odmien dobre zahrali a môžu získať aj nejakú tú skúsenosť. Lovec odmien si sám zvolí spôsob mučenia (samozrejme taký aby nikomu v skutočnosti neublížil!) pri ktorom môže dať obete 3 otázky a tá na ne musí pravdivo odpovedať!!! No ešte predtým musí obeti povedať „vo svojich  mukách mi povieš pravdu“. Mučenie by malo trvať 10 až 15 minút. Mučenie môže využívať 3 x za deň, maximálne však 1 x za deň tú istú osobu! <br /><br />2. úroveň<br />Omráčenie<br />Na hranici vyradenia môže omračovať každý, avšak len pár povolaní v rátane lovca odmien dokáže omráčiť postavu s plnými životmi ale tá nesmie mať chránenú hlavu prilbou alebo drátenou kuklou a o jeho zámere nesmie vedieť. Tiež nemôže omračovať počas boja. Pri omráčení musí položiť ruku na hlavu obete a povedať „omračujem Ťa, napriek tvojim životom“ a obeť musí hneď predstierať omráčenie po dobu 5 minút. Omráčenie môže využiť 1x za 8 hodín. <br /><br />Odhaľ skrytého<br />Pokiaľ sa niekto maskuje, skrýva, alebo sa skrýva v tieni, lovec odmien ho vďaka tejto schopnosti uvidí. Stačí keď sa na neho pozrie, 3 x okolo neho prejde a povie „horšie si sa skovať nemohol“. V tej chvíli je nepriateľ odhalený! Schopnosť môže použiť 5 x za deň.<br /><br />3. úroveň<br />Provokácia<br />Pri použití tejto schopnosti na súpera ktorý sa s vami nechce byť, ho svojimi rečami vyprovokujete do takej miery, až sa nakoniec pre súboj s vami rozhodne sám. Provokáciu treba dobre zahrať a pri tom všetkom čím ho budete provokovať treba na konci, aspoň po 3 minútach vášho preslovu povedať „uchop už konečne poriadne tú zbraň, nech Ti môžem nakopať zadok“. Po týchto slovách sa na vás protivník musí vrhnúť a bojovať s vami. Schopnosť možno využiť 1 x za 4 hodiny. Nemožno použiť na lovca odmien!<br /><br />Vytvorenie uspávadla (stredne silného)<br />Počas hry sa dozviete ingrediencie na vytvorenie uspávadla, ktoré si môžete sami zhotoviť. Za jeden deň dokážete vyrobiť uspávadlo na 3 použitia. Je to uspávadlo strednej kategórie. Má však krátku trvácnosť a na ďalší deň sa vám skazí a nebude účinkovať. Takže na každý deň treba vytvoriť nové uspávadlo. Použiť sa dá pridaním do jedla, pitia, (tieto situácie treba však dobre zahrať) alebo ním polejte čepeľ zbrane (žiadne kladivá či palcáty a po každom platnom zásahu, si treba zase zbraň poliať, to znamená že jedno použitie = jeden zásah!). Účinkuje asi za 5 minút a doba trvania účinku je 15 minút. Obeti však treba oznámiť že ste na ňu použili uspávdlo strednej kategórie a jeho účinky (toto však doporučujem spraviť až po tých 5 minútach aby už nič nenamietala).<br /><br />4. úroveň<br />Odlákaj pozornosť<br />Túto schopnosť nemožno použiť priamo v boji. Pokiaľ lovec odmien potrebuje odlákať niekoho pozornosť (napríklad sa potrebuje dostať na strážené miesto a pod.) zoberie konár, alebo kamienok a hodí ho smerom ktorým chce odlákať postavu a zakričí „odlakávam Tvoju pozornosť“ (pozor aby ste niekoho netrafili). Od tejto postavy však musí byť vzdialený aspoň na 10 m a postava nesmie v tej chvíli na neho útočiť. Ak splnil tieto podmienky, postava sa musí daným smerom vybrať asi tak na 70 metrov, tam sa poriadne rozhliadnuť a potom sa môže vrátiť. Odlákanie pozornosti môže použiť 1 za 4 hodín.<br /><br />Najatie <br />Pokiaľ nejaká postava hľadá ľudí na určitú prácu alebo výpravu tak lovec odmien dokáže túto postavu presvedčiť o tom, že on je ten pravý pre túto robotu a postava ho musí najať hoc by to aj nechcela. Stačí ak lovec odmien danú postavu aspoň 3 minúty presviedča o jeho kvalitách a na konci rozhovoru povie: „najmi ma na tento kšeft“. Ukončenie tohto záväzku môže len dokončenie roboty na ktorú bol najatý, alebo kedykoľvek sa sám lovec odmien rozhodne prípadne aj postava ktorá ho najala ak by počas úlohy zistila že lovec odmien nejedná v prospech kladného dokončenia úlohy alebo celu úlohu nejako ohrozuje svojim konaním. Najatie môže použiť len jeden krát za deň (neplatí to však na osobu ktorá ho v minulosti už najala a z práce následne odvolala z dôvodov vyššie uvedených) . <br />5. úroveň<br />Špecializácia na zbraň – stredné zbrane +2 (od útoku).<br /><br />Zlosť mamony<br />V prípade že by lovca odmien niekto okradol, alebo mu nezaplatil takú odmenu na akej sa dohodli, posadne ho neskutočná zlosť voči tejto osobe alebo skupine osôb a v danej chvíli sa mu v boji proti nej zvýši útok +2 a tento bonus trvá počas celého súboja. V prípade že ten čo ho podviedol utečie, alebo utečie skôr než to lovec odmien zistí má 1 hodinu na to aby ho našiel lebo dovtedy potrvá jeho zlosť (resp. bonus na útok). Na začiatku súboja však musí lovec odmien na nepriateľa zakričať „teraz si vezmem čo mi patrí aj s tvojím životom“! Tento bonus na útok platí len voči osobám ktorého ho podviedli. Schopnosť je automatická a neobmedzená.<br /><br />6.úroveň<br />Neľútostná rana<br />Lovci odmien sú pri dosahovaní svojich cieľov neľútostný a nekompromisný a svojim protivníkom dokážu zasadiť tvrdý úder (zbraňou). Takže pri útoku bude mať bonus +4. Stačí ak lovec odmien pri platnom zásahu zakričí „zničím ťa, stoj čo stoj“ a číslo akým súpera zranil (ak zbraň zraňuje za 2, útok bude za 6 životov). Môže to použiť 1x za 3 hodiny.</p>";
